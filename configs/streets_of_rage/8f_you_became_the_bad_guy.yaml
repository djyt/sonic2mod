name: "You Became the Bad Guy!"
input_file: "input/roms/Bare Knuckle - Ikari no Tekken ~ Streets of Rage (World) (Rev A).md"
rom_song: "$8F"

sample_list:   # volumes set from the VGZ; the rest is derived
