# -------------------------------------------------------------------------------------------------
# 1-Up / Extra Life Conversion Script
# synth_root is not stated: the converter renders each entry at the pitch the chip plays for its low note.
# -------------------------------------------------------------------------------------------------
name: 1-Up (Extra Life)
input_file: "input/Mus88 - Extra Life.asm"
output_file: output/15_1up.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 9            # 180 BPM: a MOD tick is 0.83 frames, as at 1 tick per row and speed 3
ticks_per_row: 3           # every duration is a multiple of $03: one row each, the jingle 28 rows of one pattern
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6

sample_list:
  # --- percussion ---
  - [1, "timpani.raw", 64, 0]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 7 — FM1, FM4 ---
  - [2, "fm_v00.raw", 13, 0] # VGZ: +5.5 dB at 24
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [3, "fm_v01.raw", 17, 0] # VGZ: +2.9 dB at 24
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM3, FM5 ---
  - [4, "fm_v02.raw", 12, 0] # VGZ: +6.1 dB at 24
  # --- PSG tone fTone_05 ---
  - [5, "psg_fTone_05.raw",  4, 0] # baked: 16 at PSG attenuation 6 (−12 dB)
  # Detuned versions (smpsAlterNote rendered into the sample)
  - [6, "fm_v00_fm4.raw", 13, 0] # VGZ: +5.6 dB at 24
  - [7, "fm_v02_fm5.raw", 12, 0] # VGZ: +6.1 dB at 24

dac_samples:
  # Rates measured from the VGZ's PCM writes per second, ~3.5 % under the documented ones
  # (9588 / 7006 / 7154 Hz, which put the high timpani at D#2, 95 cents sharp)
  # dHiTimpani: ×5 — ~9320 Hz → note D2 (9309 Hz, −2 c)
  - name: dHiTimpani
    mod_instrument: 1
    mod_note: D2
  # dVLowTimpani: ×3 — ~6740 Hz → note Gs1 (6593 Hz, −38 c; A1 is +61)
  - name: dVLowTimpani
    mod_instrument: 1
    mod_note: Gs1
  # dLowTimpani: ×2 — ~6890 Hz → note A1 (6982 Hz, +23 c)
  - name: dLowTimpani
    mod_instrument: 1
    mod_note: A1

voice_map:
  # $00 — alg 2: (1+(2→3))→4, fb 7 — used by FM1, FM4
  0:
    - low:  Cs7
      high: Fs7
      mod_instrument: 2
      root: Cs2
  # $01 — alg 2: (1+(2→3))→4, fb 7 — used by FM2
  1:
    - low:  A6
      high: D7
      mod_instrument: 3
      root: A2
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM3, FM5
  2:
    - low:  G4
      high: A4
      mod_instrument: 4
      root: G2

psg_voice_map:
  fTone_05:
    low:  A6
    high: D7
    mod_instrument: 5
    root: A2

# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM4:
    0:
      - low:  Cs7
        high: Fs7
        mod_instrument: 6
        root: Cs2
        
  FM5:
    2:
      - low:  G4
        high: A4
        mod_instrument: 7
        root: G2

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version (convert.py --merged)
# DAC · lead (FM1+FM4) · harmony (FM2+PSG1) · bass (FM3+FM5): three doubled pairs, every fold clean.
# Two composites a pair: the first five notes' 100 ms fill is keyed off on the chip (merge_twins:
# always cuts them in the pattern instead, -4.7 KB, up to 12 dB off at the cut).  FM3+FM5 reads
# +2.4 dB over its chip channels: hard left + hard right, nearly in phase, summed in mono
# -------------------------------------------------------------------------------------------------
merge:
  # FM4 plays FM1's data detuned (smpsAlterNote $03), FM1 left, FM4 right
  - primary: FM1
    followers: [FM4]

  # PSG1 plays FM2's notes
  - primary: FM2
    followers: [PSG1]

  # FM5 plays FM3's data detuned, FM3 left, FM5 right
  - primary: FM3
    followers: [FM5]
