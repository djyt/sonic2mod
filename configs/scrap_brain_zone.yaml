# Generated by analyze.py — fill in root/synth_root values
# Song: Mus86 - SBZ.asm

name: Scrap Brain Zone
input_file: sonic_1\music\Mus86 - SBZ.asm
output_file: output/sbz.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 1
num_mod_channels: 10
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7
  - source: PSG3
    mod_channel: 8

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 64, 0]
  - [2, "kick.raw", 64, 0]
  - [3, "timpani.raw", 64, 0]
  # --- voice $00: Alg 0, FB 1 — FM2, FM3 ---
  - [4, "fm_v00.raw", 32, 0]
  # --- voice $01: Alg 4, FB 5 — FM3 ---
  - [5, "fm_v01.raw", 32, 0]
  # --- voice $02: Alg 5, FB 7 — FM1, FM4, FM5 ---
  - [6, "fm_v02.raw", 32, 0]
  # --- voice $03: Alg 1, FB 5 — FM1, FM3 ---
  - [7, "fm_v03.raw", 16, 0]
  # --- voice $04: Alg 5, FB 7 — FM4, FM5 ---
  - [8, "fm_v04_lo.raw", 32, 0]
  - [9, "fm_v04_hi.raw", 32, 0]
  # --- voice $05: Alg 0, FB 6 — FM1, FM4 ---
  - [10, "fm_v05_lo.raw", 32, 0]
  - [11, "fm_v05_hi.raw", 32, 0]
  # --- voice $06: Alg 5, FB 7 — FM5 ---
  - [12, "fm_v06.raw", 64, 0]
  # --- PSG noise (form $E7) ---
  - [17, "psg_noise.raw", 16, 0]
  # --- PSG tone $00 ---
  - [13, "psg_$00.raw", 10, 0]
  # --- PSG tone fTone_06 ---
  - [14, "psg_fTone_06.raw", 10, 0]
  # --- PSG tone fTone_05 ---
  - [15, "psg_fTone_05.raw", 16, 0]
  # --- PSG noise (fTone_04 envelope) ---
  - [16, "psg_noise.raw", 16, 0]
  # --- PSG noise (fTone_08 envelope) ---
  - [18, "psg_noise.raw", 16, 0]

dac_samples:
  # dSnare: ×82 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 1
    mod_note: Fs3
  # dKick: ×73 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 2
    mod_note: C2
  # dHiTimpani: ×38 — native ~9588 Hz → note Ds2
  - name: dHiTimpani
    mod_instrument: 3
    mod_note: Ds2
  # dMidTimpani: ×30 — native ~8850 Hz → note Cs2
  - name: dMidTimpani
    mod_instrument: 3
    mod_note: Cs2

voice_map:
  # $00 — Alg 0, FB 1 — used by FM2, FM3
  0:
    - low:  G3
      high: A4
      mod_instrument: 4
      root: G2
      synth_root: G3
  # $01 — Alg 4, FB 5 — used by FM3
  1:
    - low:  A4
      high: G5
      mod_instrument: 5
      root: A2
      synth_root: A4
  # $02 — Alg 5, FB 7 — used by FM1, FM4, FM5
  2:
    - low:  B5
      high: B6
      mod_instrument: 6
      root: B2
      synth_root: B5
      # WARNING: channel uses smpsChangeTransposition — remove root, use channel transpose instead
  # $03 — Alg 1, FB 5 — used by FM1, FM3
  3:
    - low:  C6
      high: C7
      mod_instrument: 7
      root: C2
      synth_root: C6
      # WARNING: channel uses smpsChangeTransposition — remove root, use channel transpose instead
  # $04 — Alg 5, FB 7 — used by FM4, FM5
  4:
    - low:  B4
      high: B5
      mod_instrument: 8
      root: B2
      synth_root: B4
      # WARNING: channel uses smpsChangeTransposition — remove root, use channel transpose instead
    - low:  C6
      high: Cs6
      mod_instrument: 9
      root: C2
      synth_root: C6
      # WARNING: channel uses smpsChangeTransposition — remove root, use channel transpose instead
  # $05 — Alg 0, FB 6 — used by FM1, FM4
  5:
    - low:  G4
      high: B5
      mod_instrument: 10
      root: G2
      synth_root: G4
      # WARNING: channel uses smpsChangeTransposition — remove root, use channel transpose instead
    - low:  C6
      high: Gs6
      mod_instrument: 11
      root: C2
      synth_root: C6
      # WARNING: channel uses smpsChangeTransposition — remove root, use channel transpose instead
  # $06 — Alg 5, FB 7 — used by FM5
  6:
    - low:  G5
      high: G6
      mod_instrument: 12
      root: G2
      synth_root: G5
      # WARNING: channel uses smpsChangeTransposition — remove root, use channel transpose instead

psg_map:
  0xE7:                    # form $E7
    mod_instrument: 17
    root: A3
    noise_rate: 3
    envelope: fTone_04
    base_volume: 0

psg_voice_map:
  $00:
    low:  D5
    high: As5
    mod_instrument: 13
    root: D2
    synth_root: D4
  fTone_06:
    low:  E6
    high: Gs6
    mod_instrument: 14
    root: E2
    synth_root: E6
  fTone_05:
    low:  G6
    high: G7
    mod_instrument: 15
    root: G2
    synth_root: G6
    envelope: fTone_02
  fTone_04:
    type: white_noise
    noise_rate: 0
    mod_instrument: 16
    root: A3
  fTone_08:
    type: white_noise
    noise_rate: 0
    mod_instrument: 18
    root: A3

# -------------------------------------------------------------------------------------------------
# Structural pattern breaks to align to grid
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 1
    row: 31
  - pattern: 15
    row: 31