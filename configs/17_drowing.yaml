# -------------------------------------------------------------------------------------------------
# DROWNING Conversion Script
#
# Todo: This track is intended to speed up as it progresses. 
#       The tooling currently doesn't support that!
#       Given this only impacts one short track, it's probably easier to handle this manually
# -------------------------------------------------------------------------------------------------

name: Drowning
input_file: sonic_1\music\Mus92 - Drowning.asm
output_file: output/17_drowning.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 2
ticks_per_row: 1
num_mod_channels: 8
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 64, 0]
  # --- voice $00: alg 4: (1→2)+(3→4), fb 7 — FM1, FM5 ---
  - [2, "fm_v00.raw", 32, 0]
  # --- voice $01: alg 0: 1→2→3→4, fb 3 — FM2 ---
  - [3, "fm_v01.raw", 32, 0]
  # --- voice $02: alg 4: (1→2)+(3→4), fb 5 — FM3 ---
  - [4, "fm_v02.raw", 32, 0]
  # --- voice $03: alg 7: 1+2+3+4, fb 0 — FM4 ---
  - [5, "fm_v03.raw", 32, 0]

dac_samples:
  # dSnare: ×41 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 1
    mod_note: Fs3

voice_map:
  # $00 — alg 4: (1→2)+(3→4), fb 7 — used by FM1, FM5
  0:
    - low:  C4
      high: Cs5
      mod_instrument: 2
      root: C2
      synth_root: C6
  # $01 — alg 0: 1→2→3→4, fb 3 — used by FM2
  1:
    - low:  C4
      high: Cs5
      mod_instrument: 3
      root: C2
      synth_root: C3
  # $02 — alg 4: (1→2)+(3→4), fb 5 — used by FM3
  2:
    - low:  C6
      high: Cs6
      mod_instrument: 4
      root: C2
      synth_root: C6
  # $03 — alg 7: 1+2+3+4, fb 0 — used by FM4
  3:
    - low:  C4
      high: Cs5
      mod_instrument: 5
      root: C2
      synth_root: Fs5
