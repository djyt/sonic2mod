  - [7, "fm_v02_Cs3.raw", 6, 0]   # VGZ: +2.9 dB at 9
  - [12, "fm_v07_F4.raw", 38, 0]   # VGZ: -1.4 dB at 32
  - [13, "fm_v08_B7.raw", 15, 0]   # VGZ: -3.5 dB at 10
  - [17, "psg_$00_B7.raw", 3, 0]   # VGZ: +1.9 dB at 4
