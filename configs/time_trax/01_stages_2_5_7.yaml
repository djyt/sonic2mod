# Time Trax (prototype) - Stages 2, 5, 7.  A minimal config: everything else is derived from the ROM
# (docs/todo/done/time_trax.md); python convert.py <this> --show-config prints it.
name: "Stages 2, 5, 7"
input_file: "input/roms/Time Trax (USA) (Proto).md"
rom_song: "$01"
region: pal               # the rips run at 50 Hz (docs/todo/done/time_trax.md D2)
level_patch_min: 3        # a voice copy within 3 TL steps (2.25 dB) of its voice plays as it
baked_slots: 4            # slots kept for baked drum sweeps and envelopes (core/plan/baked.py)

sample_list:   # volumes set from the VGZ; the rest is derived
  - [1, "fm_v01_E4.raw", 44, 0]   # VGZ: +1.9 dB at 54
  - [6, "fm_v8b_Ab2.raw", 28, 0]   # VGZ: +2.0 dB at 35
  - [8, "fm_v94_C3.raw", 12, 0]   # VGZ: +2.4 dB at 16
  - [13, "fm_v35_C3.raw", 25, 0]   # VGZ: +8.1 dB at 64
  - [14, "fm_v36_Eb2.raw", 33, 0]   # VGZ: +5.9 dB at 64
  - [15, "fm_v36_C4.raw", 35, 0]   # VGZ: +5.2 dB at 64
  - [16, "fm_v37_C2.raw", 61, 0]   # VGZ: -8.4 dB at 23
  - [17, "fm_v3b_F3.raw", 12, 0]   # VGZ: -4.6 dB at 7
  - [21, "fm_v40_F3.raw", 20, 0]   # VGZ: -8.9 dB at 7
  - [22, "fm_v41_Cs2.raw", 37, 0]   # VGZ: -6.2 dB at 18
  - [24, "fm_v46_Bb2.raw", 18, 0]   # VGZ: -8.4 dB at 7
  - [25, "fm_v47_Eb5.raw", 31, 0]   # VGZ: -4.8 dB at 18
  - [27, "fm_v4a_F3.raw", 26, 0]   # VGZ: -4.7 dB at 15
