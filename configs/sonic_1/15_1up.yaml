# -------------------------------------------------------------------------------------------------
# 1-Up / Extra Life Conversion Script
# synth_root is not stated: the converter renders each entry at the pitch the chip plays for its low note.
# -------------------------------------------------------------------------------------------------
name: 1-Up (Extra Life)
input_file: "input/sonic_1/Mus88 - Extra Life.asm"
output_file: output/sonic_1/15_1up.mod
samples_dir: "input/sonic_1/samples/"

auto_bpm: true
target_speed: 9            # 180 BPM: a MOD tick is 0.83 frames, as at 1 tick per row and speed 3
ticks_per_row: 3           # every duration is a multiple of $03: one row each, the jingle 28 rows of one pattern
region: ntsc

# Variant lofi (convert.py --variant lofi --merged -> output/sonic_1/15_1up_lofi_merged.mod): the merged build
# 50 -> 30 KB.  The bass pair on a sliding loop (its level falls for as long as a note holds: looped early,
# the fall in volume slides) and the harmony mixes at F2 (11 kHz, its treble above 5.5 kHz gone).  The
# harmony never loops (its FM and PSG envelopes never settle together); the timpani as it is.  Left out:
# merge_twins: always (-4.8 KB, up to 12 dB off at the cut), the lead looped at 12 dB (-1 KB)
variants:
  lofi:
    name: "1-Up (Extra Life) lofi"

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6

sample_list:
  # --- percussion ---
  - [1, "timpani.raw", 64, -1]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 7 — FM1, FM4 ---
  - [2, "fm_v00.raw", 13, 0] # VGZ: +5.5 dB at 24
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [3, "fm_v01.raw", 17, 0] # VGZ: +2.9 dB at 24
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM3, FM5 ---
  - [4, "fm_v02.raw", 12, 0] # VGZ: +6.1 dB at 24
  # --- PSG tone fTone_05 ---
  - [5, "psg_fTone_05.raw",  4, 0] # baked: 16 at PSG attenuation 6 (−12 dB)
  # Detuned versions (smpsAlterNote rendered into the sample)
  - [6, "fm_v00_fm4.raw", 13, 0] # VGZ: +5.6 dB at 24
  - [7, "fm_v02_fm5.raw", 12, 0] # VGZ: +6.1 dB at 24

dac_samples:
  # The rates are the Z80 loop's cycle count (core/rom/dac.py, exact from the ROM) less the
  # 68k's once-a-frame stopZ80, measured in the VGZ; the rip's own rates run 2-3 % fast.  The low
  # and very low timpani are 45 cents apart on one slot: the finetune splits the error
  # dHiTimpani: ×5 — ~9223 Hz on hardware (the cycle count less this song's 4.3 % per-frame stall) → D2 ft -1 (+4 c)
  - name: dHiTimpani
    mod_instrument: 1
    mod_note: D2
  # dVLowTimpani: ×3 — ~6660 Hz on hardware (the cycle count less this song's 4.3 % per-frame stall) → Gs1 ft -1 (-30 c)
  - name: dVLowTimpani
    mod_instrument: 1
    mod_note: Gs1
  # dLowTimpani: ×2 — ~6833 Hz on hardware (the cycle count less this song's 4.3 % per-frame stall) → A1 ft -1 (+25 c)
  - name: dLowTimpani
    mod_instrument: 1
    mod_note: A1

voice_map:
  # $00 — alg 2: (1+(2→3))→4, fb 7 — used by FM1, FM4
  0:
    - low:  Cs7
      high: Fs7
      mod_instrument: 2
      root: Cs2
  # $01 — alg 2: (1+(2→3))→4, fb 7 — used by FM2
  1:
    - low:  A6
      high: D7
      mod_instrument: 3
      root: A2
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM3, FM5
  2:
    - low:  G4
      high: A4
      mod_instrument: 4
      root: G2

psg_voice_map:
  fTone_05:
    low:  A6
    high: D7
    mod_instrument: 5
    root: A2

# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM4:
    0:
      - low:  Cs7
        high: Fs7
        mod_instrument: 6
        root: Cs2
        
  FM5:
    2:
      - low:  G4
        high: A4
        mod_instrument: 7
        root: G2

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version (convert.py --merged)
# DAC · lead (FM1+FM4) · harmony (FM2+PSG1) · bass (FM3+FM5): three doubled pairs, every fold clean.
# Two composites a pair: the first five notes' 100 ms fill is keyed off on the chip (merge_twins:
# always cuts them in the pattern instead, -4.7 KB, up to 12 dB off at the cut)
# -------------------------------------------------------------------------------------------------
merge:
  # FM4 plays FM1's data detuned (smpsAlterNote $03), FM1 left, FM4 right
  - primary: FM1
    followers: [FM4]
    loop_start_ms: 60          # the pair beats (7 dB, 0.45 s): flat from its first window, it looped at 21 ms,
                               # inside the attack, a 1.3 dB re-attack every beat; from 60 ms the seam is level

  # PSG1 plays FM2's notes
  - primary: FM2
    followers: [PSG1]
    variants:
      lofi: {mix_note: F2}     # 11 kHz instead of 14-18 (-7.7 KB; A2: -4.2 KB)

  # FM5 plays FM3's data detuned, FM3 left, FM5 right
  - primary: FM3
    followers: [FM5]
    variants:
      lofi:
        loop_decay: slide      # 14.1 -> 1.6 KB; the bass 0.6 dB from the VGZ's balance (frozen at 12 dB: 1.9)
        loop_drift_db: 2       # (3: +1.3 dB)
