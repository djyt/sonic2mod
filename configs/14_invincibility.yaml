# -------------------------------------------------------------------------------------------------
# INVINCIBILITY Conversion Script
# -------------------------------------------------------------------------------------------------
name: Invincibility
input_file: "input/Mus87 - Invincibility.asm"
output_file: output/14_invincibility.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 2
region: ntsc
range_space: chip          # ranges are the pitches the chip plays (tools/config_to_chip_space.py)

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  # Detuned version of FM1
  - source: FM5
    mod_channel: 5
  - source: PSG3
    mod_channel: 6

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 57, 0] # VGZ: +1.0 dB at 64
  - [2, "kick.raw", 64, 0]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 7 — FM1, FM3, FM4, FM5 ---
  - [3, "fm_v00.raw", 17, 0] # VGZ: +0.9 dB at 19
  - [4, "fm_v00_fm5.raw", 19, 0] # VGZ: +4.5 dB at 32
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [5, "fm_v01.raw", 35, 0] # VGZ: -0.8 dB at 32
  # --- PSG noise (form $E7) ---
  - [6, "psg_noise.raw",  3, 0] # baked: 16 at PSG attenuation 3 (−6 dB); VGZ: +5.8 dB at 6

dac_samples:
  # dSnare: ×42 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 1
    mod_note: Fs3
  # dKick: ×23 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 2
    mod_note: C2

voice_map:
  0:
    - low:  G3   # was G5-Cs7 (source bytes) for FM3, FM4, FM1, FM5
      high: Cs6
      mod_instrument: 3
      root: C1
  1:
    - low:  G1   # was G2-D4 (source bytes) for FM2
      high: D3
      mod_instrument: 5
      root: G1
psg_map:
  0xE7:                    # form $E7
    mod_instrument: 6
    root: A3
    
# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 shares FM1's data. smpsAlterNote $03 is a raw FNUM offset (+5..8 cents).
# Its own instrument is rendered at that offset (core/plan/detune.py).
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    0:
    - low:  G4   # was G5-Cs7 (source bytes) for FM5
      high: Cs6
      mod_instrument: 4
      root: G1

# -------------------------------------------------------------------------------------------------
# Structural pattern breaks to align to grid
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 23

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version (convert.py --merged)
# drums (DAC+PSG3) · lead (FM1+FM5) · bass (FM2) · chords (FM3+FM4) → 4-channel M.K.
# The two FM folds are clean (tools/merge_survey.py); the bass stays on its own channel.
# -------------------------------------------------------------------------------------------------
merge_twins: always            # the snare + short hat mix (4 notes) was the long-hat one cut earlier

merge:
  # Lead: FM5 plays FM1's data detuned (smpsAlterNote $03): one chip composite
  - primary: FM1
    followers: [FM5]

  # Chords: FM3 + FM4 in parallel, four chip composites
  - primary: FM3
    followers: [FM4]

  # Drums carry the hats: snares the long one (200 ms), kicks the short (50 ms).  Three hats start
  # over a drum's tail and cut it (cut_primary, 0 lost); four still ringing at the next hit are cut.
  - primary: DAC
    followers: [PSG3]
    cut_primary: true
    limit_db: 4              # the kick + hat peak (0.5 dB over) limited, not the mix turned down
