# -------------------------------------------------------------------------------------------------
# TITLE SCREEN MUSIC Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Title Screen"
input_file: "input/Mus8A - Title Screen.asm"
output_file: "output/01_title_screen.mod"
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3
ticks_per_row: 3


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  - source: FM1
    mod_channel: 1

  - source: FM2
    mod_channel: 2

  - source: FM3
    mod_channel: 3

  - source: FM4
    mod_channel: 4

  # Detuned version of FM1
  - source: FM5
    mod_channel: 5

  # White Noise Channel
  - source: PSG3
    mod_channel: 6


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if fm_synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
#
# FM volumes bake in the smpsHeaderFM TL offsets (FM1 $0C, FM2 $09, FM3 $0D, FM4 $0C, FM5 $0E;
# 0.75 dB per step) relative to FM2, so no per-note Cxx is needed:  32 × 10^(−steps×0.75/20).
# FM3/FM4 end on voice $01 with smpsAlterVol −4/−3, which lands them exactly on FM2's $09, so
# instrument 5 serves all three at 32.  Verified against reference/vgz with tools/vgm_compare.py.
# -------------------------------------------------------------------------------------------------
sample_list:
  # --- percussion ---
  - [1, "kick.raw",          64, 0]
  - [2, "snare.raw",         64, 0]
  # --- voice $00: bright lead synth (FM1, TL $0C = 3 steps / −2.25 dB below FM2) ---
  - [3, "fm_voice0.raw",     29, 0] # VGZ: -1.3 dB at 25
  # --- voice $00 FM5 variant: TL $0E (−3.75 dB); smpsAlterNote $03 rendered into the sample (core/plan/detune.py) ---
  - [4, "fm_voice0.raw",     25, 0] # VGZ: -1.5 dB at 21
  # --- voice $01: bass / sustain pad (FM2 $09; FM3/FM4 ending chord also at $09) ---
  - [5, "fm_voice1.raw",     32, 0]
  # --- voice $02: harmony chord stabs (FM3 $0D / FM4 $0C ≈ 3.5 steps / −2.6 dB below FM2) ---
  - [6, "fm_voice2.raw",     28, 0] # VGZ: -1.3 dB at 24
  # --- PSG white noise: the VGM reference puts the hiss ~10 dB below where 48 landed it ---
  - [7, "psg_noise.raw",      3, 0] # baked: 16 at PSG attenuation 4 (−8 dB); VGZ: +4.9 dB at 5
  # --- voice $01 FM3 ending variant: smpsAlterNote $03 rendered into the sample (+5 cents), so the
  #     FM2/FM3/FM4 unison chord beats instead of summing in phase ---
  - [8, "fm_voice1.raw",     32, 0]


# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare only
# -------------------------------------------------------------------------------------------------
dac_samples:
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # Voice $00 — bright lead synth (FM1 + FM5)
  0:
    - low:  G5
      high: A6
      mod_instrument: 3
      root: G2

  # Voice $01 — bass / sustain pad
  1:
    - low:  A2            # source 33 — FM2 low notes + FM4 ending bass
      high: D4            # source 35
      mod_instrument: 5   # fm_voice1_lo.raw (root A1)
      root: A1
      loop_drift_db: 6    # voice $01 decays the whole note (D2R): at 1 dB it holds the closing A1's
                          # decay to 0.9 s (12 KB); at 6 it loops 0.2 s in (3 KB), the closing
                          # chord's last 1.5 s held ~8 dB above the hardware, as before 2026-10-01.
                          # The FM4+FM3 closing chord (merged slot 15) takes it too: 14 -> 6.6 KB.
                          # Not on the FM4+FM3 group: at 9 dB there the $02 stab in slot $E looped
                          # half as long, a buzz; above 6 here the bass loops 42 ms in, its attack

  # Voice $02 — harmony chord stabs (FM3/FM4 main melody only)
  2:
    - low:  A5            # source 69 — bottom of FM4's range
      high: G6            # source 79 — top of FM3's range
      mod_instrument: 6   # fm_voice2.raw (root A2)
      root: A2            # A5→A2 (MOD 21);  G6→G3 (MOD 31)


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # form $E7 — white noise, LFSR clocked by PSG3's own tone register $C0 (rate 3)
    mod_instrument: 7
    root: A3               # target_rate ≈ 27928 Hz → 14 kHz bandwidth keeps most of the hiss
    
    
# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 shares FM1's data. smpsAlterNote $03 is a raw FNUM offset (+5..8 cents).
# Its own instrument is rendered at that offset (core/plan/detune.py).
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    0:
      - low:  G5
        high: A6
        mod_instrument: 4
        root: G2
  # FM3's closing nA2 carries smpsAlterNote $03 too — same trick, voice $01
  FM3:
    1:
      - low:  A2
        high: D4
        mod_instrument: 8
        root: A1

    
# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 15

# -------------------------------------------------------------------------------------------------
# Amiga build (convert.py --merged): 7 channels -> 4.  FM5 is FM1's detuned double, FM3 plays
# a third / fourth above FM4 on every note, and the PSG3 hi-hat lands on 24 of the 30 drum
# hits.  tools/merge_survey.py measured the pairs; the composites are rendered per interval.
# -------------------------------------------------------------------------------------------------
merge:
  - primary: FM1
    followers: [FM5]
  - primary: FM4
    followers: [FM3]
  - primary: DAC
    followers: [PSG3]
    # Kicks carry the short hat (fill 3, 50 ms), snares the long one (fill 12, 200 ms): two mixes.
    # The other three were one note each, 18 KB, differing only in where the hat is cut; they play
    # the same-shape mix instead, all under the closing chord: pattern 2 row 18 hat 200 ms for 233,
    # row 24 200 ms for 50, row 28 (the last kick) 50 for 250.  Raise the cap to keep one by ear.
    # merge_twins: always would give every kick the long hat.
    max_composites: 2
    limit_db: 4             # the kick / snare + hat peaks limited (0.8 dB), not each mix turned down
