# -------------------------------------------------------------------------------------------------
# TITLE SCREEN MUSIC Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Title Screen"
input_file: "sonic_1/music/Mus8A - Title Screen.asm"
output_file: "output/01_title_screen.mod"
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3
ticks_per_row: 3
num_mod_channels: 8


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  - source: FM1
    mod_channel: 1

  - source: FM2
    mod_channel: 2

  - source: FM3
    mod_channel: 3

  - source: FM4
    mod_channel: 4

  # Detuned version of FM1
  - source: FM5
    mod_channel: 5

  # White Noise Channel
  - source: PSG3
    mod_channel: 6


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if fm_synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
sample_list:
  # --- percussion ---
  - [1, "kick.raw",          64, 0]
  - [2, "snare.raw",         64, 0]
  # --- voice $00: bright lead synth (FM1 + FM5) ---
  - [3, "fm_voice0.raw",     32, 0]
  # --- voice $00 channel override: FM5 detuned variants (finetune +1 ≈ +12.5 cents) ---
  - [4, "fm_voice0.raw",     32, 1]
  # --- voice $01: bass / sustain pad (FM2 + FM3/FM4 ending) ---
  - [5, "fm_voice1.raw",     32, 0]
  # --- voice $02: harmony chord stabs (FM3/FM4 main melody) ---
  - [6, "fm_voice2.raw",     32, 0]
  # --- PSG White Noise ---
  - [7, "psg_noise.raw",     48, 0]


# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare only
# -------------------------------------------------------------------------------------------------
dac_samples:
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # Voice $00 — bright lead synth (FM1 + FM5)
  0:
    - low:  G5
      high: A6
      mod_instrument: 3
      root: G2
      synth_root: G5

  # Voice $01 — bass / sustain pad
  1:
    - low:  A2            # source 33 — FM2 low notes + FM4 ending bass
      high: D4            # source 35
      mod_instrument: 5   # fm_voice1_lo.raw (root A1)
      root: A1
      synth_root: A2

  # Voice $02 — harmony chord stabs (FM3/FM4 main melody only)
  2:
    - low:  A5            # source 69 — bottom of FM4's range
      high: G6            # source 79 — top of FM3's range
      mod_instrument: 6   # fm_voice2.raw (root A2)
      root: A2            # A5→A2 (MOD 21);  G6→G3 (MOD 31)
      synth_root: A5


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 7
    root: A3               # target_rate ≈ 27928 Hz; Nyquist 13964 Hz > LFSR 7049 Hz (no aliasing)
    noise_rate: 3
    synth_root: A8         # pitch_offset=$00; PSGFrequencies[nA5+0=69] ≈ 7049 Hz → N≈16; A8→N≈16 ✓
    envelope: fTone_04     # Quick stepped fade (10 frames)
    base_volume: 0         # SN76489 base attenuation (0=max)
    
    
# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 shares FM1's data. smpsAlterNote $03 is a raw FNUM offset (~12.5 cents).
# Approximate hardware effect by fine-tuning a version of the sample.
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    0:
      - low:  G5
        high: A6
        mod_instrument: 4
        root: G2
        synth_root: G5
    
    
# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 15