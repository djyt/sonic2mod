# Generated by analyze.py — fill in root/synth_root values
# Song: Mus82 - LZ.asm

name: Labyrinth Zone
input_file: sonic_1\music\Mus82 - LZ.asm
output_file: output/lab_zone.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 4
ticks_per_row: 1
num_mod_channels: 10
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7
  - source: PSG3
    mod_channel: 8

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 64, 0]
  - [2, "snare.raw", 64, 0]
  # --- voice $00: alg 1: (1,2)→3→4, fb 6 — FM1 ---
  - [3, "fm_v00.raw", 32, 0]
  # --- voice $01: alg 0: 1→2→3→4, fb 3 — FM2 ---
  - [4, "fm_v01.raw", 32, 0]
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM5 ---
  - [5, "fm_v02.raw", 32, 0]
  # --- voice $03: alg 5: 1→(2+3+4), fb 7 — FM3, FM4 ---
  - [6, "fm_v03.raw", 32, 0]
  # --- voice $04: alg 4: (1→2)+(3→4), fb 7 — FM5 ---
  - [7, "fm_v04.raw", 32, 0]
  # --- PSG noise (form $E7) ---
  - [9, "psg_noise.raw", 16, 0]
  # --- PSG tone fTone_09 ---
  - [8, "psg_fTone_09.raw", 16, 0]

dac_samples:
  # dKick: ×55 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  # dSnare: ×36 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3

voice_map:
  # $00 — alg 1: (1,2)→3→4, fb 6 — used by FM1
  0:
    - low:  E5
      high: F6
      mod_instrument: 3
      root: E2
      synth_root: E5
  # $01 — alg 0: 1→2→3→4, fb 3 — used by FM2
  1:
    - low:  C4
      high: E5
      mod_instrument: 4
      root: C2
      synth_root: C3
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM5
  2:
    - low:  F4
      high: C5
      mod_instrument: 5
      root: F2
      synth_root: F5
  # $03 — alg 5: 1→(2+3+4), fb 7 — used by FM3, FM4
  3:
    - low:  C6
      high: A6
      mod_instrument: 6
      root: C2
      synth_root: C6
  # $04 — alg 4: (1→2)+(3→4), fb 7 — used by FM5
  4:
    - low:  G4
      high: A5
      mod_instrument: 7
      root: G2
      synth_root: G5

psg_map:
  0xE7:                    # form $E7
    mod_instrument: 9
    root: A3
    noise_rate: 3
    synth_root: A8
    envelope: fTone_04
    base_volume: 0

psg_voice_map:
  fTone_09:
    low:  D6
    high: B6
    mod_instrument: 8
    root: D2
    synth_root: D6

# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 47