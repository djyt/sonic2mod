# -------------------------------------------------------------------------------------------------
# ROBOTNIK Conversion Script
# -------------------------------------------------------------------------------------------------
name: Robotnik
input_file: "input/sonic_1/Mus8C - Boss.asm"
output_file: output/sonic_1/09_robotnik.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 8            # 150 BPM: 4xy x=5 is 4.10 Hz (the driver 4.25); speed 12 (225 BPM) has 3.87 or 5.16
ticks_per_row: 3           # $03 = 1 row, a beat 4, a bar 16: four bars to a pattern.  The $04 triplets and
                           # the DAC's $01/$05 start between rows and take EDx
region: ntsc

# Variant lofi (convert.py --variant lofi --merged -> output/sonic_1/09_robotnik_lofi_merged.mod): the merged
# build 150 -> 59 KB.  Loops allowed to freeze 12 dB early (20 froze FM5's arpeggio 30 ms into its
# attack for 4.7 KB), the bass + counter-melody mixes at C2 (8.3 kHz).  The drums and the lead mix as
# the merged build has them (the lead at F2 saves 1.8 KB).  merge_max_synth_shift: 0 saves nothing
# once these are in (+0.3 KB) and puts the bass column 7 cents flat: every note takes the root's
# driver-table error.
variants:
  lofi:
    name: "Robotnik lofi"
    loop_drift_db: 12            # bass and arpeggio loop where they settle to within 12 dB (-34 KB)

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 64, 2]
  - [2, "timpani.raw", 64, -3]
  # --- voice $00: alg 0: 1→2→3→4, fb 1 — FM2 ---
  - [3, "fm_v00_lo.raw", 32, 0]
  - [4, "fm_v00_hi.raw", 32, 0]
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM3 ---
  - [5, "fm_v01.raw", 14, 0] # VGZ: -3.1 dB at 10
  # --- voice $02: alg 5: 1→(2+3+4), fb 7 — FM1, FM4 ---
  - [6, "fm_v02.raw", 19, 0] # VGZ: +1.0 dB at 22
  - [10, "fm_v02_fm4.raw", 13, 0] # VGZ: +0.2 dB at 13
  # --- voice $05: alg 2: (1+(2→3))→4, fb 7 — FM5 ---
  - [7, "fm_v05.raw", 21, 0] # VGZ: +3.7 dB at 32
  # --- PSG tone fTone_05 ---
  - [8, "psg_fTone_05.raw",  8, 0] # baked: 32 at PSG attenuation 3 (−6 dB); VGZ: -1.2 dB at 7

dac_samples:
  # dSnare: ×47 — ~22588 Hz on hardware (the cycle count less this song's 5.0 % per-frame stall) → F3 ft +2 (-7 c)
  - name: dSnare
    mod_instrument: 1
    mod_note: F3
  # dHiTimpani: ×8 — ~9150 Hz on hardware (the cycle count less this song's 5.0 % per-frame stall) → D2 ft -3 (-8 c)
  - name: dHiTimpani
    mod_instrument: 2
    mod_note: D2
  # dLowTimpani: ×8 — ~6779 Hz on hardware (the cycle count less this song's 5.0 % per-frame stall) → A1 ft -3 (+14 c)
  - name: dLowTimpani
    mod_instrument: 2
    mod_note: A1

voice_map:
  # $00 — alg 0: 1→2→3→4, fb 1 — used by FM2
  0:
    - low:  B3
      high: B4
      mod_instrument: 3
      root: B2
    - low:  C5
      high: Fs5
      mod_instrument: 4
      root: C2
  variants:
    lofi:
      # One sample for the whole bass, the range shifted down so F#5 lands on B3 (the MOD's top note): its
      # four C5-F#5 notes play the B3-B4 render faster, and every bass note plays at 10.5 kHz, not 15.7
      # (-3.0 KB, the bass + counter-melody mixes included).  Rooted at B2, the high notes clamp to B3
      0:
        - low:  B3
          high: Fs5
          mod_instrument: 3
          root: E2
  # $01 — alg 2: (1+(2→3))→4, fb 7 — used by FM3
  1:
    - low:  E5
      high: Fs6
      mod_instrument: 5
      root: E2
  # $02 — alg 5: 1→(2+3+4), fb 7 — used by FM1, FM4
  2:
    - low:  Fs6
      high: Fs7
      mod_instrument: 6
      root: Fs2
  # $05 — alg 2: (1+(2→3))→4, fb 7 — used by FM5
  5:
    - low:  E6
      high: Fs7
      mod_instrument: 7
      root: E2

# FM4 has its own instrument: on inst 6 (baked at FM1's centre level) its hard pan put a Cxx on
# every note, which took the slot the triplets' EDx needs, and two of them snapped to the rows
# (32 ms)
channel_instrument_map:
  FM4:
    2:
    - low:  Fs6
      high: Fs7
      mod_instrument: 10
      root: Fs2

psg_voice_map:
  fTone_05:
    low:  Fs6
    high: Fs7
    mod_instrument: 8
    root: Fs2

# -------------------------------------------------------------------------------------------------
# Structural pattern break after the opening bar
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 15

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version
# -------------------------------------------------------------------------------------------------
# DAC · lead (FM1+FM4+PSG1) · bass + counter-melody (FM2+FM3+PSG2) · arpeggio (FM5) → 4-channel M.K.
# The followers rest through the intro, so the folds apply song-wide.

merge_twins: always            # mixes that differ only in where a note is cut share one sample (12 → 9)

merge:
  # Lead: FM1 (detune +3) + FM4 + PSG1 in unison - clean, one composite.  PSG1 rides FM1's vibrato.
  - primary: FM1
    followers: [FM4, PSG1]
    loop_mix: true             # lead mix 50 KB unlooped → 12 KB

  # The bass carries the counter-melody: every FM3/PSG2 note starts on a bass note (0 lost), but its
  # 8 long notes (D6 $30, E5/A5 $12, the final F#6 $30) stop at the next bass note.
  - primary: FM2
    followers: [FM3, PSG2]
    loop_mix: true             # long bass + F#6 mix 52 KB → 28 KB
    variants:
      lofi:
        mix_note: C2           # mixes at 8.3 kHz instead of 17-25: 91 -> 32 KB, the counter-melody's treble
                               # above 4 kHz gone (A2 14 kHz: 30 KB more, F2 11 kHz: 11 more, A1: 3.7 less)
