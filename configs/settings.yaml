# -------------------------------------------------------------------------------------------------
# Sonic2MOD Global Settings
#
# - These settings apply globally, but some can be overriden on a per-song, or even per-sample
#   basis.
# -------------------------------------------------------------------------------------------------

fm_synthesis:
  enabled: true             # Set true to auto-generate FM samples via YM2612 emulation
  mode: ym2612              # Chip mode: "ym2612" (MD1/MD2 VA2) or "ym3438" (accurate)
  clock_rate: 7670454       # Mega Drive NTSC YM2612 master clock (Hz)
  sustain_duration: auto    # Seconds every note is held before key-off; or 'auto': each instrument
  release_padding: 0.5      # Seconds of audio captured after key-off (for release tail)
  detune_variants: true     # An smpsAlterNote / smpsDetune note plays its instrument rendered at that
                            # FNUM offset, in a free slot (core/plan/detune.py).  false: the instrument's
                            # own sample, at its pitch
  threads: normal           # FM instruments render in parallel, one per thread: 
                            # "normal" : CPU cores - 1
                            # "max"    : every core, 
                            # 1        : one at a time, or a number.  

psg_synthesis:
  enabled: true             # Set true to auto-generate PSG samples via SN76489 emulation
  clock_rate: 3579545       # SN76489 NTSC Mega Drive clock (Hz)
  sustain_duration: auto    # Seconds of tone held before key-off; or 'auto': per instrument, as FM
  release_padding: 0.2      # Seconds of silence/release after key-off
  oversample: 8             # Render tones at this multiple of the sample rate, then sample down.
                            # 1 : Core's Box Filter [Faster, Lower Quality]
                            # 4 : Half the PSG time
                            # 8 : Flat              [Slower, Higher Quality]

# -------------------------------------------------------------------------------------------------

amiga_clock: 3546895        # PAL Amiga (Paula) clock: a MOD note's rate is this / its period


# -------------------------------------------------------------------------------------------------
# Samples
# -------------------------------------------------------------------------------------------------

samples:
  max_sample_kb: 64         # Maximum Sample Length: 64 - Amiga ProTracker | 128 -  Modern Trackers

  # Zero a one-shot sample's first two bytes.  ProTracker replays them once the sample ends.
  # true  : silent after the sample ends
  # false : the first word repeats until the next note (a buzz or DC step)
  pt_zero_bytes: true

  # How each sample's 8-bit rounding error is spread.  A voice_map / psg_map / psg_voice_map entry
  # or a merge group may override it with its own `dither:`.
  #   shaped : noise pushed to the top of the band, under a bright sound's treble   [default]
  #   flat   : noise even across the band; less hiss on a mellow sound
  #   off    : plain rounding; least noise on a sound that stays loud, a quiet tail steps
  dither: shaped

  # Remove each synthesised render's DC offset (a 5 Hz high-pass), as the Mega Drive's AC-coupled
  # output does.  Lopsided FM waveforms otherwise sit off zero: a click on every note-on and cut,
  # and up to 1.5 dB of the sample's 8 bits.  Drums loaded from disk are left alone.
  dc_block: true

  # Attempt to automatically loop sustained samples when their envelope settles.
  # Will also end affected samples with a volume slide (A0y), rather than a C00.
  #   off      : never
  #   merged   : the --merged reduced channel version only
  #   all      : every build
  sustain_loops: all

  # Renumber the sample slots in use from 1 without gaps once the MOD is laid out (a merged build
  # leaves slots of instruments it no longer plays empty).  Sound and size are unchanged.
  #   off      : never
  #   merged   : the --merged reduced channel version only
  #   all      : every build (its slots no longer match the config's sample_list numbers)
  compact_slots: merged

  # What the MOD calls each sample (22 characters):
  #   source   : what plays it and what it was made from - "F1/3/4/5 $05 C4-B5", "F5+3+4+P1 D-3 [1-4]",
  #              "D dKick B-2" (a voice_map / psg entry's or a merge group's `name:` replaces it)
  #   file     : its sample_list file name
  names: source

  # dB change whereby the loop is created
  # 1     : Loop voices that truly settle                                [Higher file size]
  # 3-12  : Increasingly aggressive looping of slowly decaying voices    [Lower file size]
  loop_drift_db: 1

  # Treble shelf (core.audio.pcm.high_shelf): every synthesised render raised treble_shelf_db above
  # treble_shelf_hz (at the sample's own pitch), before loops, levels and quantisation.
  # 0 : Disable. Match Hardware.
  # 4 : +4db (Example)
  treble_shelf_db: 0
  treble_shelf_hz: 2500

  # Conversion time vs quality: filter width (samples of the lower rate) of every resample - FM
  # renders, PSG tones, mixes.  32: flat to 85 % of Nyquist, aliases 78 dB down.  16: 2/3 the time
  # (GHZ merged 5.6 -> 3.6 s), -0.6 dB at 85 %, aliases 73 dB down.  (PSG: psg_synthesis.oversample)
  resample_taps: 32

  # Keep every chip render on disk, under a hash of its inputs and of the emulator code
  # (core/render_cache.py): a later conversion that renders the same note reads it back.  Output
  # is identical either way.  A path (relative to the project), or off.
  render_cache: output/cache

  # Where a minimal config's (no channels:) FM and PSG tone windows sit in the MOD's range
  # (core/plan/derive.py).  A window's lowest note is placed on the first MOD note whose rate keeps
  # root_harmonics harmonics of it below Nyquist (never under 5 kHz, E1); a higher note costs bytes
  # in proportion to its rate.  A window narrows (to an octave at most) to reach that note.
  #   0     : every window at E1 - smallest samples; a high lead keeps 2-4 harmonics   [lofi]
  #   8     : high leads and PSG tones move up, bass voices stay at E1
  #   16    : mid voices move up too; few windows narrow
  # top_note: the highest MOD note a derived window reaches.  A3 - A#3 (period 120) and B3 (113) are
  # past Paula's period-124 DMA limit and sound bad on an Amiga; B3 for trackers only.
  root_harmonics: 8
  top_note: A3

  # The widest window a minimal config's voice is cut into, in semitones.  A sample played a
  # distance d from the pitch it was rendered at runs its attack, decay and carrier beating
  # 2^(d/12) times too fast or slow; a narrower window keeps notes nearer it, one more sample a cut.
  #   0     : no cap - windows as wide as the MOD's range and root_harmonics allow   [smallest]
  #   12    : no note more than an octave from its render pitch (2x at worst)
  #   9     : 1.7x at worst; Moonwalker costs about what 12 does (+8 %)                  [default]
  max_window: 9

# -------------------------------------------------------------------------------------------------
# Conversion flags (applied regardless of synthesis settings)
# -------------------------------------------------------------------------------------------------

# How FM channel levels (smpsHeaderFM volume, smpsAlterVol, smpsPan) reach the MOD:
#   baked  For each instrument, the level most of its notes play at needs no command: that is what
#          its sample_list volume stands for.  Notes at any other level get Cxx = volume x 10^(dB/20)
#          using the chip's 0.75 dB per TL step, so Cxx appears only on the minority channel of a
#          shared instrument and where smpsAlterVol moves a channel.  No extra samples.  (default)
#   true   Legacy: header TL + log law as an absolute volume, Cxx on every FM note.
#   false  Legacy: header TL ignored, one smpsAlterVol step = one linear volume unit (not accurate).
fm_volume_scaling: baked

# baked mode only: a hard-panned (smpsPan left/right) note is this many dB quieter than a centred one.
# A centred YM2612 channel drives both speakers, every Amiga channel drives one.  0 disables.
fm_pan_law_db: 3

# PSG counterpart of fm_volume_scaling (SN76489 attenuation: smpsHeaderPSG volume + smpsPSGAlterVol, 2 dB/step):
#   baked     For each PSG instrument the attenuation most of its notes play at needs no command and is
#             what its sample_list volume stands for; other notes get Cxx on the 2 dB/step law.  Frees
#             the effect column on most PSG notes for vibrato / note cut.  (default)
#   absolute  Legacy: volume = 64 x 10^(-2 x att / 20) x sample volume / 64, a Cxx on nearly every PSG note.
psg_volume_scaling: baked

# How a legato note (smpsNoAttack: the driver changes the frequency without a key-on) is written when its
# target cannot ride the sample that is sounding.  A MOD tone portamento (3FF) never re-triggers and, in FT2
# clone and ProTracker, never changes the playing sample either.
#   strict   A target in another range of the voice (another instrument, its sample rendered for another
#            octave) is written on the sounding instrument, its MOD note moved by the chip-pitch delta; after
#            an smpsSetvoice, or with nothing sounding on the channel yet, the note is re-triggered.
#   loose    Always a 3FF on the target's own instrument, as the conversion wrote it before 2026-09-28.  Right
#            only in a player that swaps the sample on an instrument number (OpenMPT); in FT2 clone Green Hill's
#            FM3 grace note came out an octave up, its loop label rode a decayed note, and Drowning's FM3 trill
#            (no-attack from its first note) never started.
#   retrigger  Every no-attack note is a plain note-on, as the conversion wrote it before commit 030ca81: a
#            grace note bending into a chord is heard as two attacks, but a legato onto a note that has been
#            sounding for seconds is not left riding the sample's decayed tail (Green Hill FM1, pattern 14 row 52:
#            the hardware plays that C at the level of a fresh note, a 3FF there is 26 dB down).  (default)
legato: retrigger

# The tracker the MOD is made for.  FT2 clone and ProTracker 2 scale a vibrato (4xy) depth differently:
# PT2 truncates the swing to whole periods, a period short of FT2's on every depth (y=1: 1 period against
# 1.75), so each build picks the depth nearest the hardware's swing in its own player.  convert.py --player
# overrides it.
#   ft2   FT2 clone (default)
#   pt2   ProTracker 2 / pt2-clone / an Amiga
player: ft2
