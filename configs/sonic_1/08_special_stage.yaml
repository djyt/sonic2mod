# -------------------------------------------------------------------------------------------------
# SPECIAL STAGE Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Special Stage"
input_file: "input/sonic_1/Mus89 - Special Stage.asm"
output_file: output/sonic_1/08_special_stage.mod
samples_dir: "input/sonic_1/samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc
target_speed: 6             # 196.875 → 197 BPM (+0.06 %); speed 3 gave 98.4375 → 98 (−0.44 %, +139 ms per pass)
ticks_per_row: 2

# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  - source: FM1
    mod_channel: 0

  - source: FM2
    mod_channel: 1

  - source: FM3
    mod_channel: 2

  - source: FM4
    mod_channel: 3

  - source: FM5
    mod_channel: 4

  - source: FM6
    mod_channel: 5

  - source: PSG1
    mod_channel: 6

  - source: PSG2
    mod_channel: 7


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if fm_synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
sample_list:
  - [1,  "ss_v0.raw",      32, 0] # -2 dB so ss_v2 (inst 3, at the 64 ceiling) sits right
  - [2,  "ss_v1.raw",      40, 0] # -2 dB so ss_v2 (inst 3, at the 64 ceiling) sits right
  - [3,  "ss_v2.raw",      41, 0] # VGZ: +3.9 dB at 64
  - [4,  "ss_v3.raw",      31, 0] # -2 dB so ss_v2 (inst 3, at the 64 ceiling) sits right; VGZ: -1.1 dB at 27
  - [5,  "psg_tone04.raw", 16, 0] # baked: 32 at PSG attenuation 3 (−6 dB); -2 dB so ss_v2 (inst 3, at the 64 ceiling) sits right; VGZ: +3.6 dB at 25
  - [6,  "psg_tone08.raw", 29, 0] # baked: 40 at PSG attenuation 1 (−2 dB); -2 dB so ss_v2 (inst 3, at the 64 ceiling) sits right; VGZ: -1.6 dB at 24


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  0:
    - low:  C5
      high: A5
      mod_instrument: 1
      root: C2
  1:
    - low: C7
      high: B7
      mod_instrument: 2
      root: C3
  2:
    - low: A4
      high: B5
      mod_instrument: 3
      root: A1
  3:
    - low: D6
      high: E7
      mod_instrument: 4
      root: D2
      
# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_voice_map:
  fTone_04:
    low:  F5
    high: C7
    mod_instrument: 5
    root: F1
    
  fTone_08:
    low:  C5
    high: C5
    mod_instrument: 6
    root: C3
