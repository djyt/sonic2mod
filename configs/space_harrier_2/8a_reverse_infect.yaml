# Space Harrier II - Reverse Infect.  A minimal config: everything else is derived from the ROM
# (docs/todo/space_harrier_2.md); python convert.py <this> --show-config prints it.
name: "Reverse Infect"
input_file: "input/roms/Space Harrier II (World).md"
rom_song: "$8A"

sample_list:   # volumes set from the VGZ; the rest is derived
  - [2, "drum85.raw", 32, 0]   # VGZ: +6.1 dB at 64
  - [3, "drum89.raw", 41, 0]   # VGZ: +3.9 dB at 64
  - [5, "fm_v0c_Fs1.raw", 9, 0]   # VGZ: -5.0 dB at 5
  - [6, "fm_v0c_Fs2.raw", 9, 0]   # VGZ: -5.0 dB at 5
  - [7, "fm_v43_Ab2.raw", 7, 0]   # VGZ: +1.0 dB at 8
  - [8, "fm_v43_Fs3.raw", 7, 0]   # VGZ: +0.6 dB at 8
  - [9, "fm_v43_E4.raw", 12, 0]   # VGZ: +1.5 dB at 14
