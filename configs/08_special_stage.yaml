# -------------------------------------------------------------------------------------------------
# SPECIAL STAGE Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Special Stage"
input_file: "input/Mus89 - Special Stage.asm"
output_file: output/08_special_stage.mod
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc
target_speed: 3
ticks_per_row: 2
num_mod_channels: 8

# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  - source: FM1
    mod_channel: 0

  - source: FM2
    mod_channel: 1

  - source: FM3
    mod_channel: 2

  - source: FM4
    mod_channel: 3

  - source: FM5
    mod_channel: 4

  - source: FM6
    mod_channel: 5

  - source: PSG1
    mod_channel: 6

  - source: PSG2
    mod_channel: 7


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if fm_synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
sample_list:
  - [1,  "ss_v0.raw",      40, 0] # VGZ: +4.2 dB at 64
  - [2,  "ss_v1.raw",      64, 0]
  - [3,  "ss_v2.raw",      64, 0]
  - [4,  "ss_v3.raw",      47, 0] # VGZ: +2.6 dB at 64
  - [5,  "psg_tone04.raw", 24, 0] # baked: 32 at PSG attenuation 3 (−6 dB); VGZ: -3.6 dB at 16
  - [6,  "psg_tone08.raw", 32, 0] # baked: 40 at PSG attenuation 1 (−2 dB)


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  0:
    - low:  C5
      high: A5
      mod_instrument: 1
      root: C2
      synth_root: C2
  1:
    - low: C7
      high: B7
      mod_instrument: 2
      root: C3
      synth_root: C5
  2:
    - low: A4
      high: B5
      mod_instrument: 3
      root: A1
      synth_root: A1
  3:
    - low: D6
      high: E7
      mod_instrument: 4
      root: D2
      synth_root: D4
      vibrato: 12               # Override Vibrato with more subtle setting
      
# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_voice_map:
  fTone_04:
    low:  F5
    high: C7
    mod_instrument: 5
    root: F1
    synth_root: F5
    
  fTone_08:
    low:  C5
    high: C5
    mod_instrument: 6
    root: C3
    synth_root: A7   # pitch audit: was C8, 3 semitones too high
