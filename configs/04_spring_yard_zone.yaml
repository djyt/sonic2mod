# -------------------------------------------------------------------------------------------------
# SPRING YARD ZONE Conversion Script
# -------------------------------------------------------------------------------------------------
name: Spring Yard Zone
input_file: "input/Mus85 - SYZ.asm"
output_file: output/04_spring_yard_zone.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 1
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG3
    mod_channel: 7

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 64, 0]
  - [2, "snare.raw", 64, 0]
  # --- voice $00: alg 4: (1→2)+(3→4), fb 7 — FM1 ---
  - [3, "fm_v00.raw", 23, 0] # VGZ: +3.3 dB at 34
  # --- voice $01: alg 0: 1→2→3→4, fb 3 — FM2 ---
  - [4, "fm_v01.raw", 25, 0] # VGZ: -1.0 dB at 22
  # --- voice $02: alg 5: 1→(2+3+4), fb 7 — FM4, FM5 ---
  - [5, "fm_v02.raw",  8, 0] # VGZ: -0.9 dB at 7
  - [6, "fm_v02.raw",  8, 0] # VGZ: -0.9 dB at 7
  # --- voice $03: alg 4: (1→2)+(3→4), fb 5 — FM4, FM5 ---
  - [7, "fm_v03.raw", 14, 0] # VGZ: -1.4 dB at 12
  # --- voice $04: alg 4: (1→2)+(3→4), fb 0 — FM1 ---
  - [8, "fm_v04.raw", 19, 0] # VGZ: -1.9 dB at 15
  # --- voice $05: alg 2: (1+(2→3))→4, fb 7 — FM3 ---
  - [9, "fm_v05.raw", 12, 0] # VGZ: +8.2 dB at 32
  # --- PSG noise (form $E7) ---
  - [12, "psg_noise.raw",  2, 0] # baked: 16 at PSG attenuation 5 (−10 dB); VGZ: +7.1 dB at 4
  # --- PSG tone fTone_06 ---
  - [10, "psg_fTone_06_lo.raw",  5, 0] # baked: 32 at PSG attenuation 6 (−12 dB); 5 -> 4: rendered for its own rings (2026-09-30) it peaks 2 dB lower; VGZ: -1.6 dB at 4
  - [11, "psg_fTone_06_hi.raw",  5, 0] # baked: 32 at PSG attenuation 6 (−12 dB); VGZ: -1.3 dB at 4

dac_samples:
  # dKick: ×59 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  # dSnare: ×53 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3

voice_map:
  # $00 — alg 4: (1→2)+(3→4), fb 7 — used by FM1
  0:
    - low:  A5
      high: A6
      mod_instrument: 3
      root: A2
  # $01 — alg 0: 1→2→3→4, fb 3 — used by FM2
  1:
    - low:  D4
      high: E5
      mod_instrument: 4
      root: D2
  # $02 — alg 5: 1→(2+3+4), fb 7 — used by FM4, FM5
  2:
    - low:  A5
      high: D7
      mod_instrument: 5
      root: A1
  # $03 — alg 4: (1→2)+(3→4), fb 5 — used by FM4, FM5
  3:
    - low:  A3
      high: D4
      mod_instrument: 7
      root: A2
  # $04 — alg 4: (1→2)+(3→4), fb 0 — used by FM1
  4:
    - low:  A5
      high: A6
      mod_instrument: 8
      root: A2
  # $05 — alg 2: (1+(2→3))→4, fb 7 — used by FM3
  5:
    - low:  C5
      high: A6
      mod_instrument: 9
      root: C2

psg_map:
  0xE7:                    # form $E7
    mod_instrument: 12
    root: A3

psg_voice_map:
  fTone_06:
    - low:  A3
      high: B4
      mod_instrument: 10
      root: A2
    - low:  C5
      high: D7
      mod_instrument: 11
      root: C1


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 shares FM4's data, but tuned with smpsAlterNote $02
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    2:
    - low:  A5
      high: D7
      mod_instrument: 6
      root: A1


# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 45