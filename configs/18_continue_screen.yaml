# Generated by analyze.py — fill in root/synth_root values
# Song: Mus90 - Continue Screen.asm

# todo: alter pitch

name: Continue Screen
input_file: "input/Mus90 - Continue Screen.asm"
output_file: output/18_continue_screen.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 2
num_mod_channels: 8
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 64, 0]
  - [2, "snare.raw", 64, 0]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 7 — FM1 ---
  - [3, "fm_v00.raw", 32, 0]
  # --- voice $01: alg 3: ((1→2)+3)→4, fb 7 — FM2 ---
  - [4, "fm_v01.raw", 32, 0]
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [5, "fm_v02.raw", 32, 0]
  # --- voice $03: alg 4: (1→2)+(3→4), fb 3 — FM3, FM4 ---
  - [6, "fm_v03.raw", 32, 0]

dac_samples:
  # dKick: ×16 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  # dSnare: ×15 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3

voice_map:
  # $00 — alg 2: (1+(2→3))→4, fb 7 — used by FM1
  0:
    - low:  As5
      high: F6
      mod_instrument: 3
      root: As2  # smpsChangeTransposition active — verify root is correct
      synth_root: Gs3
  # $01 — alg 3: ((1→2)+3)→4, fb 7 — used by FM2
  1:
    - low:  G5
      high: A5
      mod_instrument: 4
      root: G2  # smpsChangeTransposition active — verify root is correct
      synth_root: G2
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM2
  2:
    - low:  E4
      high: Fs5
      mod_instrument: 5
      root: E2  # smpsChangeTransposition active — verify root is correct
      synth_root: E2
  # $03 — alg 4: (1→2)+(3→4), fb 3 — used by FM3, FM4
  3:
    - low:  A5
      high: G6
      mod_instrument: 6
      root: A2
      synth_root: A4

# -------------------------------------------------------------------------------------------------
# Structural pattern breaks to align to grid
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 23