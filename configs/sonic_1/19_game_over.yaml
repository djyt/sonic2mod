# Generated by analyze.py — fill in root values (synth_root is derived from the song)
# Song: Mus8F - Game Over.asm

name: Game Over
input_file: "input/sonic_1/Mus8F - Game Over.asm"
output_file: output/sonic_1/19_game_over.mod
samples_dir: "input/sonic_1/samples/"

auto_bpm: true
target_speed: 9            # 213 BPM as before: a duration unit is 3 MOD ticks, so FM2's one-unit strum and the
                           # $04 triplets take exact EDx delays.  4xy x=4 is 4.73 Hz (the driver 5.0; speed 3 had 5.33)
ticks_per_row: 3           # a beat ($0C) 4 rows, a bar 16: the 7 bars in 2 patterns (was 6)
region: ntsc

# Variant lofi (convert.py --variant lofi --merged -> output/sonic_1/19_game_over_lofi_merged.mod): the merged
# build 85 -> 41 KB.  The lead loops where it settles and the bass where its level starts to fall
# (both played their 0.9 s / 2.7 s renders before looping at the very end), the fall written into
# its notes as volume slides (loop_decay: slide); the bass at root A1 (chosen by ear over C2, 3.7 KB
# more).  The chords are chip composites: mix_note does nothing to them, and looped they grow
# (+5 KB).  Left out: the bass frozen at loop_drift_db 12 (its 60 ms loop pulses under 3.4 s notes,
# 112 onsets against 69).
variants:
  lofi:
    name: "Game Over lofi"

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 64, 1]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 7 — FM1 ---
  - [2, "fm_v00.raw", 28, 0] # VGZ: +1.2 dB at 32
  # --- voice $01: alg 4: (1→2)+(3→4), fb 7 — FM2, FM3 ---
  - [3, "fm_v01.raw", 30, 0] # VGZ: -0.9 dB at 27 (FM2 -1.3, FM3 -0.8)
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM4 ---
  - [4, "fm_v02.raw", 20, 0] # VGZ: +1.2 dB at 23
  # --- voice $03: alg 7: 1+2+3+4, fb 3 — FM5 ---
  - [5, "fm_v03.raw", 10, 0] # VGZ: +2.0 dB at 12

dac_samples:
  # dKick: ×4 — ~7872 Hz on hardware (the cycle count less this song's 4.0 % per-frame stall) → B1 ft +1 (+3 c)
  - name: dKick
    mod_instrument: 1
    mod_note: B1

voice_map:
  # $00 — alg 2: (1+(2→3))→4, fb 7 — used by FM1
  0:
    - low:  G5
      high: D6
      mod_instrument: 2
      root: G2
      variants:
        lofi:
          loop_drift_db: 4   # a 0.45 s loop from 1336 instead of 0.9 s unlooped (15.7 -> 6.9 KB): past the
          loop_min_ms: 300   # attack's swell, 0.7 dB of level change inside the loop.  At 6 and 12 it started at
                             # 520, before the peak, and replayed the swell every 0.45 s (2.7 dB); without the
                             # 300 ms minimum it looped 87 ms from 37 ms under 3 s notes
  # $01 — alg 4: (1→2)+(3→4), fb 7 — used by FM2, FM3
  1:
    - low:  A6
      high: G7
      mod_instrument: 3
      root: A2
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM4
  2:
    - low:  E3
      high: D4
      mod_instrument: 4
      root: E2
      variants:
        lofi:
          root: A1           # 7 kHz at its low note instead of 10.5 (2.3 dB of its treble)
          loop_decay: slide  # it falls 5 dB/s for as long as a note holds: looped 0.14 s in, the fall in
          loop_drift_db: 3   # EB1 rows (38 -> 1.8 KB; frozen at drift 6 it looped 2.0 s in, 14.8 KB).  At
                             # 3 dB off the line the fall starts 0.09 s in (2: 0.26 s, 4.2 KB; 1: 0.86 s)
  # $03 — alg 7: 1+2+3+4, fb 3 — used by FM5
  3:
    - low:  D7
      high: G7
      mod_instrument: 5
      root: D2

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version (convert.py --merged)
# DAC · lead (FM1) · chords (FM3+FM2+FM5) · bass (FM4).  FM2 strums each chord one unit (35 ms)
# after FM3: merge_tolerance 2 (ticks) folds it, at FM3's onset - the strum is the price.  The
# other way to 4 channels, DAC+FM4 with FM2 kept, cuts two bass notes by 320 ms at the kicks
# -------------------------------------------------------------------------------------------------
merge_tolerance: 2
merge_twins: always

merge:
  - primary: FM3
    followers: [FM2, FM5]
