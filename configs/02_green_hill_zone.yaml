# -------------------------------------------------------------------------------------------------
# GREEN HILL ZONE Conversion Script
#
# Variant lofi (convert.py --variant lofi --merged -> output/02_green_hill_zone_lofi_merged.mod): the
# 4-channel merged build squeezed to ~185 KB (184 KB): mixes made at the primary's note so looped
# leads, bass and chords keep their loops (mix_at: primary), drum banks at A2 (they sound 61 % of the
# song: 9 KB buys the hat treble to 7 kHz), chime mixes at F2, loops allowed to freeze 20 dB early,
# samples rendered at their root pitch, one mix per chord shape (merge_twins), and the composites that
# play one note each left out (max_composites: ten chime notes of the song play without their chime),
# two loops made generous by ear ($9, $16), the two long chord mixes looped where they settle
# (loop_mix: 20 KB), spent on $A, the lead fills, 7 semitones up.  Each change sits in a
# `variants: lofi:` block beside the keys it replaces.
# Where the bytes go: python tools/mod_audit.py output/02_green_hill_zone_lofi_merged.mod --banks
# -------------------------------------------------------------------------------------------------
name: "Green Hill Zone"
input_file: "input/Mus81 - GHZ.asm"
output_file: "output/02_green_hill_zone.mod"
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3             # speed byte = $03 (smpsHeaderTempo $01, $03)
ticks_per_row: 2            # GCD of main note durations ($04,$08,$0C,$10,$18...) = 4


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  # FM1: intro call + main loop
  - source: FM1
    mod_channel: 1

  # FM2: bass channel only
  - source: FM2
    mod_channel: 2

  # FM3: countermelody + harmony
  - source: FM3
    mod_channel: 3

  # FM4: tremolo pad + melody
  - source: FM4
    mod_channel: 4

  # FM5: detuned double of FM4 (smpsAlterNote $02 ≈ +10 cents FNUM offset).
  # Its detuned notes play a variant rendered at the offset (core/plan/detune.py).
  - source: FM5
    mod_channel: 5

  # PSG channels — melodic in GHZ; enabled for audio output.
  - source: PSG1
    mod_channel: 6

  - source: PSG2
    mod_channel: 7

  # PSG3: noise channel — smpsPSGform $E7, plays nMaxPSG rhythm.
  - source: PSG3
    mod_channel: 8


# -------------------------------------------------------------------------------------------------
# Auto-generated Samples
# Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
#
# Volumes marked "VGZ" were set from tools/vgm_compare.py level measurements (L/R power) against
# reference/vgz/02 - Green Hill Zone.vgz, relative to FM2 = inst 3/4 at 32; see docs/audits/02_ghz_audit.md.
# With fm_volume_scaling: baked a volume here is the level of the instrument's MOST COMMON
# (channel TL, pan) combination; the converter adds Cxx only for notes at any other level.
sample_list:
  # --- percussion ---
  - [1,  "kick.raw",        64, -2]
  - [2,  "snare.raw",       64, 1]
  # --- voice $00: deep bass (FM2 opening) ---
  - [3,  "ghz_v00.raw",     24, 0] # VGZ: +2.4 dB at 32
  # --- voice $01: bass/rhythm pad (FM2 main loop) ---
  - [4,  "ghz_v01.raw",     24, 0] # VGZ: +2.4 dB at 32
  # --- voice $02: bright lead (FM1 intro, FM3 opening) ---
  - [5,  "ghz_v02.raw",     22, 0] # VGZ: +1.3 dB at 26
  # --- voice $04: bell arp (FM4/FM5 ending section) ---
  - [6,  "ghz_v04.raw",      10, 0] # VGZ: +2.1 dB at 13
  - [7,  "ghz_v04.raw",     16, 0] # FM5's; its 16 smpsAlterNote $02 notes get a detune variant; VGZ: +1.8 dB at 20
  # --- voice $05: main melody (FM1/FM3/FM4/FM5) ---
  - [8,  "ghz_v05.raw",     24, 0] # VGZ: +1.7 dB at 29
  - [9,  "ghz_v05_lo.raw",    8, 0] # VGZ: +1.7 dB at 10
  # --- voice $06: FM1 melodic fills (smpsAlterPitch sections) ---
  - [10, "ghz_v06.raw",     47, 0] # VGZ: +1.3 dB at 54
  # --- voice $07: bridge voice (FM1/FM3/FM4) ---
  - [11, "ghz_v07.raw",     19, 0] # VGZ: +2.2 dB at 24
  # --- voice $08: bright synth (FM3/FM4/FM5 main) ---
  - [12, "ghz_v08.raw",     17, 0] # VGZ: +1.9 dB at 21
  - [13, "ghz_v08_hi.raw",  25, 0] # VGZ: +2.1 dB at 32
  # --- PSG White Noise ---
  - [14, "psg_noise.raw",    3, 0] # VGZ: +2.5 dB at 4
  # --- PSG Voices ---
  - [15, "psg_tone01.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)
  - [16, "psg_tone05.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)
  - [17, "psg_tone06.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)

variants:
  lofi:
    name: "Green Hill Zone lofi"
    merge_twins: always             # one mix per chord shape, even with slots to spare (the lead chord's twins: 7 KB)
    loop_drift_db: 20               # loops may freeze 20 dB above the settled level: shorter samples
    merge_max_synth_shift: 0        # render every sample at its root pitch: half the bytes of an octave up
    merge_loop_timbre: true         # loops wait for the timbre to hold, as the reference build's do (+124 B)
    sample_list:                    # measured on the lofi renders (instruments 3, 10, 11 differ)
      - [1,  "kick.raw",        64, -2]
      - [2,  "snare.raw",       64, 1]
      - [3,  "ghz_v00.raw",     21, 0] # VGZ: +3.5 dB at 32
      - [4,  "ghz_v01.raw",     24, 0] # VGZ: +2.6 dB at 32
      - [5,  "ghz_v02.raw",     22, 0] # VGZ: +1.3 dB at 26
      - [6,  "ghz_v04.raw",     10, 0] # VGZ: +2.4 dB at 13
      - [7,  "ghz_v04.raw",     16, 0] # VGZ: +1.8 dB at 20
      - [8,  "ghz_v05.raw",     24, 0] # VGZ: +1.7 dB at 29
      - [9,  "ghz_v05_lo.raw",   8, 0] # VGZ: +1.7 dB at 10
      - [10, "ghz_v06.raw",     46, 0] # VGZ: +1.4 dB at 54
      - [11, "ghz_v07.raw",     18, 0] # VGZ: +2.7 dB at 24
      - [12, "ghz_v08.raw",     17, 0] # VGZ: +1.8 dB at 21
      - [13, "ghz_v08_hi.raw",  25, 0] # VGZ: +2.1 dB at 32
      - [14, "psg_noise.raw",    3, 0] # VGZ: +2.5 dB at 4
      - [15, "psg_tone01.raw",  13, 0]
      - [16, "psg_tone05.raw",  13, 0]
      - [17, "psg_tone06.raw",  13, 0]

# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare for GHZ only
#
# For the merged 4-channel build, we soft-clip the drums at +2dB to give them more punch in the mix
# -------------------------------------------------------------------------------------------------
dac_samples:

  # dKick: ~7715 Hz on hardware (the cycle count less this song's 5.9 % per-frame stall) → B1 ft -2 (+1 c)
  - name: dKick
    mod_instrument: 1
    mod_note: B1
    merge_saturate_db: 2    # Merged build only: soft-clipped, body +2 dB at the same peak
    
  # dSnare: ~22375 Hz on hardware (the cycle count less this song's 5.9 % per-frame stall) → F3 ft +1 (-4 c)
  - name: dSnare
    mod_instrument: 2
    mod_note: F3
    merge_saturate_db: 2


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # $00 → deep bass
  0:
    - low:  C2
      high: B4
      mod_instrument: 3
      root: C2

  # $01 → bass/rhythm pad
  1:
    - low:  C2
      high: B4
      mod_instrument: 4
      root: C2

  # $02 → bright lead
  2:
    - low:  C6
      high: B7
      mod_instrument: 5
      root: C2

  # $04 → bell arp
  4:
    - low:  C6
      high: E7
      mod_instrument: 6
      root: C2

  # $05 → main melody
  5:
    - low:  C4
      high: B5
      mod_instrument: 9
      root: C2
      variants:
        lofi:
          loop_drift_db: 1  # at 12 dB it looped 27 ms from 13 ms in, a buzz on every note; at 1 dB the
                            # loop sits past what its notes reach (0.73 s): they play as rendered (+6.7 KB)
    - low:  C6
      high: B7
      mod_instrument: 8
      root: C2

  # $06 → FM1 fills
  6:
    - low:  C6
      high: B7
      mod_instrument: 10
      root: C2
      dither: off           # Dither added noise/hiss
      variants:
        lofi:
          loop_min_ms: 300  # The automatic loop is too aggressive and tight
          #loop_drift_db: 16    # Uncommenting results in a much better loop, but also +11K

  # $07 → bridge
  7:
    - low:  C5
      high: B5
      mod_instrument: 11
      root: C2
  # $08 → bright synth
  8:
    - low:  C5
      high: B5
      mod_instrument: 12
      root: C2
    - low:  C6
      high: B6
      mod_instrument: 13
      root: C2


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 14
    root: A3               # target_rate ≈ 27928 Hz

psg_voice_map:
  fTone_01:
    mod_instrument: 15
    root: A2
  fTone_05:
    mod_instrument: 16
    root: A2
  fTone_06:
    mod_instrument: 17
    low: A6
    root: A2


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 applies smpsAlterNote $02 (FNUM offset ≈ +10 cents) during voice $04
# bell-arp sections to create the chorus detune effect vs FM4.  The same
# source notes route to inst 7; the detuned ones play its detune variant.
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    4:                        # voice $04 on FM5 (bell arp, detuned)
      - low:  C6              # bottom of FM5 arp range
        high: B7              # top
        root: C2
        mod_instrument: 7    # same audio as inst 6


# -------------------------------------------------------------------------------------------------
# Structural pattern break: GHZ intro fills rows 0-31 of pattern 0; the loop begins at row 32.
# A Bxx at row 31 jumps cleanly to pattern 1 instead of playing 32 rows of silence.
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 31

# -------------------------------------------------------------------------------------------------
# Merge Channels
# 
# DAC = DAC Drums, FM1 = Lead, FM2 = Bass, PSG3 = Hi-Hat
# -------------------------------------------------------------------------------------------------

merge_patterns:

    # --- Pattern $00 ------------------------------------------------------------------------------
  - patterns: "0"
    drop: [FM4, FM5, PSG1, PSG2]
    groups:
        # Channel 0: Combine Drums
      - primary: DAC
        followers: [PSG3]
        cut_primary: true    # Allow a secondary channel to take priority over the primary
        bank: true           # Group multiple sounds in a single sample
        mix_note: C3         # Mixed Render Target
        variants:
          lofi: {mix_note: A2}   # drum mixes at 14 kHz: the hat keeps up to 7 kHz (F2: 5.5, C2 lost it altogether)
        limit_db: 4          # Peaks past full scale limited, not the sound turned down
        treble_shelf_db: 2
        
        
   # --- Pattern $01-$04 ---------------------------------------------------------------------------
  - patterns: "1-4"
    groups:
        # Channel 0: Combine Drums & Bass
      - primary: DAC
        followers: [FM2, PSG3]
        cut_primary: true
        bank: true
        mix_note: C3
        limit_db: 4
        variants:
          lofi: {mix_note: A2}
        treble_shelf_db: 2
        
        # Channel 1: Combine 4 Lead Channels
      - primary: FM5
        followers: [FM3, FM4, PSG1]
        mix_at: primary      # the chord keeps its loop; the chime is resampled down into it
        treble_shelf_db: 4
        mod_channel: 1
        variants:
          lofi:
            fm_on_chip: false    # the chip-rendered chord settles too late to loop: 5 KB -> 24 KB
            loop_mix: true       # its 3.35 s chords loop where the mix settles
            loop_drift_db: 1     # past the attack: at the song's 12 dB it looped 40-50 ms from 20 ms in
            loop_min_ms: 300
            limit_db: 1          # its two chords summed 0.2 / 0.6 dB past full scale
        
        # Channel 2: Move Arps
      - primary: PSG2
        mod_channel: 2
        
         # Channel 3: Move FM1 Fade Out to less important channel
      - primary: FM1
        mod_channel: 3
        
        
    # --- Pattern $05-$0C ---------------------------------------------------------------------------     
  - patterns: "5-c"
    groups:
        # Channel 0: Combine Drums & Bass
      - primary: DAC
        followers: [FM2, PSG3]
        cut_primary: true
        bank: true
        mix_note: C3
        limit_db: 4
        variants:
          lofi: {mix_note: A2}
        treble_shelf_db: 2
        
        # Channel 1: Remains as-is (Lead)
        
        # Channel 2: Sub-Melody (Combined)
      - primary: FM4
        followers: [FM5]
        mod_channel: 2
        
        # Channel 3: PSG Bleeps and Response Melody
      - primary: PSG1
        followers: [PSG2, FM3]
        cut_primary: true
        mod_channel: 3
        variants:
          lofi: {mix_note: F2}   # chime mixes at 11 kHz instead of 21
        
        
    # --- Pattern $0D-$0F ---------------------------------------------------------------------------      
  - patterns: "d-10"
    groups:
        # Channel 0: Combine Drums
      - primary: DAC
        followers: [PSG3]
        cut_primary: true
        bank: true
        mix_note: C3
        limit_db: 4
        variants:
          lofi: {mix_note: A2}
        treble_shelf_db: 2
        
        # Channel 1: Lead + PSG2
      - primary: FM1
        followers: [PSG2]
        mod_channel: 1
        variants:
          lofi:
            mix_at: primary      # the lead keeps its loop under the chime
            loop_mix: true       # its 2.8 s notes loop where lead + chime settle
            loop_drift_db: 1     # past the attack: at the song's 12 dB it looped 40-50 ms from 20 ms in
            loop_min_ms: 300
            max_composites: 1    # the other two lead+chime mixes are one note each (0.6 % of the song, 9 KB)
        
        # Channel 2: Bass + PSG1
      - primary: FM2
        followers: [PSG1]
        mod_channel: 2
        bank: true
        variants:
          lofi:
            mix_note: F2         # bass+chime mixes at 11 kHz (the bass notes here are short)
            max_composites: 2    # the 18 notes of the two common chords; five more are one note each (23 KB)

        # Channel 3: Chords
      - primary: FM3
        followers: [FM4]
        mod_channel: 3
        cut_after: 8            # Allow filled notes (FM5 below) to cut FM3 after 8 ticks
        variants:
          lofi:
            loop_min_ms: 400    # the chords' 0.9 s release rings through the loop: 87 ms froze into a buzz (+2.4 KB)
        
        # Channel 4: Arp 
      - primary: FM5
        fill: true              # Sprinkle these notes elsewhere, if they fit.
