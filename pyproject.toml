[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic2mod"
version = "0.2.0"
description = "Sonic 1 SMPS music to Amiga MOD converter"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
dev = ["ruff", "pyright", "vulture", "pytest", "coverage", "import-linter"]

[project.scripts]
sonic2mod = "convert:main"
sonic2mod-analyze = "analyze:main"
sonic2wav = "sonic2wav:main"

[tool.setuptools]
py-modules = ["convert", "analyze", "sonic2wav"]

# Found, not listed: a new driver folder (core/drivers/<family>/<driver>/) joins by itself
[tool.setuptools.packages.find]
include = ["core", "core.*", "sfx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Each rule code with what it means in plain English.  `ruff rule <CODE>` prints the full text.
select = [
    "E",       # Layout errors PEP 8 lists: bad indentation, missing or extra whitespace, `== None`
    "W",       # Layout warnings PEP 8 lists: trailing whitespace, blank lines holding spaces
    "F",       # Real mistakes: an unused import or variable, a name never defined, a duplicate key
    "I",       # Imports sorted and grouped: standard library, third party, then this project
    "UP",      # Old syntax that the target Python writes shorter (`list[int]`, not `List[int]`)
    "B",       # Likely bugs: a mutable default argument, a loop variable captured late, `except:`
    "SIM",     # Code that says the same in fewer steps (nested ifs merged, `return cond`)
    "PERF",    # Slow patterns: a loop that builds a list a comprehension would, `try` inside a loop
    "PLW",     # Pylint's warnings: a loop variable overwritten in its body, a global never assigned
    "RUF",     # Ruff's own checks: mutable class defaults, a `noqa` that suppresses nothing
    "ARG001",  # A function parameter its body never reads (one a caller's signature fixes: `_name`)
    "ARG002",  # A method parameter its body never reads (one an interface fixes: `_name`)
    "ERA001",  # A comment that parses as code: dead code to delete (word a formula as prose)
]
# Each ignored code: what it would flag, then why it stays off
ignore = [
    "E501",    # A line over the length limit: wide lines are deliberate (Rich markup, byte tables)
    "E701",    # Two statements on one line after a colon (`if x: y`): compact channel set-up
    "E702",    # Two statements on one line with a semicolon: compact channel set-up
    "E402",    # An import below other code: sys.path is set up before the imports it enables
    "E741",    # A variable named l, O or I (mistakable for 1 and 0): loop indices in SMPS parsing
    "PLR2004", # A bare number in a comparison: driver bytes ($81, $E0) read as their own names
    "C901",    # A function with too many paths through it: the conversion engine is inherently so
    "PLR0912", # A function with too many branches: as above
    "PLR0915", # A function with too many statements: as above
    "PLR0913", # A function with too many parameters: as above
    "FBT001",  # A bool positional parameter (`f(True)` unreadable at the call): existing API
    "FBT002",  # A bool positional parameter with a default: as above
    "PLC0415", # An import inside a function: conditional sys.path inserts in subpackages
    "N806",    # An UPPER_CASE variable inside a function: SETTINGS_FILE, SMPS_ constants read so
    # os.path calls that pathlib could make (abspath, chmod, makedirs, exists, isabs, isdir,
    # isfile, basename, dirname, join, samefile, splitext, open): os.path is kept throughout
    "PTH100", "PTH102", "PTH103", "PTH107", "PTH110", "PTH111",
    "PTH112", "PTH113", "PTH116", "PTH117", "PTH118", "PTH119",
    "PTH120", "PTH122", "PTH123",
    "SLF001",  # Another object's _private member read: sfx/ and tools/ reuse a few private helpers
    "TC001",   # An import used only in type hints, not moved under TYPE_CHECKING: not restructured
    "TC002",   # As above, for a third-party import
    "TC003",   # As above, for a standard-library import
    "INP001",  # A .py file in a folder with no __init__.py: tools/ scripts are no package
    "RUF001",  # A character that looks like another (♯, ×) in a string: musical symbols are meant
    "RUF002",  # As above, in a docstring
    "RUF003",  # As above, in a comment
    "COM812",  # A multi-line call or literal without a trailing comma: a style choice, not enforced
    "B028",    # warnings.warn without stacklevel (the warning names the wrong line): minor
]

[tool.ruff.lint.isort]
known-first-party = ["core", "sfx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
# tests/ mirrors the code (tests/core/audit/test_pitch.py beside tests/core/audio/test_pitch.py): its
# folders are no packages, so a module is imported by its path, not its file name; and tests/core
# cannot stand in for core where a runner puts tests/ first on sys.path
addopts = ["--import-mode=importlib"]

[tool.vulture]
# Code nothing uses: `python -m vulture`.  vulture_whitelist.py lists what is used in ways it
# cannot see (unittest classes, ModNote members); each other finding is dead code, or a name
# reached through getattr / YAML that belongs in the whitelist too
paths = ["core", "sfx", "tools", "tests", "convert.py", "analyze.py", "sonic2wav.py",
         "vulture_whitelist.py"]
exclude = ["reference/", "3rdparty/", "build/"]
min_confidence = 60

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# The tools/ and subpackage scripts manipulate sys.path at runtime
executionEnvironments = [
    { root = ".", pythonVersion = "3.11" },
]
include = ["core", "convert.py", "analyze.py", "sonic2wav.py", "sfx", "tools"]
exclude = ["reference", "3rdparty", "build", "output", "**/__pycache__"]
# Rules relaxed for intentionally dynamic code:
# an import whose type stubs exist but whose source package is not installed
reportMissingModuleSource = false
# an attribute pyright cannot find on the object's declared type (set at run time, getattr'd)
reportAttributeAccessIssue = false

# Import rules (agents.md layering), checked by tests/test_layers.py (or lint-imports).
# Each package imports only the layers below it; the bottom ones (song IR, MOD, chips, audio)
# are the shared vocabulary.  As in MAME, a chip is a device (core/chips/<chip>: the emulator and its
# facts) that any driver can drive; core/synth drives it with a song's voices for the converter.  Directly below only where it keeps drivers swappable: the layers
# above reach a driver through core.source alone.  Type-hint-only imports (TYPE_CHECKING) are
# not imports here: a back-reference for a hint is no cycle.
[tool.importlinter]
root_packages = ["core", "sfx"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "core: each layer imports only those below it"
type = "layers"
layers = [
    "core.ui",
    "core.convert | core.audit",
    "core.merge | core.synth",
    "core.plan",
    "core.config",
    "core.source",
    "core.vgm | core.drivers",
    "core.rom",
    "core.smps | core.mod",
    "core.chips | core.audio | core.render_cache",
    "core.files",
]

[[tool.importlinter.contracts]]
name = "drivers: reached through core.source alone"
type = "forbidden"
source_modules = ["core.ui", "core.convert", "core.audit", "core.merge", "core.synth", "core.plan", "core.config"]
forbidden_modules = ["core.drivers"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "drivers: none imports another (a family's shared code is the family folder's)"
type = "independence"
modules = [
    "core.drivers.smps68k.sonic1",
    "core.drivers.smps68k.type1a",
    "core.drivers.smps68k.mucom",
    "core.drivers.smpsz80.type0fm",
]

[[tool.importlinter.contracts]]
name = "core: no SFX driver"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["sfx"]

[[tool.importlinter.contracts]]
name = "drivers: a driver folder loaded by the registry alone (lazily)"
type = "protected"
protected_modules = ["core.drivers.smps68k", "core.drivers.smpsz80"]
allowed_importers = ["core.drivers.registry"]
as_packages = true

[[tool.importlinter.contracts]]
name = "drivers: Sonic 1's tables reach the pipeline only through a driver's rules"
type = "protected"
protected_modules = ["core.drivers.reference"]
allowed_importers = ["core.drivers.smps68k", "core.drivers.smpsz80", "sfx"]
as_packages = true

[[tool.importlinter.contracts]]
name = "drivers: the families independent (68k, Z80)"
type = "independence"
modules = ["core.drivers.smps68k", "core.drivers.smpsz80"]

[[tool.importlinter.contracts]]
name = "core: no import cycle between a package's modules"
type = "acyclic_siblings"
ancestors = ["core"]
depth = 10

[[tool.importlinter.contracts]]
name = "core.smps: the song IR does not import the asm front end"
type = "forbidden"
source_modules = ["core.smps.song", "core.smps.code", "core.smps.playback", "core.smps.track", "core.smps.tempo",
                  "core.smps.run_out", "core.smps.rules", "core.smps.percussion", "core.smps.driver_tables",
                  "core.smps.song_prep", "core.smps.compare"]
forbidden_modules = ["core.smps.parser", "core.smps.asm_writer"]

[[tool.importlinter.contracts]]
name = "core.rom: readers above the vocabulary above the image"
type = "layers"
containers = ["core.rom"]
layers = ["header | tracks | voices | envelopes | pcm", "z80", "variant", "grammar", "flags | fixes | memory | kosinski", "image | pattern"]

[[tool.importlinter.contracts]]
name = "core.convert.channel_writer: the walk above its parts above the cells"
type = "layers"
containers = ["core.convert.channel_writer"]
layers = ["writer", "router | levels | modulation | fades | note_warnings", "note", "cells", "context"]

[[tool.importlinter.contracts]]
name = "chips: a device above its chip's facts"
type = "layers"
containers = ["core.chips"]
layers = ["ym2612 | sn76489", "fm | psg | cbuild"]
