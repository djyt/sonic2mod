  - [12, "fm_v05_C7.raw", 19, 0]   # VGZ: -4.0 dB at 12
  - [13, "fm_v06_Bb0.raw", 58, 0]   # VGZ: -3.7 dB at 38
  - [14, "fm_v06_Ab1.raw", 60, 0]   # VGZ: -3.9 dB at 38
  - [16, "fm_v07_Cs1.raw", 58, 0]   # VGZ: -3.7 dB at 38
  - [17, "fm_v07_B1.raw", 59, 0]   # VGZ: -3.8 dB at 38
