# -------------------------------------------------------------------------------------------------
# MARBLE ZONE Conversion Script
# -------------------------------------------------------------------------------------------------
name: Marble Zone
input_file: "input/sonic_1/Mus83 - MZ.asm"
output_file: output/sonic_1/03_marble_zone.mod
samples_dir: "input/sonic_1/samples/"

# Variant lofi (convert.py --variant lofi --merged -> output/sonic_1/03_marble_zone_lofi_merged.mod): the
# Amiga port's build.  Each change sits in a `variants: lofi:` block beside the keys it replaces.
variants:
  lofi:
    name: "Marble Zone lofi"
    # Half the rows (-8 KB of patterns): same tick, notes exact (EDx), but a rest landing mid-row
    # snaps to the row - 63 key-offs move 37.5 ms, 3 lead gaps before a note close
    ticks_per_row: 2
    target_speed: 6
    mod_pattern_breaks:
      - pattern: 0
        row: 29            # the intro is 30 rows here
    sample_list:                    # measured on the lofi merged renders, each part against its chip channels
      - [1, "kick.raw", 51, 0]
      - [2, "snare.raw", 46, 3]
      - [3, "fm_v00.raw", 10, 0]    # lead: 8 played 1.9 dB under the drums (the A1 root's lost treble)
      - [4, "fm_v01.raw", 15, 0]
      - [5, "fm_v02.raw",  7, 0]    # chords: 8 played 0.8 dB over
      - [6, "fm_v03.raw", 14, 0]
      - [7, "fm_v04.raw", 10, 0]
      - [8, "psg_fTone_08_lo.raw", 7, 0]   # PSG1: 6 played 1.3 dB under
      - [9, "psg_fTone_08_hi.raw", 7, 0]
      - [10, "psg_noise.raw", 7, 0]
      - [12, "fm_v00.raw", 8, 0]

auto_bpm: true
target_speed: 3
ticks_per_row: 1
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7
  - source: PSG3
    mod_channel: 8

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 51, 0] # VGZ: +2.0 dB at 64
  - [2, "snare.raw", 46, 3] # VGZ: +2.8 dB at 64 (3 hits, set by hand — too few for --write-volumes)
  # --- voice $00: alg 2: (1+(2→3))→4, fb 4 — FM1, FM3 ---
  - [3, "fm_v00.raw",  8, 0] # VGZ: +0.6 dB at 9
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [4, "fm_v01.raw", 15, 0] # VGZ: +6.9 dB at 32
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM4, FM5 ---
  - [5, "fm_v02.raw",  8, 0] # VGZ: +12.1 dB at 32
  # --- voice $03: alg 3: ((1→2)+3)→4, fb 4 — FM4 ---
  - [6, "fm_v03.raw", 14, 0] # VGZ: +1.4 dB at 16
  # --- voice $04: alg 2: (1+(2→3))→4, fb 0 — FM5 ---
  - [7, "fm_v04.raw", 10, 0] # VGZ: +9.8 dB at 32
  # --- PSG tone fTone_08 ---
  - [8, "psg_fTone_08_lo.raw",  6, 0] # baked: 64 at PSG attenuation 3 (−6 dB); VGZ: +0.8 dB at 7
  - [9, "psg_fTone_08_hi.raw",  7, 0] # baked: 64 at PSG attenuation 3 (−6 dB); VGZ: -1.5 dB at 6
  # --- PSG noise (form $E7) ---
  # psg_map[0xE7] uses instrument 10.  It used to have no line here (so it played at the default 64)
  # while a line for the unused instrument 11 carried the intended volume; measured against the VGZ.
  - [10, "psg_noise.raw",  7, 0] # baked: 64 at PSG attenuation 3 (−6 dB); VGZ: +5.6 dB at 13
  # --- voice $00: tuned!
  - [12, "fm_v00.raw",  8, 0] # VGZ: +0.6 dB at 9

dac_samples:
  # dKick: ×2 — ~7805 Hz on hardware (the cycle count less this song's 4.8 % per-frame stall) → B1 (+6 c)
  - name: dKick
    mod_instrument: 1
    mod_note: B1
  # dSnare: ×1 — ~22635 Hz on hardware (the cycle count less this song's 4.8 % per-frame stall) → F3 ft +3 (+1 c)
  - name: dSnare
    mod_instrument: 2
    mod_note: F3

voice_map:
  # $00 — alg 2: (1+(2→3))→4, fb 4 — used by FM1, FM3
  0:
    - low:  A5
      high: B6
      mod_instrument: 3
      root: A2
      loop_drift_db: 1.5   # at 1 its timbre never settles in the 1.84 s that fit: no loop, its 2.89 s notes cut; 2 loops in the attack
      variants:
        lofi:
          root: A1            # MOD B-3 is past Paula's limit; an octave down keeps 16 harmonics (-13.8 dB above), half the bytes
          loop_drift_db: 6    # the lead loops 0.67 s in, not 1.81 (-17 KB); with no start it looped 24 ms in, a buzz
          loop_start_ms: 700
  # $01 — alg 2: (1+(2→3))→4, fb 7 — used by FM2
  1:
    - low:  E3
      high: B4
      mod_instrument: 4
      root: E2
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM4, FM5
  2:
    - low:  D6
      high: E7
      mod_instrument: 5
      root: D2
  # $03 — alg 3: ((1→2)+3)→4, fb 4 — used by FM4
  3:
    - low:  E4
      high: E5
      mod_instrument: 6
      root: E2
  # $04 — alg 2: (1+(2→3))→4, fb 0 — used by FM5
  4:
    - low:  E3
      high: E4
      mod_instrument: 7
      root: E2

psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 10
    root: A2               # MOD anchor — A2 keeps all PSG3 notes (up to E4) within MOD range with no clamping
    low: A3                # SMPS pitch anchor — nA3 (sem 45) → MOD A2; each semitone above/below shifts output ±1

psg_voice_map:
  fTone_08:
    - low:  F5
      high: B6
      mod_instrument: 8
      root: F2
      variants:
        lofi: {high: F7, root: A1}   # one sample for F5-F7 (A-1..A-3, none past Paula's A-3): 10 harmonics
                                     # each, the high notes had 4 (-10 KB); the entry below plays nothing
    - low:  C7
      high: F7
      mod_instrument: 9
      root: C2


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM3 shares FM1's data, but tuned with smpsAlterNote $02
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM3:
    0:
    - low:  A5
      high: B6
      mod_instrument: 12
      root: A2
      variants:
        lofi: {root: A1}   # as FM1's


# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 59


# -------------------------------------------------------------------------------------------------
# Amiga build (convert.py --merged): 9 channels → 4.  merge_survey: FM1/FM3, FM4/FM5 clean
# -------------------------------------------------------------------------------------------------
# Every pattern; columns as Green Hill's: 1 drums + bass, 4 the Amiga port's sound effects' (the
# chords).  A group's mod_channel names the column it takes over
merge_patterns:
  - patterns: "0-10"
    groups:
      # 1 - Drums + bass: PSG3's pitched noise follows FM2 note for note (149 paired); kicks on 77
      - primary: PSG3
        followers: [FM2, DAC]
        mod_channel: FM1
        variants:
          lofi: {mix_note: A2}   # mixes at 14 kHz, not up to 31: treble to 7 kHz, as Green Hill's drums (-36 KB)
      # 2 - Lead: FM3 doubles FM1 at +2 FNUM (smpsAlterNote $02): one chip composite
      - primary: FM1
        followers: [FM3]
        mod_channel: FM4
      # 3 - PSG1, its own column
      # 4 - Chords: FM5 a third under FM4 (77 of 77 paired)
      - primary: FM4
        followers: [FM5]
        mod_channel: PSG3

# PSG2 is PSG1 two ticks later at +1 divider: an echo, every note an orphan
merge_drop: [PSG2]

# A chord moves to column 3 wherever PSG1 is silent for all of it, else to the lead's column 2 in
# its rests (patterns $D-$F): column 4 interrupted less
merge_vacate:
  FM4: [PSG1, FM1]
