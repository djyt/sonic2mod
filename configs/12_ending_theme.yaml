# -------------------------------------------------------------------------------------------------
# ENDING SCREEN Conversion Script
# -------------------------------------------------------------------------------------------------
name: Ending Theme
input_file: "input/Mus8B - Ending.asm"
output_file: output/12_ending_theme.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 2
num_mod_channels: 10
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7
  - source: PSG3
    mod_channel: 8

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 64, 0]
  - [2, "kick.raw", 64, 0]
  # --- voice $00: alg 5: 1→(2+3+4), fb 7 — FM4, FM5 ---
  - [3, "fm_v00.raw", 32, 0]
  # --- voice $01: alg 0: 1→2→3→4, fb 4 — FM2, FM3, FM4 ---
  - [4, "fm_v01_lo.raw", 28, 0] # VGZ: +1.3 dB at 32
  - [5, "fm_v01_hi.raw", 27, 0] # VGZ: +1.5 dB at 32
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM3, FM4 ---
  - [6, "fm_v02.raw", 19, 0] # VGZ: +4.4 dB at 32
  # --- voice $03: alg 2: (1+(2→3))→4, fb 7 — FM1, FM5 ---
  - [7, "fm_v03_lo.raw", 32, 0]
  - [8, "fm_v03_hi.raw", 18, 0] # VGZ: +4.8 dB at 32
  # --- PSG noise (form $E7) ---
  - [10, "psg_noise.raw",  6, 0] # baked: 16 at PSG attenuation 3 (−6 dB); VGZ: +3.0 dB at 8
  # --- PSG tone fTone_05 ---
  - [9, "psg_fTone_05.raw",  5, 0] # baked: 32 at PSG attenuation 5 (−10 dB); VGZ: +6.6 dB at 10
  # Pitch Adjusted version
  - [11, "fm_v03_hi.raw", 18, 1] # VGZ: +4.8 dB at 32

dac_samples:
  # dSnare: ×44 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 1
    mod_note: Fs3
  # dKick: ×32 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 2
    mod_note: C2

voice_map:
  # $00 — alg 5: 1→(2+3+4), fb 7 — used by FM4, FM5
  0:
    - low:  G6
      high: A7
      mod_instrument: 3
      root: G2
      synth_root: G5
  # $01 — alg 0: 1→2→3→4, fb 4 — used by FM2, FM3, FM4
  1:
    - low:  A2
      high: B3
      mod_instrument: 4
      root: A2
      synth_root: A1
    - low:  C4
      high: D4
      mod_instrument: 5
      root: C2
      synth_root: C3
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM3, FM4
  2:
    - low:  Gs5
      high: Gs6
      mod_instrument: 6
      root: Gs2
      synth_root: Gs4
  # $03 — alg 2: (1+(2→3))→4, fb 7 — used by FM1, FM5
  3:
    - low:  A2
      high: B3
      mod_instrument: 7
      root: A2
      synth_root: A1
    - low:  C4
      high: B6
      mod_instrument: 8
      root: C1
      synth_root: C3

psg_map:
  0xE7:                    # form $E7
    mod_instrument: 10
    root: A3
    noise_rate: 3
    synth_root: A8
    envelope: fTone_04
    base_volume: 0

psg_voice_map:
  fTone_05:
    low:  E5
    high: D6
    mod_instrument: 9
    root: E2
    synth_root: E4   # pitch audit: was E5, 12 semitones too high
    
# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    3:
    - low:  C4
      high: B6
      mod_instrument: 11
      root: C1
      synth_root: C3

# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 47