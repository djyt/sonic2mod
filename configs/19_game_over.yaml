  # --- voice $01: alg 4: (1→2)+(3→4), fb 7 — FM2, FM3 ---
  - [3, "fm_v01.raw", 27, 0] # VGZ: +4.3 dB at 44
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM4 ---
