# -------------------------------------------------------------------------------------------------
# Sonic2WAV SFX Settings (sonic2wav.py)
#
# - The chip clocks, the Amiga clock and the resampler's taps are the converter's: settings.yaml.
# - A variant lays its keys over the ones beside it:   python sonic2wav.py --all --variant amiga
# -------------------------------------------------------------------------------------------------

input: reference/smps_drivers/sonic_1/sfx   # The SndXX .asm files --all renders

render:
  fps: 60                   # V-int rate, one SFX tick a frame: 60 NTSC, 50 PAL
  tail_seconds: 1.0         # Rendered after the last track stops, for the release
  max_seconds: 10.0         # Safety cap (the longest, SndBF Get Continue, plays 4.3 s)
  psg_gain: 0.31            # PSG against FM, each chip at its own full scale: VGMPlay's balance (Nuked
                            # core), a full PSG tone 10.2 dB under a full FM carrier.  1.0 put them level:
                            # Jump 10 dB too loud against the Ring
  psg_past_table: extend    # A PSG note past the driver's table (SndB6 Spikes Move):
                            #   extend : the twelve-tone sequence continued
                            #   clamp  : the table's top note

output:
  directory: output/sonic_1/sfx
  format: wav               # wav : RIFF .wav files (8-bit unsigned, as WAV stores it)
                            # raw : headerless signed PCM (16-bit big-endian) + manifest.yaml
  bits: 16                  # 8 | 16
  rate: 44100               # Hz, or
                            #   native : the YM2612's own (53267 Hz), not resampled
                            #   auto   : per effect, the lowest ProTracker rate holding 99 % of its energy
                            #            (paula only)
  channels: stereo          # stereo | mono (the ring pair's panning lost)
  mono_fold: mean           # mono: a panned effect (the rings) against a centred one
                            #   mean    : (L+R)/2, 6 dB under (the Mega Drive's mono A/V out)
                            #   power   : 3 dB under, what a stereo listener hears
                            #   loudest : as loud as centred
  level: global             # global    : one gain for the set; the composed balance kept
                            # normalise : each effect at full scale; raw's manifest volume restores the
                            #             balance (Paula scales after its DAC: quiet effects keep their bits)
  peak_dbfs: -0.3           # global: the loudest effect's peak
  boost: 1                  # global: played at volume 64 / boost to the nearest whole one, baked x exactly
                            # 64 / that volume (1.45 -> volume 44, x 1.4545).  Quiet effects gain
                            # log2(boost) bits, loud ones clip (the manifest counts it)
  dc_block: false           # Remove DC (30 Hz high-pass): the PSG noise effects carry real offset
  dither: off               # 8-bit rounding:
                            #   shaped : noise pushed up the band; long smpsAlterVol ramps stay smooth
                            #   flat   : noise even across the band
                            #   off    : plain rounding; a quiet tail steps
  paula: false              # Rates on ProTracker's period grid (played at a note, finetune 0), a silent
                            # repeat word appended.  Needs bits: 8, channels: mono
  max_rate: 28604           # auto's ceiling (period 124).  16574 for an A500: its ~4.4 kHz filter
  trim_lead: false          # Start at the first sample that rounds to a step: 19 SFX open on a one-frame
                            # rest (nRst, $01, in the data: the voice keyed off before its note), silence
                            # in a sample.  Plays a frame earlier than the Mega Drive
  tail_db: off              # Cut where the effect stays this many dB under its own peak (-30), the last
                            # frame faded; off keeps it to the 16-bit floor
  effects: {}               # One effect's own trim_lead / tail_db, by sound id:  {CC: {tail_db: -24}}

  variants:
    # Amiga Quality Samples
    amiga:
      directory: output/sonic_1/sfx/amiga
      format: raw
      bits: 8
      rate: 8287            # C-2, period 428: one rate for the software mixer
      channels: mono
      level: normalise
      dc_block: true
      dither: shaped
      paula: true
      trim_lead: true

    # Amiga Quality Samples for Aonic's Crude Software Mixer
    mixer:
      directory: output/sonic_1/sfx/mixer
      format: raw
      bits: 8
      rate: 8287            # Aonic SFX Mixer Target Rate (Hz)
      channels: mono
      mono_fold: power      # The rings 3 dB under a centred effect, as a stereo listener hears them
      level: global
      peak_dbfs: 0          # the loudest at the rails: a solo effect plays at its composed level
      boost: 2              # volume 32: two rings + Jump peak at 122 of 127 (every block-aligned start)
      dc_block: true
      dither: off # shaped
      paula: true
      trim_lead: true       # Remove silence / rests at the start of sounds like the 'spring'
      tail_db: -36          # Eliminate Quiet tails

      # Sound effects with custom tail eliminiation
      effects:
        A3: {tail_db: -16}  # Effect $AC [Death]
        A6: {tail_db: -24}  # Effect $A6 [Spikes]
        AC: {tail_db: -20}  # Effect $AC [Boss Hit]
        B9: {tail_db: -16}  # Effect $B9 [Cliff Collapse]
        C1: {tail_db: -24}  # Effect $C1 [Break Item]
        CC: {tail_db: -28}  # Effect $CC [Spring]
