# -------------------------------------------------------------------------------------------------
# GREEN HILL ZONE Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Green Hill Zone"
input_file: "input/Mus81 - GHZ.asm"
output_file: "output/02_green_hill_zone.mod"
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3             # speed byte = $03 (smpsHeaderTempo $01, $03)
ticks_per_row: 2            # GCD of main note durations ($04,$08,$0C,$10,$18...) = 4
num_mod_channels: 10


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  # FM1: intro call + main loop
  - source: FM1
    mod_channel: 1

  # FM2: bass channel only
  - source: FM2
    mod_channel: 2

  # FM3: countermelody + harmony
  - source: FM3
    mod_channel: 3

  # FM4: tremolo pad + melody
  - source: FM4
    mod_channel: 4

  # FM5: detuned double of FM4 (smpsAlterNote $02 ≈ +10 cents FNUM offset).
  # Routed via channel_instrument_map to finetune+1 variants.
  - source: FM5
    mod_channel: 5

  # PSG channels — melodic in GHZ; enabled for audio output.
  - source: PSG1
    mod_channel: 6

  - source: PSG2
    mod_channel: 7

  # PSG3: noise channel — smpsPSGform $E7, plays nMaxPSG rhythm.
  - source: PSG3
    mod_channel: 8


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if fm_synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
#
# Volumes marked "VGZ" were set from tools/vgm_compare.py level measurements against
# reference/vgz/02 - Green Hill Zone.vgz (relative to FM2 = inst 3/4 at 32); see docs/audits/02_ghz_audit.md.
# FM4/FM5 levels on the shared instruments 11/13/14 are still 3-5 dB hot: that needs the converter
# to honour the smpsHeaderFM TL and the 0.75 dB/step smpsAlterVol law (todo item 4), not a volume here.
sample_list:
  # --- percussion ---
  - [1,  "kick.raw",        64, 0]
  - [2,  "snare.raw",       64, 0]
  # --- voice $00: deep bass (FM2 opening) ---
  - [3,  "ghz_v00.raw",     32, 0]
  # --- voice $01: bass/rhythm pad (FM2 main loop) ---
  - [4,  "ghz_v01.raw",     32, 0]
  # --- voice $02: bright lead (FM1 intro, FM3 opening) ---
  - [5,  "ghz_v02.raw",     24, 0] # VGZ: FM1 +2.1 dB / FM3 +3.5 dB at 32
  # --- voice $04: bell arp (FM4/FM5 ending section) ---
  - [6,  "ghz_v04.raw",     32, 0]
  - [8,  "ghz_v04.raw",     19, 1] # Same sample, finetune +1 (~+12.5 cents). VGZ: FM5 (TL $20) +4.5 dB at 32
  # --- voice $05: main melody (FM1/FM3/FM4/FM5) ---
  - [10, "ghz_v05.raw",     26, 0]
  - [11, "ghz_v05_lo.raw",  16, 0]
  # --- voice $06: FM1 melodic fills (smpsAlterPitch sections) ---
  - [12, "ghz_v06.raw",     64, 0]
  # --- voice $07: bridge voice (FM1/FM3/FM4) ---
  - [13, "ghz_v07.raw",     32, 0]
  # --- voice $08: bright synth (FM3/FM4/FM5 main) ---
  - [14, "ghz_v08.raw",     32, 0]
  - [15, "ghz_v08_hi.raw",  32, 0]
  # --- PSG White Noise ---
  - [16, "psg_noise.raw",   14, 0] # VGZ: +6.9 dB at 32
  # --- PSG Voices ---
  - [17, "psg_tone01.raw",  16, 0]
  - [18, "psg_tone03.raw",  16, 0]
  - [19, "psg_tone05.raw",  16, 0]
  - [20, "psg_tone06.raw",  16, 0]


# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare for GHZ only
# -------------------------------------------------------------------------------------------------
dac_samples:
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # $00 → deep bass
  0:
    - low:  C2
      high: B4
      mod_instrument: 3
      root: C2
      synth_root: C2

  # $01 → bass/rhythm pad
  1:
    - low:  C2
      high: B4
      mod_instrument: 4
      root: C2
      synth_root: C2

  # $02 → bright lead
  2:
    - low:  C6
      high: B7
      mod_instrument: 5
      root: C2
      synth_root: C5

  # $04 → bell arp
  4:
    - low:  C6
      high: E7
      mod_instrument: 6
      root: C2
      synth_root: C4

  # $05 → main melody
  5:
    - low:  C4
      high: B5
      mod_instrument: 11
      root: C2
      synth_root: C1
    - low:  C6
      high: B7
      mod_instrument: 10
      root: C2
      synth_root: C3

  # $06 → FM1 fills
  6:
    - low:  C6
      high: B7
      mod_instrument: 12
      root: C2
      synth_root: C4
      vibrato: 0            # Sounds awful, disable it!

  # $07 → bridge
  7:
    - low:  C5
      high: B5
      mod_instrument: 13
      root: C2
      synth_root: C4
  # $08 → bright synth
  8:
    - low:  C5
      high: B5
      mod_instrument: 14
      root: C2
      synth_root: C2
    - low:  C6
      high: B6
      mod_instrument: 15
      root: C2
      synth_root: C3


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 16
    root: A3               # target_rate ≈ 27928 Hz
    noise_rate: 3
    tone2_n: 1             # nMaxPSG → PSGFrequencies[69]: the driver writes tone-2 divider 0, which the
                           # VDP PSG clocks as N=1 (LFSR ≈ 112 kHz, near-white hiss).  The VGZ confirms N=0.
    envelope: fTone_04     # Quick stepped fade (10 frames)
    base_volume: 0         # SN76489 base attenuation (0=max)

psg_voice_map:
  fTone_01:
    mod_instrument: 17
    root: A2
    synth_root: A4
  fTone_03:
    mod_instrument: 18
    root: A2
    synth_root: A4
  fTone_05:
    mod_instrument: 19
    root: A2
    synth_root: A4
  fTone_06:
    mod_instrument: 20
    low: A6
    root: A2
    synth_root: A5


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 applies smpsAlterNote $02 (FNUM offset ≈ +10 cents) during voice $04
# bell-arp sections to create the chorus detune effect vs FM4.  The same
# source notes route to inst 8/9 (identical audio to inst 6/7, finetune +1).
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    4:                        # voice $04 on FM5 (bell arp, detuned)
      - low:  C6              # bottom of FM5 arp range
        high: B7              # top
        root: C2
        synth_root: C4
        mod_instrument: 8    # same audio as inst 6, finetune +1


# -------------------------------------------------------------------------------------------------
# Structural pattern break: GHZ intro fills rows 0-31 of pattern 0; the loop begins at row 32.
# A Bxx at row 31 jumps cleanly to pattern 1 instead of playing 32 rows of silence.
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 31
