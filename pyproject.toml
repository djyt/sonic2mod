[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic2mod"
version = "0.2.0"
description = "Sonic 1 SMPS music to Amiga MOD converter"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
dev = ["ruff", "pyright", "vulture", "pytest", "coverage", "import-linter"]

[project.scripts]
sonic2mod = "convert:main"
sonic2mod-analyze = "analyze:main"
sonic2wav = "sonic2wav:main"

[tool.setuptools]
py-modules = ["convert", "analyze", "sonic2wav"]

# Found, not listed: a new driver folder (core/drivers/<family>/<driver>/) joins by itself
[tool.setuptools.packages.find]
include = ["core", "core.*", "ym2612", "sn76489", "sfx"]

[tool.setuptools.package-data]
ym2612 = ["*.dll", "*.so", "*.c"]
sn76489 = ["*.dll", "*.so", "*.c"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names, etc.)
    "I",      # isort
    "UP",     # pyupgrade (modernise syntax)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PERF",   # perflint
    "PLW",    # pylint warnings
    "RUF",    # ruff-specific rules
]
ignore = [
    # Line length — many lines are intentionally wide (Rich markup, byte tables)
    "E501",
    # Multiple statements on one line — used intentionally for compact channel init
    "E701", "E702",
    # Module-level import not at top — sys.path manipulation before imports is intentional
    "E402",
    # Ambiguous variable names (l, O, I) — e.g. loop indices in SMPS parsing
    "E741",
    # Magic value comparisons — byte values ($81, $E0, etc.) are self-documenting constants
    "PLR2004",
    # Complexity thresholds — conversion engine is inherently complex
    "C901", "PLR0912", "PLR0915", "PLR0913",
    # Boolean positional args — existing API; not worth breaking callers
    "FBT001", "FBT002",
    # Import-outside-toplevel — conditional sys.path inserts in subpackages
    "PLC0415",
    # Non-lowercase variable in function — SETTINGS_FILE, SMPS_ constants are fine
    "N806",
    # os.path → pathlib migration — not a priority; keep os.path for consistency
    "PTH100", "PTH102", "PTH103", "PTH107", "PTH110", "PTH111",
    "PTH112", "PTH113", "PTH116", "PTH117", "PTH118", "PTH119",
    "PTH120", "PTH122", "PTH123",
    # Private member access — sfx/chips.py and tools/ reuse a few private helpers
    "SLF001",
    # Typing-only imports — not restructuring imports right now
    "TC001", "TC002", "TC003",
    # Implicit namespace package — tools/ scripts don't need __init__.py
    "INP001",
    # Ambiguous Unicode in strings/docstrings/comments — musical symbols are intentional
    "RUF001", "RUF002", "RUF003",
    # Missing trailing comma — style preference; not enforced here
    "COM812",
    # No-explicit-stacklevel for warnings.warn — minor
    "B028",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "ym2612", "sn76489", "sfx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
# tests/ mirrors the code (tests/core/audit/test_pitch.py beside tests/core/audio/test_pitch.py): its
# folders are no packages, so a module is imported by its path, not its file name; and tests/core
# cannot stand in for core where a runner puts tests/ first on sys.path
addopts = ["--import-mode=importlib"]

[tool.vulture]
# Code nothing uses: `python -m vulture`.  vulture_whitelist.py lists what is used in ways it
# cannot see (unittest classes, ModNote members); each other finding is dead code, or a name
# reached through getattr / YAML that belongs in the whitelist too
paths = ["core", "ym2612", "sn76489", "sfx", "tools", "tests", "convert.py", "analyze.py", "sonic2wav.py",
         "vulture_whitelist.py"]
exclude = ["reference/"]
min_confidence = 60

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# The tools/ and subpackage scripts manipulate sys.path at runtime
executionEnvironments = [
    { root = ".", pythonVersion = "3.11" },
]
include = ["core", "convert.py", "analyze.py", "sonic2wav.py", "ym2612", "sn76489", "sfx", "tools"]
exclude = ["reference", "output", "**/__pycache__"]
# Relax rules that fire on intentionally dynamic code
reportMissingModuleSource = false
reportAttributeAccessIssue = false

# Import rules (agents.md layering), checked by tests/test_layers.py (or lint-imports).
# Each package imports only the layers below it; the bottom ones (song IR, MOD, chips, audio)
# are the shared vocabulary.  Directly below only where it keeps drivers swappable: the layers
# above reach a driver through core.source alone.  Type-hint-only imports (TYPE_CHECKING) are
# not imports here: a back-reference for a hint is no cycle.
[tool.importlinter]
root_packages = ["core", "sfx", "ym2612", "sn76489"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "core: each layer imports only those below it"
type = "layers"
layers = [
    "core.ui",
    "core.convert | core.audit",
    "core.merge",
    "core.plan",
    "core.config",
    "core.source",
    "core.vgm | core.drivers",
    "core.rom",
    "core.smps | core.mod",
    "core.chips | core.audio | core.render_cache",
    "core.files",
]

[[tool.importlinter.contracts]]
name = "drivers: reached through core.source alone"
type = "forbidden"
source_modules = ["core.ui", "core.convert", "core.audit", "core.merge", "core.plan", "core.config"]
forbidden_modules = ["core.drivers"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "drivers: none imports another (a family's shared code is the family folder's)"
type = "independence"
modules = [
    "core.drivers.smps68k.sonic1",
    "core.drivers.smps68k.type1a",
    "core.drivers.smps68k.mucom",
    "core.drivers.smpsz80.type0fm",
]

[[tool.importlinter.contracts]]
name = "core: no chip package, no SFX driver"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["sfx", "ym2612", "sn76489"]

[[tool.importlinter.contracts]]
name = "drivers: a driver folder loaded by the registry alone (lazily)"
type = "protected"
protected_modules = ["core.drivers.smps68k", "core.drivers.smpsz80"]
allowed_importers = ["core.drivers.registry"]
as_packages = true

[[tool.importlinter.contracts]]
name = "drivers: Sonic 1's tables reach the pipeline only through a driver's rules"
type = "protected"
protected_modules = ["core.drivers.reference"]
allowed_importers = ["core.drivers.smps68k", "core.drivers.smpsz80", "sfx", "ym2612", "sn76489"]
as_packages = true

[[tool.importlinter.contracts]]
name = "drivers: the families independent (68k, Z80)"
type = "independence"
modules = ["core.drivers.smps68k", "core.drivers.smpsz80"]

[[tool.importlinter.contracts]]
name = "core: no import cycle between a package's modules"
type = "acyclic_siblings"
ancestors = ["core"]
depth = 10

[[tool.importlinter.contracts]]
name = "core.smps: the song IR does not import the asm front end"
type = "forbidden"
source_modules = ["core.smps.song", "core.smps.code", "core.smps.playback", "core.smps.track", "core.smps.tempo",
                  "core.smps.run_out", "core.smps.rules", "core.smps.percussion", "core.smps.driver_tables",
                  "core.smps.song_prep", "core.smps.compare"]
forbidden_modules = ["core.smps.parser", "core.smps.asm_writer"]

[[tool.importlinter.contracts]]
name = "core.rom: readers above the vocabulary above the image"
type = "layers"
containers = ["core.rom"]
layers = ["header | tracks | voices | envelopes | z80", "variant", "grammar", "flags | fixes | memory | kosinski", "image"]

[[tool.importlinter.contracts]]
name = "chips: ym2612 and sn76489 independent"
type = "independence"
modules = ["ym2612", "sn76489"]
