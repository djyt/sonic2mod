# -------------------------------------------------------------------------------------------------
# GREEN HILL ZONE Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Green Hill Zone"
input_file: "sonic_1/music/Mus81 - GHZ.asm"
output_file: "output/ghz6_psg.mod"
samples_dir: "./samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3             # speed byte = $03 (smpsHeaderTempo $01, $03)
ticks_per_row: 2            # GCD of main note durations ($04,$08,$0C,$10,$18...) = 4
num_mod_channels: 10


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  # FM1: intro call + main loop
  - source: FM1
    mod_channel: 1

  # FM2: bass channel only
  - source: FM2
    mod_channel: 2

  # FM3: countermelody + harmony
  - source: FM3
    mod_channel: 3

  # FM4: tremolo pad + melody
  - source: FM4
    mod_channel: 4

  # FM5: detuned double of FM4 (smpsAlterNote $02 ≈ +10 cents FNUM offset).
  # Routed via channel_instrument_map to finetune+1 variants.
  - source: FM5
    mod_channel: 5

  # PSG channels — melodic in GHZ; enabled for audio output.
  - source: PSG1
    mod_channel: 6
    #transpose: -48           # D5–Bb6 (62–82) → D2–Bb3 (14–34) ✓
    enabled: false

  - source: PSG2
    mod_channel: 7
    #transpose: -48           # C5–C7 (60–84) → C2–B3+1 clamp ✓
    enabled: false

  # PSG3: noise channel — smpsPSGform $E7, plays nMaxPSG rhythm.
  - source: PSG3
    mod_channel: 8
    #transpose: -48
    enabled: true


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
sample_list:
  # --- percussion ---
  - [1,  "kick.raw",        64, 0]
  - [2,  "snare.raw",       64, 0]
  # --- voice $02: bright lead (FM1 intro, FM3 opening) ---
  - [3,  "ghz_v02.raw",     32, 0]
  # --- voice $05: main melody (FM1/FM3/FM4/FM5) ---
  - [4,  "ghz_v05.raw",     16, 0]
  - [5,  "ghz_v05_lo.raw",  16, 0]  
  # --- voice $06: FM1 melodic fills (smpsAlterPitch sections) ---
  - [6,  "ghz_v06.raw",     64, 0]
  # --- PSG White Noise ---
  - [7,  "psg_noise.raw",   16, 0]
  # --- PSG Voices ---
  - [8,  "psg_tone01.raw",  16, 0]
  - [9,  "psg_tone03.raw",  16, 0]
  - [10, "psg_tone05.raw",  16, 0]
  - [11, "psg_tone06.raw",  16, 0]
  # --- voice $00: deep bass (FM2 opening) ---
  - [13,  "ghz_v00.raw",    32, 0]
  # --- voice $01: bass/rhythm pad (FM2 main loop) ---
  - [16,  "ghz_v01.raw",    32, 0]
  # --- voice $07: bridge voice (FM1/FM3/FM4) ---
  - [19, "ghz_v07.raw",     32, 0]
  # --- voice $08: bright synth (FM3/FM4/FM5 main) ---
  - [22, "ghz_v08.raw",     32, 0]
  - [23, "ghz_v08_hi.raw",  32, 0]
  # --- voice $04: bell arp (FM4/FM5 ending section) ---
  - [25, "ghz_v04.raw",     32, 0]
  - [26, "ghz_v04_lo.raw",  32, 0]
  - [27, "ghz_v04.raw",     32, 1] # Same Sample finetune +1 (~+12.5 cents)
  - [28, "ghz_v04_lo.raw",  32, 1] # Same Sample finetune +1 (~+12.5 cents)

# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare for GHZ only
# -------------------------------------------------------------------------------------------------
dac_samples:
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # $00 → deep bass
  0:
    - low:  C2
      high: B4
      mod_instrument: 13
      root: C2
      synth_root: C3

  # $01 → bass/rhythm pad
  1:
    - low:  C2
      high: B4
      mod_instrument: 16
      root: C2
      synth_root: C3

  # $02 → bright lead
  2:
    - low:  C6
      high: B7
      mod_instrument: 3
      root: C2
      synth_root: C6

  # $04 → bell arp
  4:
    - low:  C6
      high: E7
      mod_instrument: 25
      root: C2
      synth_root: C5
    - low:  B4
      high: B4
      mod_instrument: 26
      root: B1
      synth_root: B3

  # $05 → main melody
  5:
    - low:  C4
      high: B5
      mod_instrument: 5
      root: C2
      synth_root: C2
    - low:  C6
      high: B7
      mod_instrument: 4
      root: C2
      synth_root: C4

  # $06 → FM1 fills
  6:
    - low:  C6
      high: B7
      mod_instrument: 6
      root: C2
      synth_root: C5

  # $07 → bridge
  7:
    - low:  C5
      high: B5
      mod_instrument: 19
      root: C2
      synth_root: C5
  # $08 → bright synth
  8:
    - low:  C5
      high: B5
      mod_instrument: 22
      root: C2
      synth_root: C3
    - low:  C6
      high: B6
      mod_instrument: 23
      root: C2
      synth_root: C4


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # smpsPSGform byte; type auto-inferred: bit 2=1 → white noise
    mod_instrument: 7      # MOD instrument slot (1-based)
    root: A3               # MOD note that determines target_rate (playback pitch)
    synth_root: A4         # (optional) synthesis pitch override
    noise_rate: 0          # Preset divider 0/1/2; $E7 is rate=3 (PSG3-locked) — 0 as closest preset
    envelope: fTone_04     # Quick stepped fade (10 frames)
    base_volume: 0         # SN76489 base attenuation (0=max)

psg_voice_map:
  fTone_01: 8              # default square-wave envelope
  fTone_03: 9              # softer attack envelope
  fTone_05: 10
  fTone_06: 11


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 applies smpsAlterNote $02 (FNUM offset ≈ +10 cents) during voice $04
# bell-arp sections to create the chorus detune effect vs FM4.  The same
# source notes route to inst 12 (identical audio to inst 7, finetune +1).
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    4:                        # voice $04 on FM5 (bell arp, detuned)
      - low:  C6              # bottom of FM5 arp range
        high: B7              # top
        root: C2
        synth_root: C5
        mod_instrument: 27    # same audio as inst 7, finetune +1
      - low:  B4
        high: B4
        mod_instrument: 28
        root: B1
        synth_root: B3