# -------------------------------------------------------------------------------------------------
# DROWNING Conversion Script
#
# The track speeds up in four steps (smpsSetTempoMod $03, $04, $06, $0A after the header's $02):
# the converter writes an Fxx BPM change at each one — 75 → 100 → 112 → 125 → 135 BPM (112.5 rounds down).  Two ticks
# per row keeps every segment under the MOD ceiling of 255 (one tick per row needs 270 at the end).
# -------------------------------------------------------------------------------------------------

name: Drowning
input_file: "input/sonic_1/Mus92 - Drowning.asm"
output_file: output/sonic_1/17_drowning.mod
samples_dir: "input/sonic_1/samples/"

auto_bpm: true
target_speed: 2
ticks_per_row: 2             # see header comment: BPM 75–135 across the tempo steps
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 21, 3] # VGZ: -1.2 dB at 18
  # --- voice $00: alg 4: (1→2)+(3→4), fb 7 — FM1, FM5 ---
  - [2, "fm_v00.raw", 26, 0] # VGZ: -1.0 dB at 23
  # --- voice $01: alg 0: 1→2→3→4, fb 3 — FM2 ---
  - [3, "fm_v01.raw", 18, 0] # VGZ: -0.9 dB at 16
  # --- voice $02: alg 4: (1→2)+(3→4), fb 5 — FM3 ---
  - [4, "fm_v02.raw", 64, 0] # VGZ: FM3 reads -8.5 dB at 32 (its 50 ms notes are too short for the per-note table); 64 is the ceiling
  # --- voice $03: alg 7: 1+2+3+4, fb 0 — FM4 ---
  - [5, "fm_v03.raw",  5, 0] # VGZ: +4.5 dB at 8

dac_samples:
  # dSnare: ×41 — ~22738 Hz on hardware (the cycle count less this song's 4.4 % per-frame stall) → F3 ft +3 (-6 c)
  - name: dSnare
    mod_instrument: 1
    mod_note: F3

voice_map:
  # $00 — alg 4: (1→2)+(3→4), fb 7 — used by FM1, FM5
  0:
    - low:  C4
      high: Cs5
      mod_instrument: 2
      root: C2
  # $01 — alg 0: 1→2→3→4, fb 3 — used by FM2
  1:
    - low:  C4
      high: Cs5
      mod_instrument: 3
      root: C2
  # $02 — alg 4: (1→2)+(3→4), fb 5 — used by FM3
  2:
    - low:  C6
      high: Cs6
      mod_instrument: 4
      root: C2
  # $03 — alg 7: 1+2+3+4, fb 0 — used by FM4
  3:
    - low:  C4
      high: Cs5
      mod_instrument: 5
      root: C2
