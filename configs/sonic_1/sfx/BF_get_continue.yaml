# -------------------------------------------------------------------------------------------------
# Sound Effect $BF - Get Continue, as a MOD: 7 KB against the mixer's 35 KB WAV (sonic2wav.py).
# Three FM tracks on columns 1-3, one sample: FM4 / FM5's smpsAlterNote $01 (~2 cents) plays the plain
# sample, and B5-D6 the C5 render pitched up (their decay up to 14 semitones fast).  The fade
# (smpsAlterVol $05 a pass) is Cxx; the pattern ends on D00: the engine must stop it after one play.
# -------------------------------------------------------------------------------------------------
name: "Get Continue SFX"
input_file: "reference/smps_drivers/sonic_1/sfx/SndBF - Get Continue.asm"
output_file: output/sonic_1/sfx/mod/BF_Get_Continue.mod

range_space: chip           # SFX channels sit at pitch $F4: notes named as the chip plays them
auto_bpm: true
ticks_per_row: 7            # every duration a multiple of 7 frames: 38 rows, one pattern
target_speed: 6             # 150 BPM, the driver's tempo exactly
detune_variants: false      # FM4 / FM5 detuned on the one sample: no second slot

channels:
  - {source: FM1, mod_channel: 0}   # the SFX's FM3: arpeggio
  - {source: FM2, mod_channel: 1}   # FM4
  - {source: FM3, mod_channel: 2}   # FM5

voice_map:
  0:
    - {low: C5, high: D6, mod_instrument: 1, root: Cs2}

sample_list:
  - [1, fm_v00.raw, 45, 0]
