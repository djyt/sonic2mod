# Michael Jackson's Moonwalker - Dance Attack 4.  A minimal config: everything else is derived from the ROM
# (docs/todo/binary_import.md 2.8); python convert.py <this> --show-config prints it.
name: "Dance Attack 4"
input_file: "input/roms/Michael Jackson's Moonwalker (World) (Rev A).md"
rom_song: "$8F"

sample_list:   # volumes set from the VGZ; the rest is derived
  - [4, "fm_v00_Eb2.raw", 40, 0]   # VGZ: +1.0 dB at 45
  - [5, "fm_v00_Cs3.raw", 37, 0]   # VGZ: +1.7 dB at 45
  - [8, "fm_v02_Eb2.raw", 7, 0]   # VGZ: +0.7 dB at 8
  - [9, "fm_v02_Cs3.raw", 9, 0]   # VGZ: -1.0 dB at 8
  - [11, "fm_v03_Cs3.raw", 14, 0]   # VGZ: -2.2 dB at 11
  - [6, "fm_v01_Eb2.raw", 11, 0]   # VGZ: -2.6 dB at 8
  - [12, "psg_noise_e7.raw", 2, 0]   # VGZ: +8.2 dB at 6
