# -------------------------------------------------------------------------------------------------
# GREEN HILL ZONE Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Green Hill Zone"
input_file: "input/Mus81 - GHZ.asm"
output_file: "output/02_green_hill_zone.mod"
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3             # speed byte = $03 (smpsHeaderTempo $01, $03)
ticks_per_row: 2            # GCD of main note durations ($04,$08,$0C,$10,$18...) = 4


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  # FM1: intro call + main loop
  - source: FM1
    mod_channel: 1

  # FM2: bass channel only
  - source: FM2
    mod_channel: 2

  # FM3: countermelody + harmony
  - source: FM3
    mod_channel: 3

  # FM4: tremolo pad + melody
  - source: FM4
    mod_channel: 4

  # FM5: detuned double of FM4 (smpsAlterNote $02 ≈ +10 cents FNUM offset).
  # Routed via channel_instrument_map to finetune+1 variants.
  - source: FM5
    mod_channel: 5

  # PSG channels — melodic in GHZ; enabled for audio output.
  - source: PSG1
    mod_channel: 6

  - source: PSG2
    mod_channel: 7

  # PSG3: noise channel — smpsPSGform $E7, plays nMaxPSG rhythm.
  - source: PSG3
    mod_channel: 8


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if fm_synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
#
# Volumes marked "VGZ" were set from tools/vgm_compare.py level measurements (L/R power) against
# reference/vgz/02 - Green Hill Zone.vgz, relative to FM2 = inst 3/4 at 32; see docs/audits/02_ghz_audit.md.
# With fm_volume_scaling: baked a volume here is the level of the instrument's MOST COMMON
# (channel TL, pan) combination; the converter adds Cxx only for notes at any other level.
sample_list:
  # --- percussion ---
  - [1,  "kick.raw",        64, 0]
  - [2,  "snare.raw",       64, 0]
  # --- voice $00: deep bass (FM2 opening) ---
  - [3,  "ghz_v00.raw",     32, 0]
  # --- voice $01: bass/rhythm pad (FM2 main loop) ---
  - [4,  "ghz_v01.raw",     32, 0]
  # --- voice $02: bright lead (FM1 intro, FM3 opening) ---
  - [5,  "ghz_v02.raw",     26, 0] # VGZ: -1.9 dB at 21
  # --- voice $04: bell arp (FM4/FM5 ending section) ---
  - [6,  "ghz_v04.raw",      13, 0] # VGZ: -3.1 dB at 9
  - [8,  "ghz_v04.raw",     20, 1] # Same sample, finetune +1 (~+12.5 cents).; VGZ: -2.5 dB at 15
  # --- voice $05: main melody (FM1/FM3/FM4/FM5) ---
  - [10, "ghz_v05.raw",     29, 0] # VGZ: -2.8 dB at 21
  - [11, "ghz_v05_lo.raw",   10, 0] # VGZ: -2.8 dB at 7
  # --- voice $06: FM1 melodic fills (smpsAlterPitch sections) ---
  - [12, "ghz_v06.raw",     54, 0] # VGZ: -2.3 dB at 41
  # --- voice $07: bridge voice (FM1/FM3/FM4) ---
  - [13, "ghz_v07.raw",     24, 0] # VGZ: -4.2 dB at 15
  # --- voice $08: bright synth (FM3/FM4/FM5 main) ---
  - [14, "ghz_v08.raw",     21, 0] # VGZ: -2.3 dB at 16
  - [15, "ghz_v08_hi.raw",  32, 0] # VGZ: -2.4 dB at 24
  # --- PSG White Noise ---
  - [16, "psg_noise.raw",    4, 0] # VGZ: +6.0 dB at 7
  # --- PSG Voices ---
  - [17, "psg_tone01.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)
  - [18, "psg_tone03.raw",  16, 0]
  - [19, "psg_tone05.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)
  - [20, "psg_tone06.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)


# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare for GHZ only
# -------------------------------------------------------------------------------------------------
dac_samples:
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # $00 → deep bass
  0:
    - low:  C2
      high: B4
      mod_instrument: 3
      root: C2

  # $01 → bass/rhythm pad
  1:
    - low:  C2
      high: B4
      mod_instrument: 4
      root: C2

  # $02 → bright lead
  2:
    - low:  C6
      high: B7
      mod_instrument: 5
      root: C2

  # $04 → bell arp
  4:
    - low:  C6
      high: E7
      mod_instrument: 6
      root: C2

  # $05 → main melody
  5:
    - low:  C4
      high: B5
      mod_instrument: 11
      root: C2
    - low:  C6
      high: B7
      mod_instrument: 10
      root: C2

  # $06 → FM1 fills
  6:
    - low:  C6
      high: B7
      mod_instrument: 12
      root: C2

  # $07 → bridge
  7:
    - low:  C5
      high: B5
      mod_instrument: 13
      root: C2
  # $08 → bright synth
  8:
    - low:  C5
      high: B5
      mod_instrument: 14
      root: C2
    - low:  C6
      high: B6
      mod_instrument: 15
      root: C2


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 16
    root: A3               # target_rate ≈ 27928 Hz

psg_voice_map:
  fTone_01:
    mod_instrument: 17
    root: A2
  fTone_03:
    mod_instrument: 18
    root: A2
  fTone_05:
    mod_instrument: 19
    root: A2
  fTone_06:
    mod_instrument: 20
    low: A6
    root: A2


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 applies smpsAlterNote $02 (FNUM offset ≈ +10 cents) during voice $04
# bell-arp sections to create the chorus detune effect vs FM4.  The same
# source notes route to inst 8/9 (identical audio to inst 6/7, finetune +1).
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    4:                        # voice $04 on FM5 (bell arp, detuned)
      - low:  C6              # bottom of FM5 arp range
        high: B7              # top
        root: C2
        mod_instrument: 8    # same audio as inst 6, finetune +1


# -------------------------------------------------------------------------------------------------
# Structural pattern break: GHZ intro fills rows 0-31 of pattern 0; the loop begins at row 32.
# A Bxx at row 31 jumps cleanly to pattern 1 instead of playing 32 rows of silence.
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 31


# -------------------------------------------------------------------------------------------------
# Amiga build (convert.py --merged): 9 channels -> 4.
#   FM5+FM4: FM4 sounds with FM5 on every one of its 132 notes - the early chords (bars 0-46) are
#   unison, unison-detuned, a third and a fourth (4 composites, 108 chords); from bar 47 FM4 drops
#   below FM5 at seven rarer intervals (7 composites, 24 chords).  32 FM5 re-attacks under a held
#   FM4 note re-attack the chord.  FM3 is the chord's top note (B over E+G): it starts its grace
#   note one tick after FM4/FM5, which merge_tolerance folds; its other notes play alone where
#   FM5 rests and are lost where it sounds.  PSG1/PSG2 are a pair of their own (59 of 75
#   together) that a fifth channel could carry.
#   DAC+PSG3: the hi-hat (262 hits, its 4-event loop replayed) rides the drums: 169 on a hit as
#   kick+hat / snare+hat, 29 over silence, 64 over a drum's decay, which they cut (cut_primary)
#   as on any 4-channel Amiga.
# tools/merge_survey.py has every pair's counts.
# -------------------------------------------------------------------------------------------------
# The song-wide groups below are superseded by the per-pattern `merge_patterns:` section at
# the end of this file (written by tools/fold_csv.py from input/02_ghz_fold.csv) and are kept
# commented out as the record of the first 4-channel fold.
# merge:
#   - primary: DAC
#     followers: [PSG3]
#     cut_primary: true
#   - primary: FM5
#     followers: [FM4, FM3]
#     max_composites: 8     # the 8 most-played chord shapes; 15 rarer chords play FM5 alone
#   # The chime lines double the bass rhythm: PSG2 starts with a bass note on 107 of its 113
#   # notes, PSG1 on 72 of 75 (tools/merge_survey.py --all), so they ride the bass channel as
#   # bass+chime mixes (the 12 most-played combinations; the rest play the bass alone).  A fill
#   # pool cannot place them: with merge_fill: [PSG1, PSG2] and merge_fill_cut_after {DAC: 2, FM2: 4}
#   # only 30 of 188 found a silent channel, because every one of the others starts exactly on a
#   # drum and a bass note-on.
#   - primary: FM2
#     followers: [PSG2, PSG1]
#     max_composites: 8     # 18 slots are free for composites: 2 drum mixes, 8 chords, 8 of these
#     fill_cut: true        # PSG1's 24-tick chime rings are cut by the next bass note when folded; wherever
#                           # a channel is silent for the whole ring (the lead's, which rests through
#                           # patterns 2-4) the chime plays there in full instead


# Slots the composite fit leaves free for the drum groups' sample banks (bank: true below): the
# kick/snare + bass + hat mixes need three 64 KB banks; a member dropped for lack of a bank slot
# is reported ("no slot left for another bank").
merge_bank_slots: 3

# >>> merge_patterns - written by tools/fold_csv.py from input/02_ghz_fold.csv; the config is the source of truth: edit it here, or re-run --write to replace the block from the table
# DAC = DAC Drums, FM1 = Lead, FM2 = Bass, PSG3 = Hi-Hat
merge_patterns:
  - patterns: "0"          # keep FM1, FM2, FM3
    drop: [FM4, FM5, PSG1, PSG2]
    groups:
      - primary: DAC
        followers: [PSG3]
        cut_primary: true
        bank: true
        mix_note: C3
  - patterns: "1-4"          # keep FM1, PSG2
    groups:
      - primary: DAC
        followers: [FM2, PSG3]
        cut_primary: true
        bank: true
        mix_note: C3
      - primary: FM5
        followers: [FM3, FM4, PSG1]
  - patterns: "5-c"          # keep FM1, FM3
    groups:
      - primary: DAC
        followers: [FM2, PSG3]
        cut_primary: true
        bank: true
        mix_note: C3
      - primary: FM4
        followers: [FM5]
      - primary: PSG1
        followers: [PSG2]
  - patterns: "d-10"          # keep FM1, FM2, FM5
    groups:
      - primary: DAC
        followers: [PSG3]
        cut_primary: true
        bank: true
        mix_note: C3
      - primary: FM4
        followers: [FM3]
      - primary: PSG2
        followers: [PSG1]
# <<< merge_patterns
