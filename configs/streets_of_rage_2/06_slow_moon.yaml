  - [12, "fm_v02_A2.raw", 9, 0]   # VGZ: -4.7 dB at 5
  - [13, "fm_v02_G3.raw", 10, 0]   # VGZ: -3.3 dB at 7
  - [15, "fm_v03_Bb3.raw", 15, 0]   # VGZ: +2.2 dB at 19
  - [16, "fm_v03_C5.raw", 14, 0]   # VGZ: +1.1 dB at 16
