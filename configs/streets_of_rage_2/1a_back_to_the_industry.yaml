# Streets of Rage 2 - Back to the Industry.  A minimal config: everything else is derived from the ROM
# (docs/todo/done/streets_of_rage_2.md); python convert.py <this> --show-config prints it.
name: "Back to the Industry"
input_file: "input/roms/Streets of Rage 2 (USA).md"
rom_song: "$1A"
window_root: highest      # each window's root as high as its range and the 64 K limit allow: the most rate

sample_list:   # volumes set from the VGZ; the rest is derived
  - [1, "dac81.raw", 52, 5]   # VGZ: +1.8 dB at 64
  - [2, "dac82.raw", 51, -2]   # VGZ: +2.0 dB at 64
  - [4, "fm_v00_F3.raw", 43, 0]   # VGZ: -1.1 dB at 38
  - [5, "fm_v01_A1.raw", 25, 0]   # VGZ: +2.2 dB at 32
  - [8, "fm_v01_G4.raw", 14, 0]   # VGZ: +1.4 dB at 16
  - [9, "fm_v01_F5.raw", 13, 0]   # VGZ: +1.7 dB at 16
  - [10, "fm_v01_E6.raw", 13, 0]   # VGZ: +1.9 dB at 16
  - [11, "fm_v02_C7.raw", 25, 0]   # VGZ: -2.3 dB at 19
  - [12, "fm_v03_C7.raw", 26, 0]   # VGZ: -2.7 dB at 19
  - [14, "fm_v05_F2.raw", 11, 0]   # VGZ: -2.9 dB at 8
  - [15, "fm_v05_E3.raw", 12, 0]   # VGZ: -3.5 dB at 8
  - [16, "psg_$00_A4.raw", 2, 0]   # VGZ: +1.9 dB at 3
