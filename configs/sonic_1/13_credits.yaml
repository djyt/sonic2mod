  - [12, "fm_v0a_lo.raw", 27, 0]   # $0A, $1C  D4-C6   # VGZ: -0.4 dB at 25
  - [13, "fm_v0b_lo.raw", 23, 0]   # $0B  G3-E5; VGZ: +8.7 dB at 64
