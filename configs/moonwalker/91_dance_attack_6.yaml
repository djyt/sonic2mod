# Michael Jackson's Moonwalker - Dance Attack 6.  A minimal config: everything else is derived from the ROM
# (docs/todo/binary_import.md 2.8); python convert.py <this> --show-config prints it.
name: "Dance Attack 6"
input_file: "input/roms/Michael Jackson's Moonwalker (World) (Rev A).md"
rom_song: "$91"

sample_list:   # volumes set from the VGZ; the rest is derived
  - [4, "fm_v00_Cs4.raw", 51, 0]   # VGZ: -8.5 dB at 19
  - [6, "fm_v02_Cs2.raw", 14, 0]   # VGZ: -2.6 dB at 10
  - [9, "psg_noise_e7.raw", 5, 0]   # VGZ: +6.4 dB at 10
