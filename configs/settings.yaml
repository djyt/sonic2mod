# -------------------------------------------------------------------------------------------------
# Global sonic2mod settings
# These apply across all songs unless overridden.
# -------------------------------------------------------------------------------------------------

fm_synthesis:
  enabled: true             # Set true to auto-generate FM samples via YM2612 emulation
  mode: ym2612              # Chip mode: "ym2612" (MD1/MD2 VA2) or "ym3438" (accurate)
  clock_rate: 7670454       # Mega Drive NTSC YM2612 master clock (Hz)
  amiga_clock: 3546895      # PAL Amiga clock for MOD target-rate calculation
  sustain_duration: auto    # Seconds every note is held before key-off; or 'auto': each instrument
  release_padding: 0.5      # Seconds of audio captured after key-off (for release tail)
  threads: normal           # FM instruments render in parallel, one per thread: 
                            # "normal" = CPU cores - 1
                            # "max"    = every core, 
                            # 1        = one at a time, or a number.  

psg_synthesis:
  enabled: true             # Set true to auto-generate PSG samples via SN76489 emulation
  clock_rate: 3579545       # SN76489 NTSC Mega Drive clock (Hz)
  amiga_clock: 3546895      # PAL Amiga clock for MOD target-rate calculation
  sustain_duration: auto    # Seconds of tone held before key-off; or 'auto': per instrument, as FM
  release_padding: 0.2      # Seconds of silence/release after key-off

max_sample_kb: 64           # Maximum Sample Length: 64 = Amiga ProTracker | 128 = Modern Trackers

# Sustain loops (core/loops.py).  A synthesised sample otherwise holds the longest note its instrument
# plays.  With loops, an instrument whose envelope settles (the YM2612 voice at its sustain level, a PSG
# envelope holding) is cut where it settles plus one loop of the waveform (the best-matching length up to
# 1.2 s, crossfaded closed), so its size no longer depends on the notes, and every FM note ends with a
# volume slide at the voice's release rate (A0y per row) instead of a C00 - the chip's release phase.
# A voice that keeps decaying keeps its plain render.
#   off      never
#   merged   the --merged (Amiga) build only; the reference MOD stays as it was   (default)
#   all      every build
sustain_loops: merged
# How far (dB) a loop may freeze the level above where the instrument's longest note would have decayed
# to: 1 loops only voices that truly settle; 3-6 also loops slowly decaying voices, which then hold their
# level through long notes (Green Hill merged without its chime mixes: 1 dB = 184 KB of samples,
# 6 dB = 178 KB, 12 dB = 140 KB; unlooped 253 KB).
loop_drift_db: 1

# -------------------------------------------------------------------------------------------------
# Conversion flags (applied regardless of synthesis settings)
# -------------------------------------------------------------------------------------------------

# How FM channel levels (smpsHeaderFM volume, smpsAlterVol, smpsPan) reach the MOD:
#   baked  For each instrument, the level most of its notes play at needs no command: that is what
#          its sample_list volume stands for.  Notes at any other level get Cxx = volume x 10^(dB/20)
#          using the chip's 0.75 dB per TL step, so Cxx appears only on the minority channel of a
#          shared instrument and where smpsAlterVol moves a channel.  No extra samples.  (default)
#   true   Legacy: header TL + log law as an absolute volume, Cxx on every FM note.
#   false  Legacy: header TL ignored, one smpsAlterVol step = one linear volume unit (not accurate).
fm_volume_scaling: baked

# baked mode only: a hard-panned (smpsPan left/right) note is this many dB quieter than a centred one.
# A centred YM2612 channel drives both speakers, every Amiga channel drives one.  0 disables.
fm_pan_law_db: 3

# How a legato note (smpsNoAttack: the driver changes the frequency without a key-on) is written when its
# target cannot ride the sample that is sounding.  A MOD tone portamento (3FF) never re-triggers and, in FT2
# clone and ProTracker, never changes the playing sample either.
#   strict   A target in another range of the voice (another instrument, its sample rendered for another
#            octave) is written on the sounding instrument, its MOD note moved by the chip-pitch delta; after
#            an smpsSetvoice, or with nothing sounding on the channel yet, the note is re-triggered.
#   loose    Always a 3FF on the target's own instrument, as the conversion wrote it before 2026-09-28.  Right
#            only in a player that swaps the sample on an instrument number (OpenMPT); in FT2 clone Green Hill's
#            FM3 grace note came out an octave up, its loop label rode a decayed note, and Drowning's FM3 trill
#            (no-attack from its first note) never started.
#   retrigger  Every no-attack note is a plain note-on, as the conversion wrote it before commit 030ca81: a
#            grace note bending into a chord is heard as two attacks, but a legato onto a note that has been
#            sounding for seconds is not left riding the sample's decayed tail (Green Hill FM1, pattern 14 row 52:
#            the hardware plays that C at the level of a fresh note, a 3FF there is 26 dB down).  (default)
legato: retrigger


# PSG counterpart of fm_volume_scaling (SN76489 attenuation: smpsHeaderPSG volume + smpsPSGAlterVol, 2 dB/step):
#   baked     For each PSG instrument the attenuation most of its notes play at needs no command and is
#             what its sample_list volume stands for; other notes get Cxx on the 2 dB/step law.  Frees
#             the effect column on most PSG notes for vibrato / note cut.  (default)
#   absolute  Legacy: volume = 64 x 10^(-2 x att / 20) x sample volume / 64, a Cxx on nearly every PSG note.
psg_volume_scaling: baked
