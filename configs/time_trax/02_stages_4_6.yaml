  - [8, "fm_v13_A1.raw", 35, 0]   # VGZ: -2.5 dB at 29
  - [10, "fm_v18_E0.raw", 30, 0]   # VGZ: -2.7 dB at 25
  - [11, "fm_v18_F2.raw", 49, 0]   # VGZ: -3.1 dB at 38
  - [13, "fm_v1a_F2.raw", 58, 0]   # VGZ: -3.2 dB at 45
