# Generated by analyze.py — fill in root/synth_root values
# Song: Mus83 - MZ.asm

name: Marble Zone
input_file: sonic_1\music\Mus83 - MZ.asm
output_file: output/marble_zone.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 2
num_mod_channels: 8
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG3
    mod_channel: 7

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 64, 0]
  - [2, "snare.raw", 64, 0]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 4 — FM1, FM3 ---
  - [3, "fm_v00.raw", 32, 0]
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [4, "fm_v01.raw", 32, 0]
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM4, FM5 ---
  - [5, "fm_v02.raw", 32, 0]
  # --- voice $03: alg 3: ((1→2)+3)→4, fb 4 — FM4 ---
  - [6, "fm_v03.raw", 32, 0]
  # --- voice $04: alg 2: (1+(2→3))→4, fb 0 — FM5 ---
  - [7, "fm_v04.raw", 32, 0]
  # --- PSG noise (form $E7) ---
  - [11, "psg_noise.raw", 16, 0]
  # --- PSG tone fTone_08 ---
  - [8, "psg_fTone_08_lo.raw", 32, 0]
  - [9, "psg_fTone_08_hi.raw", 32, 0]
  # --- PSG noise (fTone_09 envelope) ---
  - [10, "psg_noise.raw", 16, 0]

dac_samples:
  # dKick: ×2 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  # dSnare: ×1 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3

voice_map:
  # $00 — alg 2: (1+(2→3))→4, fb 4 — used by FM1, FM3
  0:
    - low:  A5
      high: B6
      mod_instrument: 3
      root: A2
      synth_root: A5
  # $01 — alg 2: (1+(2→3))→4, fb 7 — used by FM2
  1:
    - low:  E3
      high: B4
      mod_instrument: 4
      root: E2
      synth_root: E3
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM4, FM5
  2:
    - low:  D6
      high: E7
      mod_instrument: 5
      root: D2
      synth_root: D6
  # $03 — alg 3: ((1→2)+3)→4, fb 4 — used by FM4
  3:
    - low:  E4
      high: E5
      mod_instrument: 6
      root: E2
      synth_root: E4
  # $04 — alg 2: (1+(2→3))→4, fb 0 — used by FM5
  4:
    - low:  E3
      high: E4
      mod_instrument: 7
      root: E2
      synth_root: E3

psg_map:
  0xE7:                    # form $E7
    mod_instrument: 11
    root: A3
    noise_rate: 3
    envelope: fTone_04
    base_volume: 0

psg_voice_map:
  fTone_08:
    - low:  F5
      high: B6
      mod_instrument: 8
      root: F2
      synth_root: F5
    - low:  C7
      high: F7
      mod_instrument: 9
      root: C2
      synth_root: C7
  fTone_09:
    type: white_noise
    noise_rate: 0
    mod_instrument: 10
    root: A3
