# Golden Axe - Theme of Thief.  A minimal config: everything else is derived from the ROM
# (docs/todo/binary_import.md 3.6); python convert.py <this> --show-config prints it.
name: "Theme of Thief"
input_file: "input/roms/Golden Axe (World) (Rev A).md"
rom_song: "$8B"

sample_list:   # volumes set from the VGZ; the rest is derived
  - [5, "drum8C.raw", 41, 0]   # VGZ: -0.1 dB at 64
  - [7, "fm_v00_G4.raw", 39, 0]   # VGZ: +0.4 dB at 64
  - [8, "fm_v00_G5.raw", 38, 0]   # VGZ: +0.6 dB at 64
  - [10, "fm_v01_G3.raw", 42, 0]   # VGZ: -0.2 dB at 64
  - [11, "fm_v01_G4.raw", 45, 0]   # VGZ: -0.7 dB at 64
