# Golden Axe - Game Over.  A minimal config: everything else is derived from the ROM
# (docs/todo/binary_import.md 3.6); python convert.py <this> --show-config prints it.
name: "Game Over"
input_file: "input/roms/Golden Axe (World) (Rev A).md"
rom_song: "$88"

variants:
  hq:                    # no window wider than 1 semitone: the narrowest that fits 31 slots unmerged
    name: "Game Over HQ"
    max_window: 1
    sample_list:              # the hq windows' own, measured on the hq build
      - [1, "fm_v00_C5.raw", 64, 0]   # VGZ: +0.0 dB at 64
      - [2, "fm_v00_D5.raw", 64, 0]   # VGZ: -0.1 dB at 64
      - [3, "fm_v00_E5.raw", 55, 0]   # VGZ: +1.3 dB at 64
      - [4, "fm_v00_Fs5.raw", 64, 0]   # VGZ: +0.1 dB at 64
      - [5, "fm_v00_Ab5.raw", 56, 0]   # VGZ: +1.2 dB at 64
      - [6, "fm_v01_F3.raw", 64, 0]   # VGZ: -2.6 dB at 64
      - [7, "fm_v01_G3.raw", 64, 0]   # VGZ: -2.8 dB at 64
      - [8, "fm_v01_A3.raw", 64, 0]   # VGZ: -4.3 dB at 64
      - [9, "fm_v02_F2.raw", 64, 0]   # VGZ: -0.3 dB at 64
      - [10, "fm_v02_G2.raw", 64, 0]   # VGZ: -0.0 dB at 64
      - [11, "fm_v02_A2.raw", 64, 0]   # VGZ: +0.0 dB at 64
      - [12, "fm_v02_C3.raw", 64, 0]   # VGZ: -0.3 dB at 64
      - [13, "fm_v02_D3.raw", 64, 0]   # VGZ: -0.4 dB at 64
      - [14, "fm_v02_E3.raw", 64, 0]   # VGZ: -0.4 dB at 64
