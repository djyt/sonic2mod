# -------------------------------------------------------------------------------------------------
# TITLE SCREEN MUSIC Conversion Script
# -------------------------------------------------------------------------------------------------
name: "Title Screen"
input_file: "input/Mus8A - Title Screen.asm"
output_file: "output/01_title_screen.mod"
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3
ticks_per_row: 3
num_mod_channels: 8


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  - source: FM1
    mod_channel: 1

  - source: FM2
    mod_channel: 2

  - source: FM3
    mod_channel: 3

  - source: FM4
    mod_channel: 4

  # Detuned version of FM1
  - source: FM5
    mod_channel: 5

  # White Noise Channel
  - source: PSG3
    mod_channel: 6


# -------------------------------------------------------------------------------------------------
# Samples. FM samples auto-generated if fm_synthesis: true in settings.yaml
#          Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
#
# FM volumes bake in the smpsHeaderFM TL offsets (FM1 $0C, FM2 $09, FM3 $0D, FM4 $0C, FM5 $0E;
# 0.75 dB per step) relative to FM2, so no per-note Cxx is needed:  32 × 10^(−steps×0.75/20).
# FM3/FM4 end on voice $01 with smpsAlterVol −4/−3, which lands them exactly on FM2's $09, so
# instrument 5 serves all three at 32.  Verified against reference/vgz with tools/vgm_compare.py.
# -------------------------------------------------------------------------------------------------
sample_list:
  # --- percussion ---
  - [1, "kick.raw",          64, 0]
  - [2, "snare.raw",         64, 0]
  # --- voice $00: bright lead synth (FM1, TL $0C = 3 steps / −2.25 dB below FM2) ---
  - [3, "fm_voice0.raw",     25, 0]
  # --- voice $00 FM5 variant: TL $0E (−3.75 dB); smpsAlterNote $03 ≈ +5..8 cents → finetune +1 ---
  - [4, "fm_voice0.raw",     21, 1]
  # --- voice $01: bass / sustain pad (FM2 $09; FM3/FM4 ending chord also at $09) ---
  - [5, "fm_voice1.raw",     32, 0]
  # --- voice $02: harmony chord stabs (FM3 $0D / FM4 $0C ≈ 3.5 steps / −2.6 dB below FM2) ---
  - [6, "fm_voice2.raw",     24, 0]
  # --- PSG white noise: the VGM reference puts the hiss ~10 dB below where 48 landed it ---
  - [7, "psg_noise.raw",     16, 0]
  # --- voice $01 FM3 ending variant: smpsAlterNote $03 detune (+5 cents) → finetune +1, so the
  #     FM2/FM3/FM4 unison chord beats instead of summing in phase ---
  - [8, "fm_voice1.raw",     32, 1]


# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare only
# -------------------------------------------------------------------------------------------------
dac_samples:
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # Voice $00 — bright lead synth (FM1 + FM5)
  0:
    - low:  G5
      high: A6
      mod_instrument: 3
      root: G2
      synth_root: G4

  # Voice $01 — bass / sustain pad
  1:
    - low:  A2            # source 33 — FM2 low notes + FM4 ending bass
      high: D4            # source 35
      mod_instrument: 5   # fm_voice1_lo.raw (root A1)
      root: A1
      synth_root: A1

  # Voice $02 — harmony chord stabs (FM3/FM4 main melody only)
  2:
    - low:  A5            # source 69 — bottom of FM4's range
      high: G6            # source 79 — top of FM3's range
      mod_instrument: 6   # fm_voice2.raw (root A2)
      root: A2            # A5→A2 (MOD 21);  G6→G3 (MOD 31)
      synth_root: A4


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # form $E7 — white noise, LFSR clocked by PSG3's own tone register $C0 (rate 3)
    mod_instrument: 7
    root: A3               # target_rate ≈ 27928 Hz → 14 kHz bandwidth keeps most of the hiss
    noise_rate: 3
    tone2_n: 1             # nMaxPSG → PSGFrequencies[69] = 223721 Hz → N=0; the VDP PSG clocks N=0 as
                           # N=1 (112 kHz shift rate = near-white hiss).  The VGM confirms tone2 = 0.
    envelope: fTone_04     # Quick stepped fade (10 frames)
    base_volume: 0         # header volume $04 is applied by the converter as Cxx; keep 0 here
    
    
# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 shares FM1's data. smpsAlterNote $03 is a raw FNUM offset (~12.5 cents).
# Approximate hardware effect by fine-tuning a version of the sample.
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    0:
      - low:  G5
        high: A6
        mod_instrument: 4
        root: G2
        synth_root: G4
  # FM3's closing nA2 carries smpsAlterNote $03 too — same trick, voice $01
  FM3:
    1:
      - low:  A2
        high: D4
        mod_instrument: 8
        root: A1
        synth_root: A1

    
# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 15