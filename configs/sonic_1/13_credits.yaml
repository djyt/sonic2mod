  - [31, "psg_noise.raw", 3, 0] # VGZ: +5.9 dB at 6

dac_samples:
  # dKick: ~7776 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → B1 ft -1 (-1 c)
  - name: dKick
    mod_instrument: 1
    mod_note: B1
  # dSnare: ~22552 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → F3 ft +2 (-5 c)
  - name: dSnare
    mod_instrument: 2
    mod_note: F3
  # dHiTimpani: ~9136 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → D2 ft -1 (+20 c)
  - name: dHiTimpani
    mod_instrument: 3
    mod_note: D2
  # dMidTimpani: ~8268 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → C2 ft -1 (-9 c)
  - name: dMidTimpani
    mod_instrument: 3
    mod_note: C2

