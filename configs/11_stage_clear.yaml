# -------------------------------------------------------------------------------------------------
# STAGE CLEAR Conversion Script
# -------------------------------------------------------------------------------------------------
name: Stage Clear
input_file: "input/Mus8E - Sonic Got Through.asm"
output_file: output/11_stage_clear.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 1
region: ntsc
range_space: chip          # ranges are the pitches the chip plays (tools/config_to_chip_space.py)

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 57, 2] # VGZ: +1.0 dB at 64
  - [2, "kick.raw", 57, -1] # VGZ: +1.0 dB at 64
  - [3, "timpani.raw", 57, -1] # VGZ: +1.0 dB at 64
  # --- voice $00: Alg 5, FB 7 — FM1 ---
  - [4, "fm_v00_lo.raw", 27, 0] # VGZ: +1.0 dB at 31
  - [5, "fm_v00_hi.raw", 26, 0] # VGZ: +1.7 dB at 31
  # --- voice $01: Alg 2, FB 7 — FM2 ---
  - [6, "fm_v01.raw", 35, 0] # VGZ: -2.8 dB at 25
  # --- voice $02: Alg 5, FB 7 — FM3, FM4 ---
  - [7, "fm_v02.raw", 14, 0] # VGZ: -2.8 dB at 10
  # --- voice $03: Alg 5, FB 7 — FM5 ---
  - [8, "fm_v03.raw", 20, 0] # VGZ: -2.6 dB at 15
  # --- PSG tone fTone_05 ---
  - [9, "psg_fTone_05_lo.raw",  5, 0] # baked: 32 at PSG attenuation 5 (−10 dB); VGZ: -1.4 dB at 4
  - [10, "psg_fTone_05_hi.raw",  3, 0] # baked: 32 at PSG attenuation 5 (−10 dB); VGZ: +4.0 dB at 5

dac_samples:
  # dSnare: ×7 — ~22538 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → F3 ft +2 (-4 c)
  - name: dSnare
    mod_instrument: 1
    mod_note: F3
  # dKick: ×4 — ~7771 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → B1 ft -1 (+1 c)
  - name: dKick
    mod_instrument: 2
    mod_note: B1
  # dVLowTimpani: ×4 — ~6592 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → Gs1 ft -1 (-12 c)
  - name: dVLowTimpani
    mod_instrument: 3
    mod_note: Gs1
  # dHiTimpani: ×2 — ~9130 Hz on hardware (the cycle count less this song's 5.2 % per-frame stall) → D2 ft -1 (+21 c)
  - name: dHiTimpani
    mod_instrument: 3
    mod_note: D2

voice_map:
  0:
    - low:  G3   # was G4-B5 (source bytes) for FM1
      high: G4
      mod_instrument: 4
      root: G2
    - low:  G5   # was C6-C7 (source bytes) for FM1
      high: C6
      mod_instrument: 5
      root: G2
  1:
    - low:  G1   # was G4-G5 (source bytes) for FM2
      high: G2
      mod_instrument: 6
      root: G2
  2:
    - low:  A4   # was A5-D6 (source bytes) for FM4, FM3
      high: D5
      mod_instrument: 7
      root: A2
  3:
    - low:  G4   # was G5-C6 (source bytes) for FM5
      high: C5
      mod_instrument: 8
      root: G2
psg_voice_map:
  fTone_05:
    - low:  G3   # was G4-B5 (source bytes) for PSG1
      high: G4
      mod_instrument: 9
      root: G1
    - low:  G5   # was G4-B5 (source bytes) for PSG2
      high: B5
      mod_instrument: 9
      root: G3
    - low:  G5   # was C6-C7 (source bytes) for PSG1, PSG2
      high: C6
      mod_instrument: 10
      root: G1

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version (convert.py --merged)
# DAC · lead (FM1+PSG1) · bass + stabs (FM2+FM3+FM4) · harmony (FM5+PSG2): every fold clean
# (tools/merge_survey.py), no note lost or cut.  The drums stay on their own channel.
# -------------------------------------------------------------------------------------------------
merge:
  # Lead: PSG1 plays FM1's data an octave down
  - primary: FM1
    followers: [PSG1]
    loop_mix: true           # the held A6 loops where lead + PSG settle: 64 KB unlooped (and 0.86 s short) → 19 KB

  # Bass hits with the chord stabs on top: chip composites (FM3 left, FM4 right, their fills kept)
  - primary: FM2
    followers: [FM3, FM4]

  # Harmony: PSG2 plays FM5's data.  PSG2 rides FM5's vibrato
  - primary: FM5
    followers: [PSG2]
    loop_mix: true           # the held B5: 64 KB unlooped → 6 KB.  (mix_at: primary unrolls the looped PSG
                             # under the FM loop: 40 KB)
