# Generated by analyze.py — fill in root values (synth_root is derived from the song)
# Song: Mus90 - Continue Screen.asm

name: Continue Screen
input_file: "input/sonic_1/Mus90 - Continue Screen.asm"
output_file: output/sonic_1/18_continue_screen.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 5            # 214.29 BPM, written 214 (0.13 % slow, ~12 ms by the end of a song played once):
                           # at mod 7 a 3-tick row is 3.5 frames, and speed 7 (exact) would be 300 BPM
ticks_per_row: 3           # a beat ($0C) 4 rows, a bar 16, a pattern four bars.  6 ticks a row at speed 7 is exact
                           # (150 BPM, a MOD tick a frame) but a beat only 2 rows
region: ntsc
range_space: chip          # ranges are the pitches the chip plays (tools/config_to_chip_space.py)

# Variant lofi (convert.py --variant lofi --merged -> output/sonic_1/18_continue_screen_lofi_merged.mod): the merged
# build 107 -> 33 KB.  The bass and the lead on sliding loops (both fall for as long as a note holds and
# looped only at the end of their 2.4 s / 0.9 s renders), the lead's loop past its attack peak; the chord
# composites loop where they settle to within 12 dB.  The drums as they are.  Left out: the chords at 6 dB
# (+20.6 KB), the bass at root A1 (-0.7 KB for its treble)
variants:
  lofi:
    name: "Continue Screen lofi"

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 64, 1]
  - [2, "snare.raw", 57, -4] # VGZ: +1.0 dB at 64
  # --- voice $00: alg 2: (1+(2→3))→4, fb 7 — FM1 ---
  - [3, "fm_v00.raw", 32, 0]
  # --- voice $01: alg 3: ((1→2)+3)→4, fb 7 — FM2 ---
  - [4, "fm_v01.raw", 26, 0] # VGZ: +1.7 dB at 32
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [5, "fm_v02.raw", 32, 0]
  # --- voice $03: alg 4: (1→2)+(3→4), fb 3 — FM3, FM4 ---
  - [6, "fm_v03.raw", 19, 0] # VGZ: +4.3 dB at 32

dac_samples:
  # dKick: ×16 — ~7886 Hz on hardware (the cycle count less this song's 3.8 % per-frame stall) → B1 ft +1 (+0 c)
  - name: dKick
    mod_instrument: 1
    mod_note: B1
  # dSnare: ×15 — ~22869 Hz on hardware (the cycle count less this song's 3.8 % per-frame stall) → Fs3 ft -4 (-4 c)
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3

voice_map:
  0:
    - low:  As3   # was As5-F6 (source bytes) for FM1
      high: Es4
      mod_instrument: 3
      root: C3
      variants:
        lofi:
          loop_decay: slide  # 19.9 -> 3.0 KB; the lead 0.2 dB from the VGZ's balance
          loop_drift_db: 2
          loop_start_ms: 80  # past the attack peak (byte 896): from 572 the loop replayed the swell, 4.7 dB
  1:
    - low:  Fs2   # was G5-A5 (source bytes) for FM2
      high: A2
      mod_instrument: 4
      root: Fs2
  2:
    - low:  E2   # was E4-Fs5 (source bytes) for FM2
      high: E3
      mod_instrument: 5
      root: E2
      variants:
        lofi:
          loop_decay: slide  # 28.6 -> 1.4 KB, the bass column's onsets as before
          loop_drift_db: 2
  3:
    - low:  A4   # was A5-G6 (source bytes) for FM4, FM3
      high: G5
      mod_instrument: 6
      root: A2

# -------------------------------------------------------------------------------------------------
# Structural pattern breaks to align to grid
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 15

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version (convert.py --merged)
# DAC · lead (FM1) · bass (FM2) · chords (FM3+FM4): the one fold is clean (tools/merge_survey.py)
# -------------------------------------------------------------------------------------------------
merge:
  # FM4 plays the chord's lower note in FM3's rhythm, voice $03 both
  - primary: FM3
    followers: [FM4]
    variants:
      lofi:
        loop_drift_db: 12    # the 1.5 s chords loop 0.35 s in (34 -> 9.4 KB); the column +0.2 dB against the VGZ
