# -------------------------------------------------------------------------------------------------
# INVINCIBILITY Conversion Script
# -------------------------------------------------------------------------------------------------
name: Invincibility
input_file: "input/Mus87 - Invincibility.asm"
output_file: output/14_invincibility.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 4
ticks_per_row: 3            # every 192-tick phrase fills one 64-row pattern (the loop is 3); the $04
                            # notes (FM1/FM5 run, DAC rolls) are triplets on this grid and take EDx
region: ntsc
range_space: chip          # ranges are the pitches the chip plays (tools/config_to_chip_space.py)

# Variant lofi (convert.py --variant lofi --merged -> output/14_invincibility_lofi_merged.mod): the merged
# build 45 -> 31 KB.  The hat at A2 (14 kHz) and the bass looped where it settles; the snare and kick
# keep their own rates.  Left out: loop_drift_db 12 song-wide (the chord composites grow 3.9 KB and lose
# onsets), the bass at D1 (-0.3 KB for 1.7 dB of its treble), merge_max_synth_shift 0 (+0.4 KB).
variants:
  lofi:
    name: "Invincibility lofi"

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  # Detuned version of FM1
  - source: FM5
    mod_channel: 5
  - source: PSG3
    mod_channel: 6

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 57, 4] # VGZ: +1.0 dB at 64
  - [2, "kick.raw", 64, 0]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 7 — FM1, FM3, FM4, FM5 ---
  - [3, "fm_v00.raw", 17, 0] # VGZ: +0.9 dB at 19
  - [4, "fm_v00_fm5.raw", 19, 0] # VGZ: +4.5 dB at 32
  - [7, "fm_v00_fm1.raw", 19, 0] # VGZ: -0.1 dB at 19
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [5, "fm_v01.raw", 35, 0] # VGZ: -0.8 dB at 32
  # --- PSG noise (form $E7) ---
  - [6, "psg_noise.raw",  3, 0] # baked: 16 at PSG attenuation 3 (−6 dB); VGZ: +5.8 dB at 6

dac_samples:
  # dSnare: ×42 — ~22776 Hz on hardware (the cycle count less this song's 4.2 % per-frame stall) → F3 ft +4 (+3 c)
  - name: dSnare
    mod_instrument: 1
    mod_note: F3
  # dKick: ×23 — ~7853 Hz on hardware (the cycle count less this song's 4.2 % per-frame stall) → B1 (-5 c)
  - name: dKick
    mod_instrument: 2
    mod_note: B1

voice_map:
  0:
    - low:  G3   # was G5-Cs7 (source bytes) for FM3, FM4, FM1, FM5
      high: Cs6
      mod_instrument: 3
      root: C1
  1:
    - low:  G1   # was G2-D4 (source bytes) for FM2
      high: D3
      mod_instrument: 5
      root: G1
      variants:
        lofi:
          loop_drift_db: 12  # loops 0.13 s in instead of playing 0.54 s unlooped (7.5 -> 1.2 KB); the
                             # bass column 0.7 dB louder against the VGZ
psg_map:
  0xE7:                    # form $E7
    mod_instrument: 6
    root: A3
    variants:
      lofi:
        root: A2           # 14 kHz: the hat's treble above 7 kHz gone, and the drum + hat mixes are made at
                           # the snare's 22 kHz instead of the hat's 28 (-8.4 KB with the solo hats' sample)
    
# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 shares FM1's data. smpsAlterNote $03 is a raw FNUM offset (+5..8 cents).
# Its own instrument is rendered at that offset (core/plan/detune.py).
# FM1 has its own instrument too: on inst 3 (baked at FM3/FM4's level) every note of the fast run
# carried a Cxx, which took the slot its EDx delay needs, and the run snapped to the rows (+28 ms).
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM1:
    0:
    - low:  G4
      high: Cs6
      mod_instrument: 7
      root: G1
  FM5:
    0:
    - low:  G4   # was G5-Cs7 (source bytes) for FM5
      high: Cs6
      mod_instrument: 4
      root: G1

# -------------------------------------------------------------------------------------------------
# Structural pattern breaks to align to grid
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 15

# -------------------------------------------------------------------------------------------------
# Merged 4-Channel Version (convert.py --merged)
# drums (DAC+PSG3) · lead (FM1+FM5) · bass (FM2) · chords (FM3+FM4) → 4-channel M.K.
# The two FM folds are clean (tools/merge_survey.py); the bass stays on its own channel.
# -------------------------------------------------------------------------------------------------
merge_twins: always            # the snare + short hat mix (4 notes) was the long-hat one cut earlier

merge:
  # Lead: FM5 plays FM1's data detuned (smpsAlterNote $03): one chip composite
  - primary: FM1
    followers: [FM5]

  # Chords: FM3 + FM4 in parallel, four chip composites
  - primary: FM3
    followers: [FM4]

  # Drums carry the hats: snares the long one (200 ms), kicks the short (50 ms).  Three hats start
  # over a drum's tail and cut it (cut_primary, 0 lost); four still ringing at the next hit are cut.
  - primary: DAC
    followers: [PSG3]
    cut_primary: true
    limit_db: 4              # the kick + hat peak (0.5 dB over) limited, not the mix turned down
