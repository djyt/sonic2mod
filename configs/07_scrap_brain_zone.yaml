# -------------------------------------------------------------------------------------------------
# SCRAP BRAIN ZONE Conversion Script
# -------------------------------------------------------------------------------------------------
name: Scrap Brain Zone
input_file: "input/Mus86 - SBZ.asm"
output_file: output/07_scrap_brain_zone.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 1
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7
  - source: PSG3
    mod_channel: 8

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 64, 0]
  - [2, "kick.raw", 64, 0]
  - [3, "timpani.raw", 64, 0]
  # --- voice $00: Alg 0, FB 1 — FM2, FM3 ---
  - [4, "fm_v00.raw", 20, 0] # VGZ: +4.3 dB at 32
  # --- voice $01: Alg 4, FB 5 — FM3 ---
  - [5, "fm_v01.raw", 19, 0] # VGZ: +2.9 dB at 26
  # --- voice $02: Alg 5, FB 7 — FM1, FM4, FM5 ---
  - [6, "fm_v02.raw", 13, 0] # VGZ: +7.8 dB at 32
  # --- voice $03: Alg 1, FB 5 — FM1, FM3 ---
  - [7, "fm_v03.raw", 22, 0] # VGZ: -2.8 dB at 16
  # --- voice $04: Alg 5, FB 7 — FM4, FM5 ---
  - [8, "fm_v04_lo.raw", 13, 0] # VGZ: +7.8 dB at 32
  - [9, "fm_v04_hi.raw", 15, 0] # VGZ: +6.8 dB at 32
  # --- voice $05: Alg 0, FB 6 — FM1, FM4 ---
  - [10, "fm_v05_lo.raw", 10, 0] # VGZ: +9.8 dB at 32
  - [11, "fm_v05_hi.raw", 32, 0]
  # --- voice $06: Alg 5, FB 7 — FM5 ---
  - [12, "fm_v06.raw", 14, 0] # VGZ: +8.1 dB at 36
  # --- PSG noise (form $E7, envelope fTone_04 from the song) ---
  - [17, "psg_noise.raw",  6, 0] # baked: 32 at PSG attenuation 3 (−6 dB); VGZ: -1.9 dB at 5
  # --- PSG tone $00 ---
  - [13, "psg_$00.raw",  9, 0] # baked: 32 at PSG attenuation 2 (−4 dB); VGZ: -0.5 dB at 8
  # --- PSG tone fTone_06 ---
  - [14, "psg_fTone_06.raw", 13, 0] # baked: 32 at PSG attenuation 3 (−6 dB); VGZ: +2.0 dB at 16
  # --- PSG tone fTone_05 ---
  - [15, "psg_fTone_05.raw",  7, 0] # baked: 32 at PSG attenuation 3 (−6 dB); VGZ: +7.5 dB at 16
  # --- PSG noise, fTone_08 envelope variant (psg_map 0xE7 envelopes) ---
  - [18, "psg_noise.raw",  3, 0] # baked: 32 at PSG attenuation 5 (−10 dB); VGZ: +10.7 dB at 10
  
  # Detuned Voice 2
  - [19, "fm_v02.raw",  4, 1] # VGZ: +8.9 dB at 12
  # Detuned Voice 1
  - [20, "fm_v00.raw", 15, 1] # VGZ: +4.2 dB at 24

dac_samples:
  # dSnare: ×82 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 1
    mod_note: Fs3
  # dKick: ×73 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 2
    mod_note: C2
  # dHiTimpani: ×38 — native ~9588 Hz → note Ds2
  - name: dHiTimpani
    mod_instrument: 3
    mod_note: Ds2
  # dMidTimpani: ×30 — native ~8850 Hz → note Cs2
  - name: dMidTimpani
    mod_instrument: 3
    mod_note: Cs2

voice_map:
  # $00 — Alg 0, FB 1 — used by FM2, FM3
  0:
    - low:  G3
      high: A4
      mod_instrument: 4
      root: G2
  # $01 — Alg 4, FB 5 — used by FM3
  1:
    - low:  A4
      high: G5
      mod_instrument: 5
      root: A2
  # $02 — Alg 5, FB 7 — used by FM1, FM4, FM5
  2:
    - low:  B5
      high: B6
      mod_instrument: 6
      root: B2

  # $03 — Alg 1, FB 5 — used by FM1, FM3
  3:
    - low:  C6
      high: C7
      mod_instrument: 7
      root: C2

  # $04 — Alg 5, FB 7 — used by FM4, FM5
  4:
    - low:  B4
      high: B5
      mod_instrument: 8
      root: B2

    - low:  C6
      high: Cs6
      mod_instrument: 9
      root: C2

  # $05 — Alg 0, FB 6 — used by FM1, FM4
  5:
    - low:  G4
      high: B5
      mod_instrument: 10
      root: G2

    - low:  C6
      high: Gs6
      mod_instrument: 11
      root: C2

  # $06 — Alg 5, FB 7 — used by FM5
  6:
    - low:  G5
      high: G6
      mod_instrument: 12
      root: G2

psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 17     # plays with the envelope the song has in force: fTone_04, the PSG3 header voice
    root: A3
    envelopes:
      fTone_08: 18         # the loop's smpsPSGvoice fTone_08 hi-hat gets its own sample

psg_voice_map:
  $00:
    low:  D5
    high: As5
    mod_instrument: 13
    root: D2
  fTone_06:
    low:  E6
    high: Gs6
    mod_instrument: 14
    root: E2
  fTone_05:
    low:  G6
    high: G7
    mod_instrument: 15
    root: G2

channel_instrument_map:
  FM3:
    0:
    - low:  G3
      high: A4
      mod_instrument: 20
      root: G2

  FM5:
    2:
    - low:  B5
      high: B6
      mod_instrument: 19
      root: B2


# -------------------------------------------------------------------------------------------------
# Structural pattern breaks to align to grid
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 1
    row: 31
  - pattern: 15
    row: 31