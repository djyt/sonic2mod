# Space Harrier II - Jelly Syndrome.  A minimal config: everything else is derived from the ROM
# (docs/todo/space_harrier_2.md); python convert.py <this> --show-config prints it.
name: "Jelly Syndrome"
input_file: "input/roms/Space Harrier II (World).md"
rom_song: "$8E"

sample_list:   # volumes set from the VGZ; the rest is derived
  - [1, "drum81.raw", 7, 0]   # VGZ: +3.8 dB at 11
  - [2, "drum85.raw", 19, 0]   # VGZ: +10.6 dB at 64
  - [3, "drum86.raw", 19, 0]   # VGZ: +10.4 dB at 64
  - [4, "drum87.raw", 18, 0]   # VGZ: +10.9 dB at 64
  - [5, "drum89.raw", 24, 0]   # VGZ: +8.7 dB at 64
  - [9, "fm_v0c_A0.raw", 10, 0]   # VGZ: -1.7 dB at 8
  - [14, "fm_v4e_D3.raw", 5, 0]   # VGZ: -8.1 dB at 2
  - [15, "fm_v4e_E4.raw", 5, 0]   # VGZ: -5.0 dB at 3
