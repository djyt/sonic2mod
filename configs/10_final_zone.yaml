# -------------------------------------------------------------------------------------------------
# Final Zone Conversion Script
# -------------------------------------------------------------------------------------------------
name: Final Zone
input_file: "input/Mus8D - FZ.asm"
output_file: output/10_final_zone.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 4
ticks_per_row: 1
num_mod_channels: 8
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 64, 0]
  - [2, "timpani.raw", 64, 0]
  # --- voice $00: alg 5: 1→(2+3+4), fb 7 — FM1, FM5 ---
  - [3, "fm_v00.raw", 55, 0] # VGZ: -4.8 dB at 32
  # --- voice $01: alg 0: 1→2→3→4, fb 4 — FM2 ---
  - [4, "fm_v01.raw", 32, 0]
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM3, FM4 ---
  - [5, "fm_v02_lo.raw", 32, 0]
  - [6, "fm_v02_hi.raw", 38, 0] # VGZ: -1.4 dB at 32
  # --- voice $03: alg 2: (1+(2→3))→4, fb 7 — FM4 ---
  - [7, "fm_v03_lo.raw", 27, 0] # VGZ: +1.5 dB at 32
  - [8, "fm_v03_hi.raw", 37, 0] # VGZ: -1.3 dB at 32

dac_samples:
  # dSnare: ×52 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 1
    mod_note: Fs3
  # dHiTimpani: ×13 — native ~9588 Hz → note Ds2
  - name: dHiTimpani
    mod_instrument: 2
    mod_note: Ds2
  # dLowTimpani: ×12 — native ~7154 Hz → note A1
  - name: dLowTimpani
    mod_instrument: 2
    mod_note: A1

voice_map:
  # $00 — alg 5: 1→(2+3+4), fb 7 — used by FM1, FM5
  0:
    - low:  A5
      high: B6
      mod_instrument: 3
      root: A2
      synth_root: A5
  # $01 — alg 0: 1→2→3→4, fb 4 — used by FM2
  1:
    - low:  C3
      high: E4
      mod_instrument: 4
      root: C2
      synth_root: C2
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM3, FM4
  2:
    - low:  A4
      high: B5
      mod_instrument: 5
      root: A2
      synth_root: A3
    - low:  C6
      high: E7
      mod_instrument: 6
      root: C2
      synth_root: C5
  # $03 — alg 2: (1+(2→3))→4, fb 7 — used by FM4
  3:
    - low:  E4
      high: B5
      mod_instrument: 7
      root: E2
      synth_root: E3
    - low:  C6
      high: D7
      mod_instrument: 8
      root: C2
      synth_root: C5
