# -------------------------------------------------------------------------------------------------
# STAGE CLEAR Conversion Script
# -------------------------------------------------------------------------------------------------
name: Stage Clear
input_file: "input/Mus8E - Sonic Got Through.asm"
output_file: output/11_stage_clear.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 1
num_mod_channels: 8
region: ntsc
range_space: chip          # ranges are the pitches the chip plays (tools/config_to_chip_space.py)

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7

sample_list:
  # --- percussion ---
  - [1, "snare.raw", 64, 0]
  - [2, "kick.raw", 64, 0]
  - [3, "timpani.raw", 64, 0]
  # --- voice $00: Alg 5, FB 7 — FM1 ---
  - [4, "fm_v00_lo.raw", 64, 0]
  - [5, "fm_v00_hi.raw", 64, 0]
  # --- voice $01: Alg 2, FB 7 — FM2 ---
  - [6, "fm_v01.raw", 25, 0] # VGZ: -0.0 dB at 32
  # --- voice $02: Alg 5, FB 7 — FM3, FM4 ---
  - [7, "fm_v02.raw", 22, 0] # VGZ: +1.2 dB at 32
  # --- voice $03: Alg 5, FB 7 — FM5 ---
  - [8, "fm_v03.raw", 33, 0] # VGZ: -8.3 dB at 16
  # --- PSG tone fTone_05 ---
  - [9, "psg_fTone_05_lo.raw",  5, 0] # baked: 32 at PSG attenuation 5 (−10 dB); VGZ: +4.4 dB at 10
  - [10, "psg_fTone_05_hi.raw",  3, 0] # baked: 32 at PSG attenuation 5 (−10 dB); VGZ: +4.0 dB at 5

dac_samples:
  # dSnare: ×7 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 1
    mod_note: Fs3
  # dKick: ×4 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 2
    mod_note: C2
  # dVLowTimpani: ×4 — native ~7006 Hz → note A1
  - name: dVLowTimpani
    mod_instrument: 3
    mod_note: A1
  # dHiTimpani: ×2 — native ~9588 Hz → note Ds2
  - name: dHiTimpani
    mod_instrument: 3
    mod_note: Ds2

voice_map:
  0:
    - low:  G3   # was G4-B5 (source bytes) for FM1
      high: G4
      mod_instrument: 4
      root: G2
      synth_root: G3
    - low:  G5   # was C6-C7 (source bytes) for FM1
      high: C6
      mod_instrument: 5
      root: G2
      synth_root: G5
  1:
    - low:  G1   # was G4-G5 (source bytes) for FM2
      high: G2
      mod_instrument: 6
      root: G2
      synth_root: G1
  2:
    - low:  A4   # was A5-D6 (source bytes) for FM4, FM3
      high: D5
      mod_instrument: 7
      root: A2
      synth_root: A4
  3:
    - low:  G4   # was G5-C6 (source bytes) for FM5
      high: C5
      mod_instrument: 8
      root: G2
      synth_root: G4
psg_voice_map:
  fTone_05:
    - low:  G3   # was G4-B5 (source bytes) for PSG1
      high: G4
      mod_instrument: 9
      root: G1
      synth_root: G3
    - low:  G5   # was G4-B5 (source bytes) for PSG2
      high: B5
      mod_instrument: 9
      root: G3
      synth_root: G5
    - low:  G5   # was C6-C7 (source bytes) for PSG1, PSG2
      high: C6
      mod_instrument: 10
      root: G1
      synth_root: G5
