# Time Trax (prototype) - Title Screen, Credits.  A minimal config: everything else is derived from the ROM
# (docs/todo/done/time_trax.md); python convert.py <this> --show-config prints it.
name: "Title Screen, Credits"
input_file: "input/roms/Time Trax (USA) (Proto).md"
rom_song: "$00"
region: pal               # the rips run at 50 Hz (docs/todo/done/time_trax.md D2)
level_patch_min: 3        # a voice copy within 3 TL steps (2.25 dB) of its voice plays as it
baked_slots: 4            # slots kept for baked drum sweeps and envelopes (core/plan/baked.py)
window_root: highest      # each window's root as high as its range and the 64 K limit allow: the most rate

sample_list:   # volumes set from the VGZ; the rest is derived
  - [3, "fm_v13_G2.raw", 27, 0]   # VGZ: +1.2 dB at 31
  - [7, "fm_v14_F2.raw", 36, 0]   # VGZ: -1.1 dB at 32
  - [8, "fm_v15_C3.raw", 16, 0]   # VGZ: -2.7 dB at 12
  - [2, "fm_v13_A1.raw", 31, 0]   # VGZ: -1.9 dB at 27
  - [4, "fm_v13_A3.raw", 28, 0]   # VGZ: +0.6 dB at 32
  - [15, "fm_v18_F4.raw", 36, 0] # VGZ: -1.1 dB at 32
  - [16, "fm_v19_G2.raw", 64, 0]   # VGZ: -9.5 dB at 29
  - [17, "fm_v1a_F2.raw", 48, 0]   # VGZ: -4.1 dB at 32
  - [18, "fm_v03_Bb4.raw", 37, 0]   # VGZ: -6.3 dB at 19
  - [23, "fm_v46_D0.raw", 32, 0]   # VGZ: -5.3 dB at 19
  - [24, "fm_v47_G4.raw", 18, 0] # VGZ: -1.3 dB at 16
  - [26, "fm_v4e_Cs4.raw", 55, 0] # VGZ: -4.5 dB at 33
  - [27, "fm_v4f_Cs4.raw", 43, 0] # VGZ: -1.1 dB at 38
