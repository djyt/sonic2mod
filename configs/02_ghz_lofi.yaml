# -------------------------------------------------------------------------------------------------
# GREEN HILL ZONE Conversion Script - LOFI VARIANT
# The 4-channel merged build squeezed to ~200 KB (212.5 KB): mixes made at the primary's note so
# looped leads, bass and chords keep their loops (mix_at: primary), drum banks at A2 (they sound
# 61 % of the song: 9 KB buys the hat treble to 7 kHz), chime mixes at F2, loops allowed to freeze 12 dB early, samples rendered at their root pitch, one mix per chord
# shape (merge_twins), and the composites that play one note each left out (max_composites: eight
# chime notes of the song play without their chime).  Same folds as 02_green_hill_zone.yaml.
# Where the bytes go: python tools/mod_audit.py output/02_ghz_lofi_merged.mod --banks
# -------------------------------------------------------------------------------------------------
name: "Green Hill Zone lofi"
input_file: "input/Mus81 - GHZ.asm"
output_file: "output/02_ghz_lofi.mod"
samples_dir: "samples/"

auto_bpm: true              # Derive BPM from SMPS tempo header
region: ntsc                # NTSC (60 Hz) or PAL (50 Hz)
target_speed: 3             # speed byte = $03 (smpsHeaderTempo $01, $03)
ticks_per_row: 2            # GCD of main note durations ($04,$08,$0C,$10,$18...) = 4


# -------------------------------------------------------------------------------------------------
# Channel layout
# -------------------------------------------------------------------------------------------------
channels:
  # Drums
  - source: DAC
    mod_channel: 0

  # FM1: intro call + main loop
  - source: FM1
    mod_channel: 1

  # FM2: bass channel only
  - source: FM2
    mod_channel: 2

  # FM3: countermelody + harmony
  - source: FM3
    mod_channel: 3

  # FM4: tremolo pad + melody
  - source: FM4
    mod_channel: 4

  # FM5: detuned double of FM4 (smpsAlterNote $02 ≈ +10 cents FNUM offset).
  # Routed via channel_instrument_map to finetune+1 variants.
  - source: FM5
    mod_channel: 5

  # PSG channels — melodic in GHZ; enabled for audio output.
  - source: PSG1
    mod_channel: 6

  - source: PSG2
    mod_channel: 7

  # PSG3: noise channel — smpsPSGform $E7, plays nMaxPSG rhythm.
  - source: PSG3
    mod_channel: 8


# -------------------------------------------------------------------------------------------------
# Auto-generated Samples
# Format: mod_instrument, filename, default volume, finetuning
# -------------------------------------------------------------------------------------------------
#
# Volumes marked "VGZ" were set from tools/vgm_compare.py level measurements (L/R power) against
# reference/vgz/02 - Green Hill Zone.vgz, relative to FM2 = inst 3/4 at 32; see docs/audits/02_ghz_audit.md.
# With fm_volume_scaling: baked a volume here is the level of the instrument's MOST COMMON
# (channel TL, pan) combination; the converter adds Cxx only for notes at any other level.
sample_list:
  # --- percussion ---
  - [1,  "kick.raw",        64, 0]
  - [2,  "snare.raw",       64, 0]
  # --- voice $00: deep bass (FM2 opening) ---
  - [3,  "ghz_v00.raw",     32, 0]
  # --- voice $01: bass/rhythm pad (FM2 main loop) ---
  - [4,  "ghz_v01.raw",     32, 0]
  # --- voice $02: bright lead (FM1 intro, FM3 opening) ---
  - [5,  "ghz_v02.raw",     26, 0] # VGZ: -1.9 dB at 21
  # --- voice $04: bell arp (FM4/FM5 ending section) ---
  - [6,  "ghz_v04.raw",      13, 0] # VGZ: -3.1 dB at 9
  - [8,  "ghz_v04.raw",     20, 1] # Same sample, finetune +1 (~+12.5 cents).; VGZ: -2.5 dB at 15
  # --- voice $05: main melody (FM1/FM3/FM4/FM5) ---
  - [10, "ghz_v05.raw",     29, 0] # VGZ: -2.8 dB at 21
  - [11, "ghz_v05_lo.raw",   10, 0] # VGZ: -2.8 dB at 7
  # --- voice $06: FM1 melodic fills (smpsAlterPitch sections) ---
  - [12, "ghz_v06.raw",     54, 0] # VGZ: -2.3 dB at 41
  # --- voice $07: bridge voice (FM1/FM3/FM4) ---
  - [13, "ghz_v07.raw",     24, 0] # VGZ: -4.2 dB at 15
  # --- voice $08: bright synth (FM3/FM4/FM5 main) ---
  - [14, "ghz_v08.raw",     21, 0] # VGZ: -2.3 dB at 16
  - [15, "ghz_v08_hi.raw",  32, 0] # VGZ: -2.4 dB at 24
  # --- PSG White Noise ---
  - [16, "psg_noise.raw",    4, 0] # VGZ: +6.0 dB at 7
  # --- PSG Voices ---
  - [17, "psg_tone01.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)
  - [18, "psg_tone03.raw",  16, 0]
  - [19, "psg_tone05.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)
  - [20, "psg_tone06.raw",  13, 0] # baked: 16 at PSG attenuation 1 (−2 dB)


# -------------------------------------------------------------------------------------------------
# DAC Mappings: Kick & Snare for GHZ only
# -------------------------------------------------------------------------------------------------
dac_samples:
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3


# -------------------------------------------------------------------------------------------------
# Per-voice instrument splits by source-note range.
# -------------------------------------------------------------------------------------------------
voice_map:
  # $00 → deep bass
  0:
    - low:  C2
      high: B4
      mod_instrument: 3
      root: C2

  # $01 → bass/rhythm pad
  1:
    - low:  C2
      high: B4
      mod_instrument: 4
      root: C2

  # $02 → bright lead
  2:
    - low:  C6
      high: B7
      mod_instrument: 5
      root: C2

  # $04 → bell arp
  4:
    - low:  C6
      high: E7
      mod_instrument: 6
      root: C2

  # $05 → main melody
  5:
    - low:  C4
      high: B5
      mod_instrument: 11
      root: C2
    - low:  C6
      high: B7
      mod_instrument: 10
      root: C2

  # $06 → FM1 fills
  6:
    - low:  C6
      high: B7
      mod_instrument: 12
      root: C2

  # $07 → bridge
  7:
    - low:  C5
      high: B5
      mod_instrument: 13
      root: C2
  # $08 → bright synth
  8:
    - low:  C5
      high: B5
      mod_instrument: 14
      root: C2
    - low:  C6
      high: B6
      mod_instrument: 15
      root: C2


# -------------------------------------------------------------------------------------------------
# PSG Sounds
# -------------------------------------------------------------------------------------------------
psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 16
    root: A3               # target_rate ≈ 27928 Hz

psg_voice_map:
  fTone_01:
    mod_instrument: 17
    root: A2
  fTone_03:
    mod_instrument: 18
    root: A2
  fTone_05:
    mod_instrument: 19
    root: A2
  fTone_06:
    mod_instrument: 20
    low: A6
    root: A2


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM5 applies smpsAlterNote $02 (FNUM offset ≈ +10 cents) during voice $04
# bell-arp sections to create the chorus detune effect vs FM4.  The same
# source notes route to inst 8/9 (identical audio to inst 6/7, finetune +1).
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM5:
    4:                        # voice $04 on FM5 (bell arp, detuned)
      - low:  C6              # bottom of FM5 arp range
        high: B7              # top
        root: C2
        mod_instrument: 8    # same audio as inst 6, finetune +1


# -------------------------------------------------------------------------------------------------
# Structural pattern break: GHZ intro fills rows 0-31 of pattern 0; the loop begins at row 32.
# A Bxx at row 31 jumps cleanly to pattern 1 instead of playing 32 rows of silence.
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 31


# -------------------------------------------------------------------------------------------------
# Merge Channels
# 
# DAC = DAC Drums, FM1 = Lead, FM2 = Bass, PSG3 = Hi-Hat
# -------------------------------------------------------------------------------------------------


merge_bank_slots: 2             # Sample slots to reserve for the DAC drum banking (1 bank at A2)
merge_twins: always             # one mix per chord shape, even with slots to spare (the lead chord's twins: 7 KB)
loop_drift_db: 12               # loops may freeze 12 dB above the settled level: shorter samples
merge_max_synth_shift: 0        # render every sample at its root pitch: half the bytes of an octave up


merge_patterns:

    # --- Pattern $00 ------------------------------------------------------------------------------
  - patterns: "0"
    drop: [FM4, FM5, PSG1, PSG2]
    groups:
        # Channel 0: Combine Drums
      - primary: DAC
        followers: [PSG3]
        cut_primary: true    # Allow a secondary channel to take priority over the primary
        bank: true           # Group multiple sounds in a single sample
        mix_note: A2         # drum mixes at 14 kHz: the hat keeps up to 7 kHz (F2: 5.5, C2 lost it altogether)
        
        
   # --- Pattern $01-$04 ---------------------------------------------------------------------------
  - patterns: "1-4"
    groups:
        # Channel 0: Combine Drums & Bass
      - primary: DAC
        followers: [FM2, PSG3]
        cut_primary: true
        bank: true
        max_composites: 12   # the 12 most-played drum+bass sounds; rarer ones use a same-shape stand-in or the drum alone
        mix_note: A2         # drum mixes at 14 kHz: the hat keeps up to 7 kHz (F2: 5.5, C2 lost it altogether)
        
        # Channel 1: Combine 4 Lead Channels
      - primary: FM5
        followers: [FM3, FM4, PSG1]
        mod_channel: 1
        mix_at: primary      # the chord keeps its loop; the chime is resampled down into it
        
        # Channel 2: Move Arps
      - primary: PSG2
        mod_channel: 2
        
         # Channel 3: Move FM1 Fade Out to less important channel
      - primary: FM1
        mod_channel: 3
        
        
    # --- Pattern $05-$0C ---------------------------------------------------------------------------     
  - patterns: "5-c"
    groups:
        # Channel 0: Combine Drums & Bass
      - primary: DAC
        followers: [FM2, PSG3]
        cut_primary: true
        bank: true
        max_composites: 12   # the 12 most-played drum+bass sounds; rarer ones use a same-shape stand-in or the drum alone
        mix_note: A2         # drum mixes at 14 kHz: the hat keeps up to 7 kHz (F2: 5.5, C2 lost it altogether)
        
        # Channel 1: Remains as-is (Lead)
        
        # Channel 2: Sub-Melody (Combined)
      - primary: FM4
        followers: [FM5]
        mod_channel: 2
        
        # Channel 3: PSG Bleeps and Response Melody
      - primary: PSG1
        followers: [PSG2, FM3]
        cut_primary: true
        mod_channel: 3
        mix_note: F2         # chime mixes at 11 kHz instead of 21
        max_composites: 3    # two more chords are one note each (0.4 % of the song, 5.6 KB)
        
        
    # --- Pattern $0D-$0F ---------------------------------------------------------------------------      
  - patterns: "d-10"
    groups:
        # Channel 0: Combine Drums
      - primary: DAC
        followers: [PSG3]
        cut_primary: true
        bank: true
        mix_note: A2         # drum mixes at 14 kHz: the hat keeps up to 7 kHz (F2: 5.5, C2 lost it altogether)
        
        # Channel 1: Lead + PSG2
      - primary: FM1
        followers: [PSG2]
        mod_channel: 1
        mix_at: primary      # the lead keeps its loop under the chime
        max_composites: 1    # a second lead+chime mix is one note (0.4 % of the song, 6 KB)
        
        # Channel 2: Bass + PSG1
      - primary: FM2
        followers: [PSG1]
        mod_channel: 2
        mix_note: F2         # bass+chime mixes at 11 kHz (the bass notes here are short)
        max_composites: 2    # the 18 notes of the two common chords; five more are one note each (23 KB)

        # Channel 3: Chords
      - primary: FM3
        followers: [FM4]
        mod_channel: 3
        cut_after: 8            # Allow filled notes (FM5 below) to cut FM3 after 8 ticks
        
        # Channel 4: arp
      - primary: FM5
        fill: true
