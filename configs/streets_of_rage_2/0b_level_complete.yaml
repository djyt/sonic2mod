# Streets of Rage 2 - Level Complete.  A minimal config: everything else is derived from the ROM
# (docs/todo/done/streets_of_rage_2.md); python convert.py <this> --show-config prints it.
name: "Level Complete"
input_file: "input/roms/Streets of Rage 2 (USA).md"
rom_song: "$0B"
window_root: highest      # each window's root as high as its range and the 64 K limit allow: the most rate

sample_list:   # volumes set from the VGZ; the rest is derived
  - [1, "dac81.raw", 55, 5]   # VGZ: +1.4 dB at 64
  - [2, "dac82.raw", 55, -2]   # VGZ: +1.3 dB at 64
  - [3, "dac83.raw", 54, -2]   # VGZ: +1.4 dB at 64
  - [4, "fm_v01_D2.raw", 25, 0]   # VGZ: +2.1 dB at 32
  - [13, "fm_v07_E4.raw", 17, 0]   # VGZ: -3.7 dB at 11
  - [14, "fm_v07_D5.raw", 17, 0]   # VGZ: -3.5 dB at 11
  - [15, "fm_v08_E1.raw", 11, 0]   # VGZ: +3.5 dB at 16
  - [16, "fm_v09_C3.raw", 16, 0]   # VGZ: +2.9 dB at 23
