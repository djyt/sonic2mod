# Streets of Rage 2 - Game Over.  A minimal config: everything else is derived from the ROM
# (docs/todo/done/streets_of_rage_2.md); python convert.py <this> --show-config prints it.
name: "Game Over"
input_file: "input/roms/Streets of Rage 2 (USA).md"
rom_song: "$19"
window_root: highest      # each window's root as high as its range and the 64 K limit allow: the most rate

sample_list:   # volumes set from the VGZ; the rest is derived
  - [1, "dac81.raw", 49, 5]   # VGZ: +2.3 dB at 64
  - [2, "dac82.raw", 50, -2]   # VGZ: +2.1 dB at 64
  - [3, "fm_v00_E3.raw", 37, 0]   # VGZ: -1.2 dB at 32
  - [5, "fm_v01_A3.raw", 22, 0]   # VGZ: -1.1 dB at 19
  - [6, "fm_v02_E4.raw", 10, 0]   # VGZ: +1.4 dB at 12
