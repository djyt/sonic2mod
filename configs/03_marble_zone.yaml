# -------------------------------------------------------------------------------------------------
# MARBLE ZONE Conversion Script
# -------------------------------------------------------------------------------------------------
name: Marble Zone
input_file: "input/Mus83 - MZ.asm"
output_file: output/03_marble_zone.mod
samples_dir: "samples/"

auto_bpm: true
target_speed: 3
ticks_per_row: 1
num_mod_channels: 10
region: ntsc

channels:
  - source: DAC
    mod_channel: 0
  - source: FM1
    mod_channel: 1
  - source: FM2
    mod_channel: 2
  - source: FM3
    mod_channel: 3
  - source: FM4
    mod_channel: 4
  - source: FM5
    mod_channel: 5
  - source: PSG1
    mod_channel: 6
  - source: PSG2
    mod_channel: 7
  - source: PSG3
    mod_channel: 8

sample_list:
  # --- percussion ---
  - [1, "kick.raw", 64, 0]
  - [2, "snare.raw", 64, 0]
  # --- voice $00: alg 2: (1+(2→3))→4, fb 4 — FM1, FM3 ---
  - [3, "fm_v00.raw",  9, 0] # VGZ: +11.5 dB at 32
  # --- voice $01: alg 2: (1+(2→3))→4, fb 7 — FM2 ---
  - [4, "fm_v01.raw", 15, 0] # VGZ: +6.9 dB at 32
  # --- voice $02: alg 2: (1+(2→3))→4, fb 7 — FM4, FM5 ---
  - [5, "fm_v02.raw",  8, 0] # VGZ: +12.1 dB at 32
  # --- voice $03: alg 3: ((1→2)+3)→4, fb 4 — FM4 ---
  - [6, "fm_v03.raw", 14, 0] # VGZ: +6.9 dB at 32
  # --- voice $04: alg 2: (1+(2→3))→4, fb 0 — FM5 ---
  - [7, "fm_v04.raw", 10, 0] # VGZ: +9.8 dB at 32
  # --- PSG tone fTone_08 ---
  - [8, "psg_fTone_08_lo.raw",  7, 0] # baked: 64 at PSG attenuation 3 (−6 dB); VGZ: +13.5 dB at 32
  - [9, "psg_fTone_08_hi.raw",  6, 0] # baked: 64 at PSG attenuation 3 (−6 dB); VGZ: +14.1 dB at 32
  # --- PSG noise (form $E7) ---
  # psg_map[0xE7] uses instrument 10.  It used to have no line here (so it played at the default 64)
  # while a line for the unused instrument 11 carried the intended volume; measured against the VGZ.
  - [10, "psg_noise.raw", 13, 0] # baked: 64 at PSG attenuation 3 (−6 dB); VGZ: +7.7 dB at 32
  # --- voice $00: tuned!
  - [12, "fm_v00.raw",  9, 1] # VGZ: -0.7 dB at 8

dac_samples:
  # dKick: ×2 — native ~8250 Hz → note C2
  - name: dKick
    mod_instrument: 1
    mod_note: C2
  # dSnare: ×1 — native ~24000 Hz → note Fs3
  - name: dSnare
    mod_instrument: 2
    mod_note: Fs3

voice_map:
  # $00 — alg 2: (1+(2→3))→4, fb 4 — used by FM1, FM3
  0:
    - low:  A5
      high: B6
      mod_instrument: 3
      root: A2
      synth_root: A3
  # $01 — alg 2: (1+(2→3))→4, fb 7 — used by FM2
  1:
    - low:  E3
      high: B4
      mod_instrument: 4
      root: E2
      synth_root: E1
  # $02 — alg 2: (1+(2→3))→4, fb 7 — used by FM4, FM5
  2:
    - low:  D6
      high: E7
      mod_instrument: 5
      root: D2
      synth_root: D4
  # $03 — alg 3: ((1→2)+3)→4, fb 4 — used by FM4
  3:
    - low:  E4
      high: E5
      mod_instrument: 6
      root: E2
      synth_root: E2
  # $04 — alg 2: (1+(2→3))→4, fb 0 — used by FM5
  4:
    - low:  E3
      high: E4
      mod_instrument: 7
      root: E2
      synth_root: E4

psg_map:
  0xE7:                    # form $E7 — white noise, LFSR follows PSG3's own tone register $C0 (rate 3)
    mod_instrument: 10
    root: A2               # MOD anchor — A2 keeps all PSG3 notes (up to E4) within MOD range with no clamping
    low: A3                # SMPS pitch anchor — nA3 (sem 45) → MOD A2; each semitone above/below shifts output ±1
    noise_rate: 3
    envelope: fTone_09     # PSG3 header voice (smpsPSGform changes noise type only, not envelope)
    base_volume: 0

psg_voice_map:
  fTone_08:
    - low:  F5
      high: B6
      mod_instrument: 8
      root: F2
      synth_root: F4   # pitch audit: was F5, 12 semitones too high
    - low:  C7
      high: F7
      mod_instrument: 9
      root: C2
      synth_root: C6   # pitch audit: was C7, 12 semitones too high


# -------------------------------------------------------------------------------------------------
# Per-channel instrument-map overrides.
#
# FM3 shares FM1's data, but tuned with smpsAlterNote $02
# -------------------------------------------------------------------------------------------------
channel_instrument_map:
  FM3:
    0:
    - low:  A5
      high: B6
      mod_instrument: 12
      root: A2
      synth_root: A3


# -------------------------------------------------------------------------------------------------
# Structural pattern break after intro
# -------------------------------------------------------------------------------------------------
mod_pattern_breaks:
  - pattern: 0
    row: 59