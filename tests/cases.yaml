# The MOD regression cases (tests/regression.py): each converts a config with tests/settings.yaml and
# must match its baseline byte for byte.  Grouped by game; `--only` takes a case or a group.
#
#   name      the case; its baseline tests/baselines/<baseline or name>_baseline.mod
#   config    configs/<config>.yaml
#   variant   convert.py --variant
#   of        a ROM case: the case whose baseline it shares, read from `input` at `rom_song`
#   why       what it covers that no other case does
#
# A config with merge: / merge_patterns: is a second case, <name>_merged.  A case whose ROM is not
# here (input/roms/, not in git) is left out.  A song joins only for what no case covers yet:
# choose by coverage (tests/selection.py records what each case runs).

sonic1:     # every song: the reference driver
  - {name: title_screen, config: sonic_1/01_title_screen, why: Title Screen}
  - {name: green_hill_zone, config: sonic_1/02_green_hill_zone, baseline: ghz, why: Green Hill Zone}
  - {name: ghz_lofi, config: sonic_1/02_green_hill_zone, variant: lofi,
     why: "Green Hill Zone lofi - mix_at: primary, A2 banks, loop_drift_db 20, root-pitch samples, merge_twins: always"}
  - {name: marble_zone, config: sonic_1/03_marble_zone, why: Marble Zone - pitched rate-3 noise}
  - {name: spring_yard_zone, config: sonic_1/04_spring_yard_zone, why: Spring Yard Zone - notes below the PSG table}
  - {name: lab_zone, config: sonic_1/05_lab_zone, why: Labyrinth Zone - rootless PSG entry + channel transpose}
  - {name: star_light_zone, config: sonic_1/06_star_light_zone, why: "Star Light Zone - range_space: chip"}
  - {name: scrap_brain_zone, config: sonic_1/07_scrap_brain_zone, why: Scrap Brain Zone - PSG3 noise envelope variants}
  - {name: special_stage, config: sonic_1/08_special_stage, why: Special Stage}
  - {name: robotnik, config: sonic_1/09_robotnik, why: Robotnik}
  - {name: robotnik_lofi, config: sonic_1/09_robotnik, variant: lofi, why: "Robotnik lofi - loop_drift_db 12, bass mixes at C2"}
  - {name: final_zone, config: sonic_1/10_final_zone, why: Final Zone}
  - {name: stage_clear, config: sonic_1/11_stage_clear, why: "Stage Clear - range_space: chip"}
  - {name: stage_clear_lofi, config: sonic_1/11_stage_clear, variant: lofi, why: Stage Clear lofi - lead and harmony mixes at F2}
  - {name: ending_theme, config: sonic_1/12_ending_theme, why: "Ending - range_space: chip, PSG2 own instrument"}
  - {name: credits, config: sonic_1/13_credits, why: "Credits - tempo steps, global divider, chip space, 31 instruments"}
  - {name: invincibility, config: sonic_1/14_invincibility, why: "Invincibility - range_space: chip"}
  - {name: invincibility_lofi, config: sonic_1/14_invincibility, variant: lofi, why: Invincibility lofi - hat at A2, the bass looped}
  - {name: extra_life, config: sonic_1/15_1up, why: Extra Life}
  - {name: extra_life_lofi, config: sonic_1/15_1up, variant: lofi,
     why: Extra Life lofi - the bass pair on a sliding loop, harmony mixes at F2}
  - {name: chaos_emerald, config: sonic_1/16_chaos_emerald, why: Chaos Emerald}
  - {name: drowning, config: sonic_1/17_drowning, why: Drowning - mid-song smpsSetTempoMod}
  - {name: continue_screen, config: sonic_1/18_continue_screen, why: "Continue - range_space: chip, key changes"}
  - {name: continue_screen_lofi, config: sonic_1/18_continue_screen, variant: lofi,
     why: Continue lofi - bass and lead sliding loops, chords at 12 dB}
  - {name: game_over, config: sonic_1/19_game_over, why: Game Over}
  - {name: game_over_lofi, config: sonic_1/19_game_over, variant: lofi, why: Game Over lofi - bass and lead looped early, the bass at C2}

sonic1_rom:  # read from the ROM's bytecode: byte for byte the asm case's MOD
  - {name: title_screen_rom, of: title_screen, input: input/roms/sonic_rev01.bin, rom_song: $8A, why: the ROM reader}
  - {name: green_hill_zone_rom, of: green_hill_zone, input: input/roms/sonic_rev01.bin, rom_song: $81, why: the ROM reader}
  - {name: marble_zone_rom, of: marble_zone, input: input/roms/sonic_rev01.bin, rom_song: $83, why: a same-length data fix}
  - {name: credits_rom, of: credits, input: input/roms/sonic_rev01.bin, rom_song: $91, why: a spliced data fix}

moonwalker:  # SMPS 68k Type 1a, minimal configs; chosen by line coverage over its 22 songs (2026-10-09)
  - {name: mw_beat_it, config: moonwalker/82_beat_it, why: the driver's common path}
  - {name: mw_title, config: moonwalker/86_title, why: 76 lines no other Moonwalker song runs}
  - {name: mw_mr_big, config: moonwalker/89_mr_big, why: 37 more}

golden_axe:  # SMPS Z80 Type 0 FM, minimal configs; chosen by line coverage over its 13 songs (2026-10-09)
  - {name: ga_the_battle, config: golden_axe/89_the_battle, why: the driver's common path}
  - {name: ga_theme_of_thief, config: golden_axe/8b_theme_of_thief, why: 47 lines no other Golden Axe song runs}
  - {name: ga_conclusion, config: golden_axe/8d_conclusion, why: 23 more (FM drums)}

space_harrier_2:  # early SMPS Z80, minimal configs; chosen by line coverage over its 20 songs (2026-10-10)
  - {name: sh2_an_epitaph, config: space_harrier_2/95_an_epitaph, why: "the driver's common path (pitch envelopes, drums with their PSG part)"}
  - {name: sh2_game_over, config: space_harrier_2/97_game_over, why: "48 lines no other Space Harrier II song runs (a song that stops, a row grid divided)"}
  - {name: sh2_motion, config: space_harrier_2/98_motion, why: "30 more (a jump's second pass, loops out of step)"}
  - {name: sh2_winners_flight, config: space_harrier_2/94_winners_flight, why: "27 more (the pan animation's 8xx, legato)"}
  - {name: sh2_harrier_saga, config: space_harrier_2/81_harrier_saga, why: "10 more (alter volume, transposition; legato's rests key off)"}
